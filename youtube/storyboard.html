<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>콘티 — Wicked Wiki</title>
<link rel="stylesheet" href="/youtube/style.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0f0a14">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  .seg-item { border:2px solid transparent; }
  .seg-item:focus-within { border-color:#7cff4a; }
  .seg-item .seg-head { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .seg-item .seg-no { background:#0f0a14; color:#7cff4a; font-weight:800; font-size:0.8rem; width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .seg-duration { display:flex; align-items:center; gap:6px; font-size:0.8rem; color:#a89bb5; }
  .seg-duration-display { font-weight:700; color:#ffffff; }
  .seg-duration-edit, .seg-duration-save { width:auto; padding:4px 10px; font-size:0.7rem; margin:0; }
  .seg-duration-input { width:64px; padding:4px 6px; font-size:0.8rem; margin:0; }
  .seg-item input, .seg-item textarea { font-size:0.9rem; padding:8px 10px; margin-bottom:8px; }
  .seg-script, .seg-direction { min-height:50px; background:#17141c; color:#ffffff; resize:none; overflow:hidden; }
  .seg-thumbs { display:flex; gap:8px; overflow-x:auto; margin-bottom:8px; }
  .seg-thumb-wrap { position:relative; flex-shrink:0; }
  .seg-thumb { width:90px; height:90px; border-radius:3px; object-fit:cover; background:#0f0a14; display:block; }
  .seg-thumb-del { position:absolute; top:2px; right:2px; width:18px; height:18px; padding:0; border-radius:50%; background:#3a1414; color:#ff8a80; font-size:0.65rem; line-height:1; }
  .seg-thumb-empty { width:100%; height:50px; border-radius:3px; background:#0f0a14; margin-bottom:8px; display:flex; align-items:center; justify-content:center; color:#a89bb5; font-size:0.8rem; text-align:center; padding:8px; }
  .seg-actions label { width:100%; padding:8px 10px; font-size:0.75rem; margin:0; display:block; }
  .seg-actions input[type="file"] { display:none; }
  .seg-file-label { background:#221a2e; }
  .seg-save-btn { margin-top:4px; }
  .seg-save-btn.dirty { background:#3a2f14; color:#ffd93d; }
  .runtime-summary { background:#17141c; border-radius:3px; padding:10px 14px; margin-top:14px; font-size:0.85rem; color:#7cff4a; font-weight:700; }
  .runtime-summary .note { color:#a89bb5; font-weight:400; font-size:0.75rem; display:block; margin-top:2px; }
  .seg-pexels-preview { display:none; margin:-4px 0 10px; background:#0f0a14; border-radius:3px; padding:8px; }
  .seg-pexels-preview.open { display:block; }
  .seg-pexels-loading { color:#a89bb5; font-size:0.75rem; padding:4px; }
  .seg-pexels-grid { display:flex; gap:8px; overflow-x:auto; }
  .seg-pexels-item { flex-shrink:0; width:80px; }
  .seg-pexels-thumb-wrap { position:relative; width:80px; height:100px; border-radius:3px; overflow:hidden; background:#221a2e; cursor:pointer; }
  .seg-pexels-thumb-wrap img, .seg-pexels-thumb-wrap video { width:100%; height:100%; object-fit:cover; display:block; }
  .seg-pexels-pick { width:80px; margin-top:4px; padding:5px 0; font-size:0.7rem; }
  .seg-pexels-dur { position:absolute; bottom:2px; right:4px; background:rgba(0,0,0,0.7); color:#fff; font-size:0.6rem; padding:1px 4px; border-radius:2px; }
</style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="/youtube/index.html">← Wicked Wiki</a>
    <h1 style="font-size:1.4rem;margin-bottom:1.2rem;">콘티</h1>
    <p class="role">대본을 장면별로 나눠 보여줍니다. 사진·영상을 직접 올리면(여러 개 가능) 그 장면엔 자동검색 대신 그 소재들이 쓰입니다. 대사/ACTION(연출 지시)/장면 설명은 고쳐 쓸 수 있고, 검색키워드는 참고용입니다.</p>

    <label for="scriptSelect">대본 선택</label>
    <select id="scriptSelect">
      <option value="">불러오는 중...</option>
    </select>

    <div id="regenWrap" style="display:none;margin-top:10px;">
      <button type="button" id="regenBtn">콘티 (다시) 생성</button>
      <button type="button" id="addSegBtn" style="margin-top:8px;background:#221a2e;">+ 장면 추가</button>
    </div>
    <div class="msg" id="msg"></div>

    <div class="runtime-summary" id="runtimeSummary" style="display:none;"></div>

    <div id="segList" style="margin-top:20px;"><div class="empty">대본을 먼저 선택하세요.</div></div>
  </div>

<script>
  const SUPABASE_URL = "https://oenqrlgmnkpzxsavnfyo.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_sZ4wQgaC5f-i40pVzf0vIA_R7iJWDf5";
  const BUCKET = "youtube-assets";
  const headers = {
    apikey: SUPABASE_ANON_KEY,
    Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
  };
  const jsonHeaders = { ...headers, "Content-Type": "application/json" };
  let scripts = [];
  let segments = [];

  function escapeAttr(s) {
    return String(s ?? "").replace(/"/g, "&quot;");
  }
  function escapeHtml(s) {
    return String(s ?? "").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  function showMsg(text, ok) {
    const msg = document.getElementById("msg");
    msg.className = "msg " + (ok ? "ok" : "err");
    msg.textContent = text;
  }

  function publicUrl(path) {
    return `${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${path}`;
  }

  function isImage(path) {
    return /\.(jpe?g|png|gif|webp)$/i.test(path);
  }

  // asset_paths에는 직접 올린 파일의 스토리지 경로 또는 Pexels에서 고른 영상의 전체 URL이 섞여 들어간다.
  function isExternalUrl(path) {
    return /^https?:\/\//.test(path);
  }
  function assetUrl(path) {
    return isExternalUrl(path) ? path : publicUrl(path);
  }

  function thumbsHtml(seg) {
    const paths = seg.asset_paths || [];
    if (!paths.length) return '<div class="seg-thumb-empty">비어있음 — 키워드로 자동 검색됨</div>';
    return `<div class="seg-thumbs">${paths.map((p) => `
      <div class="seg-thumb-wrap" data-path="${escapeAttr(p)}">
        ${isImage(p)
          ? `<img class="seg-thumb" src="${assetUrl(p)}" alt="">`
          : `<video class="seg-thumb" src="${assetUrl(p)}" muted preload="metadata"></video>`}
        <button type="button" class="seg-thumb-del" data-path="${escapeAttr(p)}">×</button>
      </div>`).join("")}</div>`;
  }

  function bindThumbDeletes(el, id) {
    el.querySelectorAll(".seg-thumb-del").forEach((btn) =>
      btn.addEventListener("click", () => removeSegmentAsset(id, btn.dataset.path))
    );
  }

  // 다른 칸에 입력 중이던 내용을 날리지 않도록, 소재 영역만 다시 그린다.
  function refreshThumbs(id) {
    const el = document.querySelector(`.seg-item[data-id="${id}"]`);
    const seg = segments.find((s) => String(s.id) === id);
    if (!el || !seg) return;
    el.querySelector(".seg-thumbs-area").innerHTML = thumbsHtml(seg);
    bindThumbDeletes(el, id);
  }

  // 한국어 내레이션 기준 대략적인 발화 속도 추정치(초당 글자 수) — 정확한 값은
  // 실제 TTS가 돌아야 알 수 있어서, 어디까지나 대략적인 예측용.
  const CHARS_PER_SEC = 4.3;

  function estimateSeconds(text) {
    const len = (text || "").replace(/\s+/g, "").length;
    return Math.max(1, len / CHARS_PER_SEC);
  }

  function effectiveSeconds(el, seg) {
    if (seg && seg.target_seconds > 0) return Number(seg.target_seconds);
    return estimateSeconds(el.querySelector(".seg-script").value);
  }

  function updateRuntimeSummary() {
    const box = document.getElementById("runtimeSummary");
    const cards = Array.from(document.querySelectorAll(".seg-item"));
    if (!cards.length) { box.style.display = "none"; return; }

    const perCard = cards.map((el) => ({
      el, seconds: effectiveSeconds(el, segments.find((s) => String(s.id) === el.dataset.id)),
    }));
    const total = perCard.reduce((sum, c) => sum + c.seconds, 0);

    perCard.forEach(({ el, seconds }) => {
      const pct = total > 0 ? (seconds / total) * 100 : 0;
      const display = el.querySelector(".seg-duration-display");
      if (display) display.textContent = `${seconds.toFixed(1)}초 (${pct.toFixed(0)}%)`;
    });

    box.style.display = "block";
    box.innerHTML = `전체 예상 길이: 약 ${total.toFixed(1)}초 (${(total / 60).toFixed(1)}분)` +
      `<span class="note">대사 기준 추정치이며, 실제 음성 속도에 따라 달라질 수 있습니다. 장면 번호 옆 "수정"으로 노출 시간을 직접 바꿀 수 있어요.</span>`;
  }

  async function loadScripts() {
    const sel = document.getElementById("scriptSelect");
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/youtube_scripts?select=*&status=eq.approved&order=created_at.desc`, { headers });
      scripts = await res.json();
      if (!scripts.length) {
        sel.innerHTML = '<option value="">승인된 대본이 없습니다</option>';
        return;
      }
      sel.innerHTML = '<option value="">선택하세요</option>' +
        scripts.map((r) => `<option value="${r.id}">${(r.hook || "").slice(0, 30)}</option>`).join("");
    } catch (err) {
      sel.innerHTML = '<option value="">불러오기 실패</option>';
    }
  }

  async function loadSegments(scriptId) {
    const list = document.getElementById("segList");
    const regenWrap = document.getElementById("regenWrap");
    if (!scriptId) {
      list.innerHTML = '<div class="empty">대본을 먼저 선택하세요.</div>';
      regenWrap.style.display = "none";
      return;
    }
    list.innerHTML = '<div class="empty">불러오는 중...</div>';
    const res = await fetch(`${SUPABASE_URL}/rest/v1/youtube_segments?select=*&script_id=eq.${scriptId}&order=order_no.asc`, { headers });
    segments = await res.json();
    regenWrap.style.display = "block";
    document.getElementById("regenBtn").textContent = segments.length ? "콘티 다시 생성" : "콘티 생성";
    render();
  }

  function render() {
    const list = document.getElementById("segList");
    if (!segments.length) {
      list.innerHTML = '<div class="empty">아직 콘티가 없습니다. 위 "콘티 생성" 버튼을 눌러주세요.</div>';
      return;
    }
    list.innerHTML = segments.map((seg) => {
      return `
      <div class="card-box seg-item" data-id="${seg.id}" tabindex="0">
        <div class="seg-head">
          <div class="seg-no">${seg.order_no}</div>
          <div class="seg-duration">
            <span class="seg-duration-display"></span>
            <input type="number" class="seg-duration-input" step="0.1" min="0" style="display:none;">
            <button type="button" class="seg-duration-edit">수정</button>
            <button type="button" class="seg-duration-save" style="display:none;">저장</button>
          </div>
        </div>
        <div class="seg-thumbs-area">${thumbsHtml(seg)}</div>
        <div class="seg-actions" style="margin-bottom:4px;">
          <label class="seg-file-label">
            + 사진/영상 추가 (여러 개 선택 가능)
            <input type="file" class="seg-file-input" accept="image/*,video/*" multiple>
          </label>
        </div>
        <div style="color:#a89bb5;font-size:0.75rem;margin-bottom:10px;">이 카드 아무 곳이나 클릭한 뒤 Ctrl+V로도 이미지를 붙여넣을 수 있어요.</div>
        <label>대사</label>
        <textarea class="seg-script" placeholder="이 장면에서 나오는 대본 문장">${escapeHtml(seg.script_text)}</textarea>
        <label>ACTION (연출 지시 — 예: 천천히 줌인 / 좌에서 우로 패닝 / 카메라 틸트업)</label>
        <textarea class="seg-direction" placeholder="예: 천천히 줌인">${escapeHtml(seg.direction)}</textarea>
        <label>장면 설명</label>
        <input type="text" class="seg-section" value="${escapeAttr(seg.section)}" placeholder="장면 설명">
        <label>자료사진/영상 검색 키워드</label>
        <input type="text" class="seg-keyword" value="${escapeAttr(seg.keyword)}" placeholder="Pexels 검색 키워드 (영어)">
        <button type="button" class="seg-pexels-search-btn" style="background:#221a2e;">검색 미리보기</button>
        <div class="seg-pexels-preview"></div>
        <div style="display:flex;gap:8px;">
          <button type="button" class="seg-save-btn" style="flex:2;">저장</button>
          <button type="button" class="seg-revert-btn" style="flex:1;background:#221a2e;">되돌리기</button>
          <button type="button" class="seg-delete-btn" style="flex:1;background:#3a1414;color:#ff8a80;">삭제</button>
        </div>
      </div>
    `;
    }).join("");

    document.querySelectorAll(".seg-item").forEach((el) => {
      const id = el.dataset.id;
      const saveBtn = el.querySelector(".seg-save-btn");
      const markDirty = () => { saveBtn.classList.add("dirty"); saveBtn.textContent = "저장 (수정됨)"; };

      const scriptEl = el.querySelector(".seg-script");
      scriptEl.addEventListener("input", () => { autoGrow(scriptEl); markDirty(); updateRuntimeSummary(); });
      autoGrow(scriptEl);
      const directionEl = el.querySelector(".seg-direction");
      directionEl.addEventListener("input", () => { autoGrow(directionEl); markDirty(); });
      autoGrow(directionEl);
      el.querySelector(".seg-section").addEventListener("input", markDirty);
      const keywordEl = el.querySelector(".seg-keyword");
      const previewBox = el.querySelector(".seg-pexels-preview");
      keywordEl.addEventListener("input", markDirty);

      const triggerPexelsSearch = () => {
        const q = keywordEl.value.trim();
        if (!q) { showMsg("검색어를 먼저 입력하세요.", false); return; }
        searchPexelsPreview(previewBox, q, id);
      };
      el.querySelector(".seg-pexels-search-btn").addEventListener("click", triggerPexelsSearch);
      keywordEl.addEventListener("keydown", (e) => {
        if (e.key === "Enter") { e.preventDefault(); triggerPexelsSearch(); }
      });

      el.querySelector(".seg-file-input").addEventListener("change", (e) => uploadSegmentAssets(id, e.target.files));
      bindThumbDeletes(el, id);
      saveBtn.addEventListener("click", () => saveSegmentCard(id, el));
      el.querySelector(".seg-revert-btn").addEventListener("click", () => revertSegmentCard(id, el));
      el.querySelector(".seg-delete-btn").addEventListener("click", () => deleteSegmentCard(id, el));

      const durDisplay = el.querySelector(".seg-duration-display");
      const durInput = el.querySelector(".seg-duration-input");
      const durEditBtn = el.querySelector(".seg-duration-edit");
      const durSaveBtn = el.querySelector(".seg-duration-save");

      durEditBtn.addEventListener("click", () => {
        const seg = segments.find((s) => String(s.id) === id);
        durInput.value = effectiveSeconds(el, seg).toFixed(1);
        durDisplay.style.display = "none";
        durEditBtn.style.display = "none";
        durInput.style.display = "inline-block";
        durSaveBtn.style.display = "inline-block";
        durInput.focus();
        durInput.select();
      });

      durInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") durSaveBtn.click();
      });

      durSaveBtn.addEventListener("click", async () => {
        const raw = durInput.value;
        const value = raw === "" ? null : parseFloat(raw);
        durSaveBtn.disabled = true;
        try {
          const res = await fetch(`${SUPABASE_URL}/rest/v1/youtube_segments?id=eq.${id}`, {
            method: "PATCH", headers: jsonHeaders,
            body: JSON.stringify({ target_seconds: value }),
          });
          if (!res.ok) throw new Error(await res.text());
          const seg = segments.find((s) => String(s.id) === id);
          if (seg) seg.target_seconds = value;
          durInput.style.display = "none";
          durSaveBtn.style.display = "none";
          durDisplay.style.display = "inline";
          durEditBtn.style.display = "inline-block";
          updateRuntimeSummary();
          showMsg("노출 시간을 저장했습니다.", true);
        } catch (err) {
          showMsg("노출 시간 저장 실패: " + err.message, false);
        } finally {
          durSaveBtn.disabled = false;
        }
      });
    });

    updateRuntimeSummary();
  }

  function autoGrow(el) {
    el.style.height = "auto";
    el.style.height = el.scrollHeight + "px";
  }

  async function selectPexelsResult(id, hdUrl, btn) {
    const seg = segments.find((s) => String(s.id) === id);
    if (!seg || !hdUrl) return;
    const paths = seg.asset_paths || [];
    if (paths.includes(hdUrl)) { showMsg("이미 이 장면에 추가된 영상입니다.", false); return; }
    btn.disabled = true;
    try {
      await saveField(id, "asset_paths", [...paths, hdUrl]);
      refreshThumbs(id);
      btn.textContent = "추가됨 ✓";
      showMsg("선택한 영상을 이 장면 소재로 추가했습니다.", true);
    } catch (err) {
      btn.disabled = false;
      showMsg("영상 추가 실패: " + err.message, false);
    }
  }

  async function searchPexelsPreview(box, query, id) {
    box.classList.add("open");
    box.innerHTML = '<div class="seg-pexels-loading">Pexels에서 검색 중...</div>';
    try {
      const res = await fetch(`/api/pexels-search?q=${encodeURIComponent(query)}&orientation=portrait`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "검색 실패");
      if (!data.results.length) {
        box.innerHTML = '<div class="seg-pexels-loading">검색 결과가 없습니다.</div>';
        return;
      }
      const seg = segments.find((s) => String(s.id) === id);
      const already = new Set((seg && seg.asset_paths) || []);
      box.innerHTML = `<div class="seg-pexels-grid">${data.results.map((r) => `
        <div class="seg-pexels-item">
          <div class="seg-pexels-thumb-wrap" data-preview="${escapeAttr(r.preview_url)}">
            <img src="${r.thumbnail}?w=200" alt="" loading="lazy">
            <span class="seg-pexels-dur">${Math.round(r.duration)}s</span>
          </div>
          <button type="button" class="seg-pexels-pick" data-hd="${escapeAttr(r.hd_url)}" ${already.has(r.hd_url) ? "disabled" : ""}>
            ${already.has(r.hd_url) ? "추가됨 ✓" : "선택"}
          </button>
        </div>
      `).join("")}</div>
      <div class="seg-pexels-loading">썸네일을 누르면 미리 재생, "선택"을 누르면 이 장면 소재로 추가됩니다.</div>`;
      box.querySelectorAll(".seg-pexels-thumb-wrap").forEach((wrap) => {
        wrap.addEventListener("click", () => {
          const url = wrap.dataset.preview;
          if (!url || wrap.querySelector("video")) return;
          wrap.innerHTML = `<video src="${url}" autoplay muted loop playsinline></video>`;
        });
      });
      box.querySelectorAll(".seg-pexels-pick").forEach((btn) =>
        btn.addEventListener("click", () => selectPexelsResult(id, btn.dataset.hd, btn))
      );
    } catch (err) {
      box.innerHTML = `<div class="seg-pexels-loading">미리보기 실패: ${escapeHtml(err.message)}</div>`;
    }
  }

  async function refreshSegments(scriptId) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/youtube_segments?select=*&script_id=eq.${scriptId}&order=order_no.asc`, { headers });
    segments = await res.json();
    document.getElementById("regenBtn").textContent = segments.length ? "콘티 다시 생성" : "콘티 생성";
    const scrollY = window.scrollY;
    render();
    window.scrollTo(0, scrollY);
  }

  async function saveField(id, field, value) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/youtube_segments?id=eq.${id}`, {
      method: "PATCH",
      headers: jsonHeaders,
      body: JSON.stringify({ [field]: value }),
    });
    if (!res.ok) throw new Error(await res.text());
    const seg = segments.find((s) => String(s.id) === id);
    if (seg) seg[field] = value;
  }

  async function saveSegmentCard(id, el) {
    const btn = el.querySelector(".seg-save-btn");
    const scriptText = el.querySelector(".seg-script").value;
    const direction = el.querySelector(".seg-direction").value;
    const section = el.querySelector(".seg-section").value;
    const keyword = el.querySelector(".seg-keyword").value;

    btn.disabled = true;
    btn.textContent = "저장 중...";
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/youtube_segments?id=eq.${id}`, {
        method: "PATCH",
        headers: jsonHeaders,
        body: JSON.stringify({ script_text: scriptText, direction, section, keyword }),
      });
      if (!res.ok) throw new Error(await res.text());
      const seg = segments.find((s) => String(s.id) === id);
      if (seg) { seg.script_text = scriptText; seg.direction = direction; seg.section = section; seg.keyword = keyword; }
      btn.classList.remove("dirty");
      btn.textContent = "저장됨 ✓";
      setTimeout(() => { if (!btn.classList.contains("dirty")) btn.textContent = "저장"; }, 1500);
    } catch (err) {
      showMsg("저장 실패: " + err.message, false);
      btn.classList.add("dirty");
      btn.textContent = "저장 (수정됨)";
    } finally {
      btn.disabled = false;
    }
  }

  async function deleteSegmentCard(id, el) {
    const seg = segments.find((s) => String(s.id) === id);
    if (!seg) return;
    if (!confirm(`${seg.order_no}번 장면을 삭제할까요? 직접 올린 사진/영상도 함께 지워집니다.`)) return;

    try {
      for (const path of (seg.asset_paths || []).filter((p) => !isExternalUrl(p))) {
        await fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET}/${path}`, { method: "DELETE", headers });
      }
      const res = await fetch(`${SUPABASE_URL}/rest/v1/youtube_segments?id=eq.${id}`, { method: "DELETE", headers });
      if (!res.ok) throw new Error(await res.text());

      segments = segments.filter((s) => String(s.id) !== id);
      el.remove();

      // 번호 빈틈이 생기지 않게 1부터 다시 매긴다 (다른 카드의 입력 중 내용은 건드리지 않고 번호만 갱신)
      for (let i = 0; i < segments.length; i++) {
        const s = segments[i];
        if (s.order_no === i + 1) continue;
        const r = await fetch(`${SUPABASE_URL}/rest/v1/youtube_segments?id=eq.${s.id}`, {
          method: "PATCH", headers: jsonHeaders, body: JSON.stringify({ order_no: i + 1 }),
        });
        if (!r.ok) throw new Error(await r.text());
        s.order_no = i + 1;
        const card = document.querySelector(`.seg-item[data-id="${s.id}"]`);
        if (card) card.querySelector(".seg-no").textContent = i + 1;
      }

      if (!segments.length) render();
      document.getElementById("regenBtn").textContent = segments.length ? "콘티 다시 생성" : "콘티 생성";
      updateRuntimeSummary();
      showMsg("장면을 삭제했습니다.", true);
    } catch (err) {
      showMsg("장면 삭제 실패: " + err.message, false);
    }
  }

  function revertSegmentCard(id, el) {
    const seg = segments.find((s) => String(s.id) === id);
    if (!seg) return;
    if (!confirm("마지막으로 저장된 상태로 되돌릴까요? 지금 수정한 내용은 사라집니다.")) return;

    const scriptEl = el.querySelector(".seg-script");
    const directionEl = el.querySelector(".seg-direction");
    scriptEl.value = seg.script_text || "";
    directionEl.value = seg.direction || "";
    el.querySelector(".seg-section").value = seg.section || "";
    el.querySelector(".seg-keyword").value = seg.keyword || "";
    autoGrow(scriptEl);
    autoGrow(directionEl);

    const saveBtn = el.querySelector(".seg-save-btn");
    saveBtn.classList.remove("dirty");
    saveBtn.textContent = "저장";
    updateRuntimeSummary();
    showMsg("마지막 저장 상태로 되돌렸습니다.", true);
  }

  async function uploadSegmentAssets(id, fileList) {
    const files = Array.from(fileList || []);
    if (!files.length) return;
    const scriptId = document.getElementById("scriptSelect").value;
    const seg = segments.find((s) => String(s.id) === id);
    const paths = [...(seg.asset_paths || [])];

    let uploaded = 0;
    for (const file of files) {
      const rawName = file.name || `pasted_${Date.now()}.${(file.type.split("/")[1] || "png")}`;
      const safeName = rawName.replace(/[^\w.\-]/g, "_");
      const path = `${scriptId}/seg${id}_${Date.now()}_${safeName}`;
      try {
        const upRes = await fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET}/${path}`, {
          method: "POST",
          headers: { ...headers, "Content-Type": file.type || "application/octet-stream" },
          body: file,
        });
        if (!upRes.ok) throw new Error(await upRes.text());
        paths.push(path);
        uploaded++;
      } catch (err) {
        showMsg(`"${file.name}" 업로드 실패: ${err.message}`, false);
      }
    }
    if (uploaded > 0) {
      await saveField(id, "asset_paths", paths);
      showMsg(`${uploaded}개 업로드 완료.`, true);
      refreshThumbs(id);
    }
  }

  async function removeSegmentAsset(id, path) {
    if (!confirm("이 소재를 삭제할까요?")) return;
    const seg = segments.find((s) => String(s.id) === id);
    const paths = (seg.asset_paths || []).filter((p) => p !== path);
    if (!isExternalUrl(path)) {
      await fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET}/${path}`, { method: "DELETE", headers });
    }
    await saveField(id, "asset_paths", paths);
    refreshThumbs(id);
  }

  let lastScriptId = "";
  document.getElementById("scriptSelect").addEventListener("change", (e) => {
    if (document.querySelector(".seg-save-btn.dirty") && !confirm("저장 안 한 수정사항이 있습니다. 그래도 넘어갈까요?")) {
      e.target.value = lastScriptId;
      return;
    }
    lastScriptId = e.target.value;
    loadSegments(e.target.value);
  });

  window.addEventListener("beforeunload", (e) => {
    if (document.querySelector(".seg-save-btn.dirty")) {
      e.preventDefault();
      e.returnValue = "";
    }
  });

  document.getElementById("addSegBtn").addEventListener("click", async () => {
    const scriptId = document.getElementById("scriptSelect").value;
    if (!scriptId) return;
    const nextOrder = segments.length ? Math.max(...segments.map((s) => s.order_no)) + 1 : 1;
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/youtube_segments`, {
        method: "POST",
        headers: jsonHeaders,
        body: JSON.stringify({
          script_id: Number(scriptId), order_no: nextOrder,
          section: "", script_text: "", keyword: "", direction: "", asset_paths: [],
        }),
      });
      if (!res.ok) throw new Error(await res.text());
      showMsg("장면을 추가했습니다.", true);
      await refreshSegments(scriptId);
      const list = document.getElementById("segList");
      list.lastElementChild?.scrollIntoView({ behavior: "smooth", block: "center" });
    } catch (err) {
      showMsg("장면 추가 실패: " + err.message, false);
    }
  });

  document.addEventListener("paste", (e) => {
    const items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    const files = Array.from(items)
      .filter((it) => it.kind === "file" && it.type.startsWith("image/"))
      .map((it) => it.getAsFile())
      .filter(Boolean);
    if (!files.length) return;

    const segEl = document.activeElement && document.activeElement.closest(".seg-item");
    if (!segEl) return;

    e.preventDefault();
    uploadSegmentAssets(segEl.dataset.id, files);
  });

  document.getElementById("regenBtn").addEventListener("click", async () => {
    const scriptId = document.getElementById("scriptSelect").value;
    const row = scripts.find((r) => String(r.id) === scriptId);
    if (!row) return;
    if (segments.length && !confirm("기존 콘티를 지우고 새로 만들까요? (업로드해둔 소재도 함께 삭제됩니다)")) return;

    const btn = document.getElementById("regenBtn");
    btn.disabled = true;
    btn.textContent = "생성 중...";
    try {
      const res = await fetch("/api/gemini-storyboard", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ category: row.category, hook: row.hook, story: row.story, closing: row.closing }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "콘티 생성 실패");

      for (const seg of segments) {
        for (const path of (seg.asset_paths || []).filter((p) => !isExternalUrl(p))) {
          await fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET}/${path}`, { method: "DELETE", headers });
        }
      }
      await fetch(`${SUPABASE_URL}/rest/v1/youtube_segments?script_id=eq.${scriptId}`, { method: "DELETE", headers });

      const inserts = data.segments.map((seg, i) => ({
        script_id: Number(scriptId),
        order_no: i + 1,
        section: seg.section,
        script_text: seg.script_text,
        keyword: seg.keyword,
      }));
      await fetch(`${SUPABASE_URL}/rest/v1/youtube_segments`, {
        method: "POST",
        headers: jsonHeaders,
        body: JSON.stringify(inserts),
      });
      showMsg("콘티 생성 완료.", true);
      loadSegments(scriptId);
    } catch (err) {
      showMsg("콘티 생성 실패: " + err.message, false);
    } finally {
      btn.disabled = false;
      btn.textContent = segments.length ? "콘티 다시 생성" : "콘티 생성";
    }
  });

  loadScripts();

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/sw.js");
  }
</script>
<script src="/hub-nav.js"></script>
</body>
</html>
