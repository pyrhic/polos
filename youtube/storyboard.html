<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scenes — Wicked Wiki</title>
<link rel="stylesheet" href="/youtube/style.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@300;400;500;700&display=swap">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0f0a14">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  .seg-item { border:2px solid transparent; }
  .seg-item:focus-within { border-color:#7cff4a; }
  .seg-item .seg-head { display:flex; align-items:center; flex-wrap:wrap; gap:6px 8px; margin-bottom:10px; }
  .seg-item .seg-duration { margin-left:auto; flex-shrink:0; }
  .seg-duration-edit, .seg-duration-save { white-space:nowrap; }
  .seg-group { display:flex; justify-content:space-between; align-items:baseline; gap:8px; margin:22px 2px 8px; padding-bottom:5px; border-bottom:1px solid #3a2f14; font-weight:800; color:#7cff4a; font-size:0.95rem; }
  .seg-group:first-child { margin-top:4px; }
  .seg-group .cnt { color:#a89bb5; font-weight:600; font-size:0.78rem; white-space:nowrap; }
  .seg-part { width:auto; margin:0; padding:3px 6px; font-size:0.72rem; border-radius:10px; flex-shrink:0; }
  .seg-opinion-badge { background:#ffd93d; color:#0f0a14; font-size:0.7rem; font-weight:800; padding:2px 8px; border-radius:10px; flex-shrink:0; }
  .seg-item .seg-no { background:#0f0a14; color:#7cff4a; font-weight:800; font-size:0.8rem; width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .seg-duration { display:flex; align-items:center; gap:6px; font-size:0.8rem; color:#a89bb5; }
  .seg-duration-display { font-weight:700; color:#ffffff; }
  .seg-duration-edit, .seg-duration-save { width:auto; padding:4px 10px; font-size:0.7rem; margin:0; }
  .seg-duration-input { width:64px; padding:4px 6px; font-size:0.8rem; margin:0; }
  .seg-item input, .seg-item textarea { font-size:0.9rem; padding:8px 10px; margin-bottom:8px; }
  .seg-script, .seg-direction { min-height:50px; background:#17141c; color:#ffffff; resize:none; overflow:hidden; }
  .seg-thumbs { display:flex; gap:8px; overflow-x:auto; margin-bottom:8px; }
  .seg-thumb-wrap { position:relative; flex-shrink:0; }
  .seg-thumb { width:90px; height:90px; border-radius:3px; object-fit:cover; background:#0f0a14; display:block; }
  .seg-news-badge { display:block; width:90px; margin-top:3px; font-size:0.6rem; line-height:1.25; color:#ffd93d; text-decoration:none; }
  .seg-news-badge:hover { text-decoration:underline; }
  .seg-thumb-del { position:absolute; top:2px; right:2px; width:18px; height:18px; padding:0; border-radius:50%; background:#3a1414; color:#ff8a80; font-size:0.65rem; line-height:1; }
  .seg-thumb-empty { width:100%; height:50px; border-radius:3px; background:#0f0a14; margin-bottom:8px; display:flex; align-items:center; justify-content:center; color:#a89bb5; font-size:0.8rem; text-align:center; padding:8px; }
  .seg-actions label { width:100%; padding:8px 10px; font-size:0.75rem; margin:0; display:block; }
  .seg-actions input[type="file"] { display:none; }
  .seg-file-label { background:#221a2e; }
  .seg-icon-btn { width:26px; height:26px; padding:0; margin:0; border-radius:50%; background:#0f0a14; color:#a89bb5; font-size:0.95rem; line-height:1; flex-shrink:0; text-transform:none; }
  .seg-icon-btn:hover { background:#7cff4a; color:#0f0a14; }
  .seg-delete-btn { color:#ff8a80; }
  .seg-delete-btn:hover { background:#ff8a80; color:#0f0a14; }
  .seg-save-state { font-size:0.68rem; font-weight:700; color:#ffd93d; min-width:0; }
  .seg-save-state.ok { color:#7cff4a; }
  .trim-bar { position:relative; height:10px; background:#0f0a14; border-radius:5px; margin:10px 0; overflow:hidden; }
  .trim-sel { position:absolute; top:0; bottom:0; background:#7cff4a; }
  .trim-row { display:grid; grid-template-columns:1fr auto; gap:4px 8px; align-items:end; }
  .trim-row label { margin:6px 0 0; font-size:0.75rem; }
  .trim-row input { padding:6px 8px; font-size:0.9rem; margin:0; }
  .trim-mini { width:auto; padding:6px 8px; margin:0; font-size:0.7rem; background:#221a2e; text-transform:none; letter-spacing:0; }
  #trimMediaHost video, #trimMediaHost img { max-width:100%; max-height:300px; border-radius:3px; background:#000; }
  .seg-trim-btn { display:block; width:90px; margin-top:3px; padding:3px 0; font-size:0.65rem; background:#0f0a14; color:#a89bb5; text-transform:none; letter-spacing:0; }
  .seg-trim-btn.set { color:#7cff4a; }
  .runtime-summary { background:#17141c; border-radius:3px; padding:10px 14px; margin-top:14px; font-size:0.85rem; color:#7cff4a; font-weight:700; }
  .gen-main-btn { margin-top:10px; background:#7cff4a; color:#0f0a14; padding:12px; font-size:0.95rem; }
  .gen-main-btn:hover { background:#ffffff; }
  .gen-main-btn:disabled { background:#16324a; color:#4fc3f7; }
  .runtime-summary .note { color:#a89bb5; font-weight:400; font-size:0.75rem; display:block; margin-top:2px; }
  .seg-pexels-preview { display:none; margin:-4px 0 10px; background:#0f0a14; border-radius:3px; padding:8px; }
  .seg-pexels-preview.open { display:block; }
  .seg-pexels-loading { color:#a89bb5; font-size:0.75rem; padding:4px; }
  .seg-pexels-grid { display:flex; gap:8px; overflow-x:auto; }
  .seg-pexels-item { flex-shrink:0; width:80px; }
  .seg-pexels-thumb-wrap { position:relative; width:80px; height:100px; border-radius:3px; overflow:hidden; background:#221a2e; cursor:pointer; }
  .seg-pexels-thumb-wrap img, .seg-pexels-thumb-wrap video { width:100%; height:100%; object-fit:cover; display:block; }
  /* 전체 설정 카드: 다른 박스(어두운 배경)와 구분되도록 색을 반전 — 초록 배경 + 어두운 글자 */
  .settings-card { background:#7cff4a; color:#0f0a14; border:none; }
  .settings-card label { color:#1d4a0c; }
  .settings-card input, .settings-card select, .settings-card textarea { border:1px solid #4fb82a; }
  .settings-card .settings-note { color:#1d4a0c; }
  .settings-card .bgm-row .settings-note { margin:0; }
  .settings-card button { background:#0f0a14; color:#7cff4a; }
  .settings-card button:hover { background:#ffffff; color:#0f0a14; }
  .settings-card button:disabled { background:#4fb82a; color:#1d4a0c; }
  .settings-card #settingsSaveBtn.dirty { background:#ffd93d; color:#0f0a14; }
  .settings-card #bgmRemove { background:#f6d4d4; color:#8a1c1c; }
  .settings-card .seg-file-label { background:#0f0a14; color:#7cff4a; }
  .settings-head { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .settings-title { font-weight:800; margin-bottom:6px; }
  .settings-title span { color:#1d4a0c; font-weight:400; font-size:0.75rem; margin-left:6px; }
  .settings-dirty-badge { display:none; background:#0f0a14; color:#ffd93d; font-size:0.7rem; font-weight:800; padding:2px 8px; border-radius:10px; }
  .settings-summary { display:grid; grid-template-columns:auto 1fr; gap:3px 12px; font-size:0.8rem; margin:4px 0 10px; }
  .settings-summary dt { color:#1d4a0c; font-weight:600; }
  .settings-summary dd { margin:0; font-weight:700; word-break:break-all; }
  .settings-toggle { margin-top:0; padding:8px 10px; font-size:0.85rem; }
  #settingsBody { display:none; margin-top:12px; padding-top:4px; border-top:1px solid #4fb82a; }
  #settingsBody.open { display:block; }
  .settings-card input[type="range"] { padding:0; margin:4px 0 8px; accent-color:#0f0a14; border:none; }
  .settings-card select, .settings-card textarea { font-size:0.9rem; padding:8px 10px; margin-bottom:8px; }
  /* 요약 줄에서 바로 고치기 */
  .sr-list { margin:4px 0 0; }
  .sr { display:grid; grid-template-columns:auto 1fr; gap:0 12px; align-items:center; padding:1px 0; font-size:0.8rem; }
  .sr .k { color:#1d4a0c; font-weight:600; font-size:0.8rem; }
  .sr .v { font-weight:700; min-width:0; }
  .settings-card .tok { display:inline; text-transform:none; letter-spacing:0; text-align:left; line-height:1.45; background:none; color:#0f0a14; border:none; border-radius:0; padding:0; margin:0; width:auto; font-size:0.8rem; font-weight:800; cursor:pointer; }
  .settings-card .tok:hover { background:rgba(255,255,255,0.45); color:#0f0a14; }
  .settings-card .tok.on { background:#0f0a14; color:#7cff4a; }
  .settings-card .tok-btn { border:1px solid #0f0a14; border-radius:10px; padding:0 7px; margin-left:4px; font-size:0.72rem; }
  .settings-card .tok-del { color:#8a1c1c; }
  .settings-card .sr-input { background:transparent; border:none; border-radius:0; padding:0; margin:0; font-size:0.8rem; font-weight:800; color:#0f0a14; width:100%; }
  .settings-card .sr-input::placeholder { color:#3f7a28; font-weight:400; }
  .settings-card .sr-input:focus { outline:none; background:rgba(255,255,255,0.55); }
  .sr-framed { display:none; }
  .sr-framed.show { display:grid; }
  /* 굴러가는 선택 휠 */
  .wheel-wrap { position:relative; margin:0; }
  .wheel { height:132px; overflow-y:auto; scroll-snap-type:y mandatory; background:#0f0a14; border-radius:6px; padding:44px 0; scrollbar-width:none; -webkit-mask-image:linear-gradient(transparent, #000 30%, #000 70%, transparent); mask-image:linear-gradient(transparent, #000 30%, #000 70%, transparent); }
  .wheel::-webkit-scrollbar { display:none; }
  .wheel-item { height:44px; line-height:44px; text-align:center; scroll-snap-align:center; color:#7d7189; font-size:0.95rem; cursor:pointer; user-select:none; }
  .wheel-item.sel { color:#7cff4a; font-weight:800; font-size:1.05rem; }
  .wheel-band { position:absolute; left:6px; right:6px; top:44px; height:44px; border-top:1px solid #7cff4a; border-bottom:1px solid #7cff4a; pointer-events:none; }
  /* 자막 팝업 */
  .cap-modal { display:none; position:fixed; inset:0; z-index:50; background:rgba(0,0,0,0.78); align-items:center; justify-content:center; padding:12px; overflow-y:auto; }
  .cap-modal.open { display:flex; }
  .cap-modal-box { background:#221a2e; border-radius:6px; padding:14px; width:100%; max-width:320px; margin:auto; }
  .cap-modal-hint { color:#a89bb5; font-size:0.72rem; text-align:center; margin-bottom:6px; }
  .cap-modal-val { text-align:center; font-weight:800; color:#7cff4a; font-size:0.85rem; margin:6px 0 10px; }
  .cap-modal .cap-preview { touch-action:none; cursor:grab; user-select:none; }
  .cap-modal .cap-lines { cursor:grab; }
  /* 콘티 목록 */
  .conti-item { display:block; width:100%; text-align:left; cursor:pointer; background:#221a2e; color:#fff; border:2px solid transparent; border-radius:3px; padding:14px 16px; margin-bottom:10px; font:inherit; }
  .conti-item:hover, .conti-item:focus-visible { border-color:#7cff4a; background:#221a2e; color:#fff; }
  .conti-item .title { font-weight:800; font-size:1rem; margin-bottom:4px; }
  .conti-item .meta { color:#a89bb5; font-size:0.8rem; }
  #newDraft > summary { list-style:none; cursor:pointer; text-align:center; font-weight:800; background:#7cff4a; color:#0f0a14; border-radius:3px; padding:12px; margin:-16px -18px 0; }
  #newDraft > summary::-webkit-details-marker { display:none; }
  #newDraft[open] > summary { margin-bottom:6px; }
  #newDraft:not([open]) { padding:0; background:none; }
  #newDraft:not([open]) > summary { margin:0; }
  #newDraft[open] { padding:16px 18px; }
  .settings-card input[type="file"] { display:none; }
  .settings-note { color:#a89bb5; font-size:0.75rem; margin-bottom:10px; }
  .cap-preview { position:relative; width:270px; max-width:100%; height:480px; margin:6px auto 4px; background:#000 center/cover no-repeat; border-radius:4px; overflow:hidden; }
  .cap-lines { position:absolute; left:4px; right:4px; bottom:35px; text-align:center; line-height:1.25; }
  .cap-normal { font-family:'IBM Plex Sans KR',sans-serif; font-weight:300; color:#fff; text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000; }
  .cap-emph { font-family:'Black Han Sans',sans-serif; color:#ffff00; margin-top:6px; text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000; }
  /* 미리보기는 영상 1080x1920을 0.25배(270x480)로 그린 것. 제목/출처/영상 영역 위치는 영상 쪽 값과 같은 비율 */
  .cap-media { display:none; position:absolute; left:0; right:0; top:105px; height:275px; background:#222 center/cover no-repeat; }
  .cap-t1, .cap-t2, .cap-src { display:none; position:absolute; left:4px; right:4px; text-align:center; line-height:1.2; }
  .cap-t1, .cap-t2 { font-family:'Black Han Sans',sans-serif; font-size:23px; text-shadow:-1.5px -1.5px 0 #000,1.5px -1.5px 0 #000,-1.5px 1.5px 0 #000,1.5px 1.5px 0 #000; }
  .cap-t1 { top:30px; color:#ffff00; }
  .cap-t2 { top:61px; color:#fff; }
  .cap-src { bottom:75px; font-size:11.5px; color:#d0d0d0; font-family:'IBM Plex Sans KR',sans-serif; font-weight:300; }
  .cap-lines { z-index:2; }
  .bgm-row { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .bgm-row audio { flex:1; height:32px; min-width:0; }
  .bgm-row button { width:auto; padding:4px 10px; font-size:0.7rem; margin:0; flex-shrink:0; }
  #settingsSaveBtn.dirty { background:#3a2f14; color:#ffd93d; }
  .seg-pexels-pick { width:80px; margin-top:4px; padding:5px 0; font-size:0.7rem; }
  .seg-pexels-dur { position:absolute; bottom:2px; right:4px; background:rgba(0,0,0,0.7); color:#fff; font-size:0.6rem; padding:1px 4px; border-radius:2px; }
</style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="/youtube/index.html">← Wicked Wiki</a>
    <h1 style="font-size:1.4rem;margin-bottom:1.2rem;">Scenes</h1>
    <div id="listView">
      <div id="contiList"><div class="empty">불러오는 중...</div></div>

      <details id="newDraft" class="card-box" style="margin:14px 0 0;">
        <summary>+ 새 콘티 만들기</summary>
        <label for="draftTopic">주제</label>
        <input type="text" id="draftTopic" maxlength="100" placeholder="Trend에서 고르거나 직접 입력">
        <div id="draftArticlesWrap" style="display:none;">
          <label>참고 기사</label>
          <div id="draftArticles" style="margin-bottom:8px;"></div>
        </div>
        <label for="draftNote">방향 메모 (선택)</label>
        <input type="text" id="draftNote" maxlength="300" placeholder="예: 경제 영향 위주로 / 찬반 입장 균형 있게">
        <label style="display:flex;gap:8px;align-items:flex-start;margin:10px 0;font-weight:400;color:#cfc6d8;">
          <input type="checkbox" id="draftImages" checked style="width:auto;margin-top:3px;">
          <span style="font-size:0.82rem;line-height:1.4;">기사 사진·영상도 장면에 가져오기</span>
        </label>
        <button type="button" id="draftBtn">대본 + 콘티 생성</button>
        <div class="msg" id="draftMsg"></div>
      </details>
    </div>

    <select id="scriptSelect" style="display:none;"><option value="">불러오는 중...</option></select>

    <div id="detailView" style="display:none;">
    <button type="button" id="backToList" style="width:auto;padding:6px 14px;font-size:0.8rem;background:#221a2e;margin-bottom:12px;">← 콘티 목록</button>
    <div id="regenWrap" style="display:none;margin-top:10px;">
      <button type="button" id="regenBtn">콘티 (다시) 생성</button>
      <button type="button" id="addMediaBtn" style="margin-top:8px;background:#221a2e;">기사 사진·영상 가져오기</button>
    </div>
    <div class="msg" id="msg"></div>

    <div class="card-box settings-card" id="settingsCard" style="display:none;margin-top:14px;">
      <div class="settings-head">
        <div class="settings-title">전체 설정<span>값을 눌러 바로 바꿉니다</span></div>
        <span class="settings-dirty-badge" id="settingsDirtyBadge"></span>
      </div>
      <div class="sr-list" id="settingsSummary">
        <div class="sr"><span class="k">콘티 이름</span><span class="v"><input class="sr-input" id="srName" placeholder="콘티 이름 (영상 제목에 v1, v2…로 붙음)"></span></div>
        <div class="sr"><span class="k">화면 구성</span><span class="v"><button type="button" class="tok" data-wheel="layout" id="tokLayout"></button></span></div>
        <div class="sr sr-framed"><span class="k">제목 1줄</span><span class="v"><input class="sr-input" id="srT1" maxlength="20" placeholder="노란색, 10자 안팎"></span></div>
        <div class="sr sr-framed"><span class="k">제목 2줄</span><span class="v"><input class="sr-input" id="srT2" maxlength="20" placeholder="흰색"></span></div>
        <div class="sr sr-framed"><span class="k">출처 문구</span><span class="v"><input class="sr-input" id="srSrc" maxlength="60" placeholder="영상 아래 작은 글씨"></span></div>
        <div class="sr"><span class="k">자막</span><span class="v">
          <button type="button" class="tok" id="tokSize"></button> ·
          <button type="button" class="tok" id="tokWeight"></button> ·
          <button type="button" class="tok" id="tokPos"></button></span></div>
        <div class="sr"><span class="k">목소리</span><span class="v">
          <button type="button" class="tok" data-wheel="voice" id="tokVoice"></button> ·
          <button type="button" class="tok" data-wheel="rate" id="tokRate"></button> ·
          <button type="button" class="tok" data-wheel="pitch" id="tokPitch"></button>
          <button type="button" class="tok tok-btn" id="tokSample">▶ 샘플</button></span></div>
        <div class="sr"><span class="k">배경음악</span><span class="v">
          <button type="button" class="tok" id="tokBgm"></button>
          <span id="bgmExtra">
            · <button type="button" class="tok" data-wheel="bgmVol" id="tokBgmVol"></button>
            · <button type="button" class="tok" id="tokBgmUp">교체</button>
            · <button type="button" class="tok tok-del" id="tokBgmDel">삭제</button>
          </span></span></div>
        <div class="sr"><span class="k">분위기</span><span class="v"><button type="button" class="tok" data-wheel="mood" id="tokMood"></button></span></div>
        <div class="sr"><span class="k"></span><span class="v"><input class="sr-input" id="srMoodNote" placeholder="분위기 메모 (예: 긴장감 있게)"></span></div>
        <div class="sr"><span class="k">화면 전환</span><span class="v"><button type="button" class="tok" data-wheel="trans" id="tokTrans"></button></span></div>
      </div>
      <button type="button" id="settingsSaveBtn" style="display:none;margin-top:12px;">전체 설정 저장</button>

      <!-- 아래 입력들은 화면에 보이지 않는 실제 값 저장소. 위 요약 줄들이 이 값을 읽고 바꾼다 -->
      <div id="settingsBody">
        <input type="text" id="convName">
        <select id="layoutSel"><option value="full">full</option><option value="framed">framed</option></select>
        <input type="text" id="title1"><input type="text" id="title2"><input type="text" id="sourceText">
        <input type="range" id="capSize" min="40" max="140" step="2">
        <input type="range" id="capWeight" min="0" max="4" step="1">
        <input type="range" id="capPos" min="3" max="70" step="1">
        <b id="capSizeVal"></b><b id="capWeightVal"></b><b id="capPosVal"></b>
        <select id="voiceSel"></select>
        <audio id="voiceSample" preload="none"></audio>
        <input type="range" id="ttsRate" min="-30" max="30" step="1"><b id="ttsRateVal"></b>
        <input type="range" id="ttsPitch" min="-20" max="20" step="1"><b id="ttsPitchVal"></b>
        <div id="bgmRow"></div>
        <input type="file" id="bgmFile" accept="audio/*">
        <input type="range" id="bgmVol" min="0" max="100" step="1"><b id="bgmVolVal"></b>
        <select id="moodSel"></select>
        <textarea id="moodNote"></textarea>
        <select id="transSel"><option value="cut">cut</option><option value="fade">fade</option></select>
      </div>
    </div>

    <!-- 구간 지정 팝업: 영상/GIF에서 쓸 부분(시작~끝 초)을 고른다 -->
    <div class="cap-modal" id="trimModal">
      <div class="cap-modal-box" style="max-width:340px;">
        <div class="cap-modal-hint" style="font-size:0.85rem;font-weight:700;color:#fff;">사용할 구간 지정</div>

<script>
  const SUPABASE_URL = "https://oenqrlgmnkpzxsavnfyo.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_sZ4wQgaC5f-i40pVzf0vIA_R7iJWDf5";
  const BUCKET = "youtube-assets";
  const headers = {
    apikey: SUPABASE_ANON_KEY,
    Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
  };
  const jsonHeaders = { ...headers, "Content-Type": "application/json" };
  let scripts = [];
  let segments = [];

  function escapeAttr(s) {
    return String(s ?? "").replace(/"/g, "&quot;");
  }
  function escapeHtml(s) {
    return String(s ?? "").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  function showMsg(text, ok) {
    const msg = document.getElementById("msg");
    msg.className = "msg " + (ok ? "ok" : "err");
    msg.textContent = text;
  }

  function publicUrl(path) {
    return `${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${path}`;
  }

  function isImage(path) {
    return /\.(jpe?g|png|gif|webp)$/i.test(path);
  }

  // asset_paths에는 직접 올린 파일의 스토리지 경로 또는 Pexels에서 고른 영상의 전체 URL이 섞여 들어간다.
  function isExternalUrl(path) {
    return /^https?:\/\//.test(path);
  }
  function assetUrl(path) {
    return isExternalUrl(path) ? path : publicUrl(path);
  }

  // 구간을 고를 수 있는 소재: 영상과 GIF (사진은 해당 없음)
  function isTrimmable(path) {
    return !isImage(path) || /\.gif(\?|$)/i.test(path);
  }
  function trimLabel(t) {
    return `${Number(t.start || 0).toFixed(1)}~${t.end == null ? "끝" : Number(t.end).toFixed(1)}초`;
  }

  function thumbsHtml(seg) {
    const paths = seg.asset_paths || [];
    const notes = seg.asset_notes || {};
    const trims = seg.asset_trims || {};
    if (!paths.length) return '<div class="seg-thumb-empty">비어있음 — 키워드로 자동 검색됨</div>';
    return `<div class="seg-thumbs">${paths.map((p) => {
      const n = notes[p];
      const tip = n ? `${n.articleTitle || ""}${n.caption ? " / 사진 설명: " + n.caption : ""}` : "";
      return `
      <div class="seg-thumb-wrap" data-path="${escapeAttr(p)}">
        ${isImage(p)
          ? `<a href="${escapeAttr(assetUrl(p))}" target="_blank" rel="noopener"><img class="seg-thumb" src="${assetUrl(p)}" alt=""></a>`
          : `<video class="seg-thumb" src="${assetUrl(p)}" muted preload="metadata"></video>`}
        <button type="button" class="seg-thumb-del" data-path="${escapeAttr(p)}">×</button>
        ${isTrimmable(p) ? `<button type="button" class="seg-trim-btn${trims[p] ? " set" : ""}" data-path="${escapeAttr(p)}">✂ ${trims[p] ? `${trimLabel(trims[p])}` : "구간 지정"}</button>` : ""}
        ${n ? `<a class="seg-news-badge" href="${escapeAttr(n.articleUrl || "#")}" target="_blank" rel="noopener" title="${escapeAttr(tip)}">뉴스 · ${escapeHtml(n.source || "")}<br>저작권 확인 필요</a>` : ""}
      </div>`;
    }).join("")}</div>`;
  }

  function bindThumbDeletes(el, id) {
    el.querySelectorAll(".seg-thumb-del").forEach((btn) =>
      btn.addEventListener("click", () => removeSegmentAsset(id, btn.dataset.path))
    );
    el.querySelectorAll(".seg-trim-btn").forEach((btn) =>
      btn.addEventListener("click", () => openTrimModal(id, btn.dataset.path))
    );
  }

  // 다른 칸에 입력 중이던 내용을 날리지 않도록, 소재 영역만 다시 그린다.
  function refreshThumbs(id) {
    const el = document.querySelector(`.seg-item[data-id="${id}"]`);
    const seg = segments.find((s) => String(s.id) === id);
    if (!el || !seg) return;
    el.querySelector(".seg-thumbs-area").innerHTML = thumbsHtml(seg);
    bindThumbDeletes(el, id);
    updateSettingsPreview();
  }

  // 한국어 내레이션 기준 대략적인 발화 속도 추정치(초당 글자 수) — 정확한 값은
  // 실제 TTS가 돌아야 알 수 있어서, 어디까지나 대략적인 예측용.
  const CHARS_PER_SEC = 4.3;

  function estimateSeconds(text) {
    const len = (text || "").replace(/\*\*/g, "").replace(/\s+/g, "").length;
    return Math.max(1, len / CHARS_PER_SEC);
  }

  function effectiveSeconds(el, seg) {
    if (seg && seg.target_seconds > 0) return Number(seg.target_seconds);
    return estimateSeconds(el.querySelector(".seg-script").value);
  }

  function updateRuntimeSummary() {
    const box = document.getElementById("runtimeSummary");
    const cards = Array.from(document.querySelectorAll(".seg-item"));
    if (!cards.length) { box.style.display = "none"; return; }

    const perCard = cards.map((el) => ({
      el, seconds: effectiveSeconds(el, segments.find((s) => String(s.id) === el.dataset.id)),
    }));
    const total = perCard.reduce((sum, c) => sum + c.seconds, 0);

    perCard.forEach(({ el, seconds }) => {
      const pct = total > 0 ? (seconds / total) * 100 : 0;
      const display = el.querySelector(".seg-duration-display");
      if (display) display.textContent = `${seconds.toFixed(1)}초 (${pct.toFixed(0)}%)`;
    });

    box.style.display = "block";
    refreshGroupHeaders();
    $("runtimeText").innerHTML = `전체 예상 길이: 약 ${total.toFixed(1)}초 (${(total / 60).toFixed(1)}분)` +
      `<span class="note">대사 기준 추정치이며, 실제 음성 속도에 따라 달라질 수 있습니다. 장면 번호 옆 "수정"으로 노출 시간을 직접 바꿀 수 있어요.</span>`;
  }

  // ───── 전체 설정 카드 (자막 크기 / 배경음악 / 분위기 / 화면 전환) ─────
  const MOODS = [
    { id: "neutral", label: "기본", desc: "" },
    { id: "mystery", label: "어둡고 미스터리", desc: "어둡고 긴장감 있는 미스터리 분위기" },
    { id: "bright", label: "밝고 경쾌", desc: "밝고 경쾌한 분위기" },
    { id: "calm", label: "차분한 다큐", desc: "차분하고 담담한 다큐멘터리 분위기" },
  ];
  const DEFAULT_SETTINGS = {
    caption_font_size: 80, bgm_path: null, bgm_volume: 0.15, mood: "neutral", mood_note: "", transition: "cut",
    tts_voice: "ko-KR-InJoonNeural", tts_rate: -3, tts_pitch: -5, name: "",
    caption_weight: 0, caption_position_pct: 7,
    layout: "full", title1: "", title2: "", source_text: "",
  };
  // 폰트 두께 단계 (영상 쪽 02_tts.py의 WEIGHT_FONTS와 같은 순서)
  const WEIGHTS = [
    { label: "가늘게", family: "'IBM Plex Sans KR'", weight: 300 },
    { label: "보통", family: "'IBM Plex Sans KR'", weight: 400 },
    { label: "중간", family: "'IBM Plex Sans KR'", weight: 500 },
    { label: "굵게", family: "'IBM Plex Sans KR'", weight: 700 },
    { label: "아주 굵게", family: "'Black Han Sans'", weight: 400 },
  ];
  const VOICES = [
    { id: "ko-KR-InJoonNeural", label: "인준 (남성) — 현재 기본" },
    { id: "ko-KR-HyunsuMultilingualNeural", label: "현수 (남성)" },
    { id: "ko-KR-SunHiNeural", label: "선희 (여성)" },
  ];
  let currentSettings = { ...DEFAULT_SETTINGS };
  let savedBgmPath = null;
  const $ = (id) => document.getElementById(id);

  // 전체 설정은 저장 버튼으로, 장면 카드는 카드에서 빠져나오면 자동 저장된다
  function hasDirty() {
    return !!document.querySelector("#settingsSaveBtn.dirty");
  }
  function cardsDirty() {
    return !!document.querySelector(".seg-item[data-dirty]");
  }
  // 아직 저장 안 된 장면 카드를 모두 저장한다
  function flushDirtyCards() {
    const saves = Array.from(document.querySelectorAll(".seg-item[data-dirty]")).map((el) => saveSegmentCard(el.dataset.id, el));
    return Promise.all(saves);
  }

  function markSettingsDirty() {
    const b = $("settingsSaveBtn");
    b.classList.add("dirty");
    b.textContent = "전체 설정 저장 (수정됨)";
    updateSettingsSummary();
  }

  // ───── 요약 줄에서 바로 고치기 ─────
  // 실제 값은 화면 밖 입력들(#settingsBody)이 들고 있고, 요약 줄은 그 값을 읽어 보여 주고 바꿀 때 같은 이벤트를 쏜다.
  function range(a, b, step) { const o = []; for (let n = a; n <= b; n += step) o.push(n); return o; }
  const WHEELS = {
    layout: { ctl: "layoutSel", opts: () => [["full", "전체 화면"], ["framed", "제목 + 영상 + 출처"]] },
    voice: { ctl: "voiceSel", opts: () => VOICES.map((v) => [v.id, v.label.replace(/ — .*/, "")]) },
    rate: { ctl: "ttsRate", opts: () => range(-30, 30, 1).map((n) => [String(n), `속도 ${n > 0 ? "+" : ""}${n}%`]) },
    pitch: { ctl: "ttsPitch", opts: () => range(-20, 20, 1).map((n) => [String(n), `높낮이 ${n > 0 ? "+" : ""}${n}Hz`]) },
    bgmVol: { ctl: "bgmVol", opts: () => range(0, 100, 5).map((n) => [String(n), `볼륨 ${n}%`]) },
    mood: { ctl: "moodSel", opts: () => MOODS.map((m) => [m.id, m.label]) },
    trans: { ctl: "transSel", opts: () => [["cut", "컷 (바로 전환)"], ["fade", "페이드 (어두워졌다 밝아짐)"]] },
  };

  function fireCtl(el) {
    el.dispatchEvent(new Event(el.tagName === "SELECT" ? "change" : "input", { bubbles: true }));
  }

  let openWheel = null; // { key, tok, wrap }
  function closeWheel() {
    if (!openWheel) return;
    openWheel.wrap.remove();
    openWheel = null;
    $("pickModal").classList.remove("open");
  }
  const WHEEL_TITLES = { layout: "화면 구성", voice: "목소리", rate: "말하기 속도", pitch: "목소리 높낮이", bgmVol: "배경음악 볼륨", mood: "영상 분위기", trans: "화면 전환" };
  function openWheelFor(tok) {
    const key = tok.dataset.wheel;
    closeWheel();
    const cfg = WHEELS[key];
    const ctl = $(cfg.ctl);
    const opts = cfg.opts();
    // 숫자 목록은 현재 값에 가장 가까운 칸, 문자 목록은 같은 값의 칸을 고른다
    const numeric = !Number.isNaN(Number(ctl.value)) && ctl.value !== "";
    let idx = numeric
      ? opts.reduce((best, o, i) => Math.abs(Number(o[0]) - Number(ctl.value)) < Math.abs(Number(opts[best][0]) - Number(ctl.value)) ? i : best, 0)
      : opts.findIndex((o) => o[0] === ctl.value);
    if (idx < 0) idx = 0;
    const wrap = document.createElement("div");
    wrap.className = "wheel-wrap";
    wrap.innerHTML = `<div class="wheel">${opts.map((o, i) => `<div class="wheel-item" data-i="${i}">${escapeHtml(o[1])}</div>`).join("")}</div><div class="wheel-band"></div>`;
    $("pickHost").appendChild(wrap);
    $("pickTitle").textContent = WHEEL_TITLES[key] || "";
    openWheel = { key, tok, wrap };
    $("pickModal").classList.add("open"); // 보이게 한 뒤에 스크롤 위치를 맞춘다
    const wheel = wrap.querySelector(".wheel");
    const mark = (i) => wheel.querySelectorAll(".wheel-item").forEach((el, n) => el.classList.toggle("sel", n === i));
    mark(idx);
    wheel.scrollTop = idx * 44;
    let timer = null, lastIdx = idx;
    wheel.addEventListener("scroll", () => {
      const i = Math.max(0, Math.min(opts.length - 1, Math.round(wheel.scrollTop / 44)));
      mark(i);
      clearTimeout(timer);
      timer = setTimeout(() => {
        if (i === lastIdx) return;
        lastIdx = i;
        ctl.value = opts[i][0];
        fireCtl(ctl);
      }, 90);
    });
    wheel.addEventListener("click", (e) => {
      const it = e.target.closest(".wheel-item");
      if (!it) return;
      const i = Number(it.dataset.i);
      if (i === Math.round(wheel.scrollTop / 44)) { closeWheel(); return; } // 가운데 칸을 다시 누르면 닫기
      wheel.scrollTo({ top: i * 44, behavior: "smooth" });
    });
  }

  function cycleWeight() {
    const el = $("capWeight");
    el.value = (Number(el.value) + 1) % WEIGHTS.length;
    fireCtl(el);
  }

  let settingsJustSaved = false;
  let bgmPlayer = null;
  function stopBgmPlayer() { if (bgmPlayer) { bgmPlayer.pause(); bgmPlayer = null; } }

  function updateSettingsSummary() {
    const mirror = (srId, ctlId) => { const el = $(srId); if (document.activeElement !== el) el.value = $(ctlId).value; };
    mirror("srName", "convName"); mirror("srT1", "title1"); mirror("srT2", "title2"); mirror("srSrc", "sourceText"); mirror("srMoodNote", "moodNote");
    const label = (key) => {
      const cfg = WHEELS[key], v = $(cfg.ctl).value;
      const hit = cfg.opts().find((o) => o[0] === v);
      return hit ? hit[1] : v;
    };
    const framed = $("layoutSel").value === "framed";
    document.querySelectorAll(".sr-framed").forEach((el) => el.classList.toggle("show", framed));
    $("tokLayout").textContent = label("layout");
    $("tokSize").textContent = `크기 ${$("capSize").value}`;
    $("tokWeight").textContent = WEIGHTS[Number($("capWeight").value)].label;
    $("tokPos").textContent = `위치 ${$("capPos").value}%`;
    $("tokVoice").textContent = label("voice");
    const r = Number($("ttsRate").value), p = Number($("ttsPitch").value);
    $("tokRate").textContent = `속도 ${r > 0 ? "+" : ""}${r}%`;
    $("tokPitch").textContent = `높낮이 ${p > 0 ? "+" : ""}${p}Hz`;
    const hasBgm = !!currentSettings.bgm_path;
    $("tokBgm").textContent = hasBgm ? (bgmPlayer && !bgmPlayer.paused ? "■ 정지" : "▶ 듣기") : "+ 음악 올리기";
    $("bgmExtra").style.display = hasBgm ? "inline" : "none";
    $("tokBgmVol").textContent = `볼륨 ${$("bgmVol").value}%`;
    $("tokMood").textContent = label("mood");
    $("tokTrans").textContent = label("trans");
    $("capModalVal").textContent = `크기 ${$("capSize").value} · ${WEIGHTS[Number($("capWeight").value)].label} · 위치 ${$("capPos").value}%`;
    const dirty = $("settingsSaveBtn").classList.contains("dirty");
    $("settingsSaveBtn").style.display = dirty || $("settingsSaveBtn").disabled ? "block" : "none";
    const badge = $("settingsDirtyBadge");
    badge.textContent = dirty ? "저장 안 됨" : (settingsJustSaved ? "저장됨 ✓" : "");
    badge.style.display = badge.textContent ? "inline-block" : "none";
  }

  // 자막 예시 팝업
  function openCapModal() {
    closeWheel();
    $("capModal").classList.add("open");
    updateSettingsPreview();
    updateSettingsSummary();
  }
  function closeCapModal() { $("capModal").classList.remove("open"); }

  (function initCapModal() {
    const pv = $("capPreview");
    const pointers = new Map();
    let drag = null, pinch = null;
    pv.addEventListener("pointerdown", (e) => {
      pv.setPointerCapture(e.pointerId);
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pointers.size === 2) {
        const [a, b] = [...pointers.values()];
        pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), size: Number($("capSize").value) };
        drag = null;
      } else {
        drag = { y: e.clientY, pos: Number($("capPos").value), moved: false, t: Date.now(), onText: !!e.target.closest(".cap-lines") };
      }
    });
    pv.addEventListener("pointermove", (e) => {
      if (!pointers.has(e.pointerId)) return;
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pinch && pointers.size === 2) {
        const [a, b] = [...pointers.values()];
        const size = Math.round(pinch.size * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d / 2) * 2;
        $("capSize").value = Math.max(40, Math.min(140, size));
        fireCtl($("capSize"));
      } else if (drag) {
        const dy = e.clientY - drag.y;
        if (Math.abs(dy) > 4) drag.moved = true;
        if (drag.moved) {
          // 미리보기 높이 480px 기준, 자막 위치는 화면 아래에서 띄운 비율
          $("capPos").value = Math.max(3, Math.min(70, Math.round(drag.pos - dy / 480 * 100)));
          fireCtl($("capPos"));
        }
      }
    });
    const end = (e) => {
      if (drag && !drag.moved && drag.onText && Date.now() - drag.t < 400 && pointers.size === 1) cycleWeight();
      pointers.delete(e.pointerId);
      if (pointers.size < 2) pinch = null;
      if (!pointers.size) drag = null;
    };
    pv.addEventListener("pointerup", end);
    pv.addEventListener("pointercancel", end);
    pv.addEventListener("wheel", (e) => {
      e.preventDefault();
      const el = $("capSize");
      el.value = Math.max(40, Math.min(140, Number(el.value) + (e.deltaY < 0 ? 2 : -2)));
      fireCtl(el);
    }, { passive: false });
    $("capModalClose").addEventListener("click", closeCapModal);
    $("capModal").addEventListener("click", (e) => { if (e.target === $("capModal")) closeCapModal(); });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") { closeCapModal(); closeWheel(); } });
  })();

  document.querySelectorAll(".tok[data-wheel]").forEach((t) => t.addEventListener("click", () => openWheelFor(t)));
  $("tokSize").addEventListener("click", openCapModal);
  $("tokPos").addEventListener("click", openCapModal);
  $("tokWeight").addEventListener("click", cycleWeight);
  $("tokSample").addEventListener("click", () => {
    const a = $("voiceSample");
    if (!a.paused) { a.pause(); return; }
    a.currentTime = 0;

  async function uploadBgm(file) {
    const scriptId = $("scriptSelect").value;
    const safeName = file.name.replace(/[^\w.\-]/g, "_");
    const path = `${scriptId}/bgm_${Date.now()}_${safeName}`;
    try {
      const upRes = await fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET}/${path}`, {
        method: "POST",
        headers: { ...headers, "Content-Type": file.type || "audio/mpeg" },
        body: file,
      });
      if (!upRes.ok) throw new Error(await upRes.text());
      currentSettings.bgm_path = path;
      renderBgm();
      markSettingsDirty();
      showMsg("음악을 올렸습니다. '전체 설정 저장'을 눌러야 적용됩니다.", true);
    } catch (err) {
      showMsg("음악 업로드 실패: " + err.message, false);
    }
  }

  async function saveSettings() {
    const btn = $("settingsSaveBtn");
    const scriptId = $("scriptSelect").value;
    btn.disabled = true;
    btn.textContent = "저장 중...";
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/youtube_scripts?id=eq.${scriptId}`, {
        method: "PATCH", headers: jsonHeaders,
        body: JSON.stringify({ video_settings: currentSettings }),
      });
      if (!res.ok) throw new Error(await res.text());
      const row = scripts.find((r) => String(r.id) === String(scriptId));
      if (row) row.video_settings = { ...currentSettings };
      if (savedBgmPath && savedBgmPath !== currentSettings.bgm_path && !isExternalUrl(savedBgmPath)) {
        await fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET}/${savedBgmPath}`, { method: "DELETE", headers });
      }
      savedBgmPath = currentSettings.bgm_path || null;
      btn.classList.remove("dirty");
      btn.textContent = "전체 설정 저장";
      settingsJustSaved = true;
      setTimeout(() => { settingsJustSaved = false; updateSettingsSummary(); }, 1800);
      updateSettingsSummary();
      setTimeout(() => { if (!btn.classList.contains("dirty")) btn.textContent = "전체 설정 저장"; }, 1500);
    } catch (err) {
      showMsg("전체 설정 저장 실패: " + err.message, false);
      btn.classList.add("dirty");
      btn.textContent = "전체 설정 저장 (수정됨)";
      updateSettingsSummary();
    } finally {
      btn.disabled = false;
    }
  }

  // 기사 사진/영상을 장면에 돌아가며 나눠 담는다(이미 있는 소재는 그대로 두고 뒤에 추가).
  // 출처는 asset_notes에 같이 저장해 장면에서 확인/삭제할 수 있게 한다.
  async function importArticleImages(scriptId, targetSegs, items, btn) {
    const colCheck = await fetch(`${SUPABASE_URL}/rest/v1/youtube_segments?select=asset_notes&limit=1`, { headers });
    if (!colCheck.ok) {
      return " (기사 사진·영상은 건너뜀: 출처를 저장할 asset_notes 컬럼이 없습니다 — youtube_tables_11_asset_notes.sql 실행 필요)";
    }
    const bySeg = new Map(targetSegs.map((sg) => [sg.id, { paths: [...(sg.asset_paths || [])], notes: { ...(sg.asset_notes || {}) }, added: 0 }]));
    // 같은 사진이 CDN 서버 번호(img1/img4 등)만 달라지는 경우가 있어 번호를 빼고 비교한다
    const normUrl = (u) => String(u).replace(/^(https?:\/\/[a-z]+)\d+\./i, "$1.");
    const already = new Set(targetSegs.flatMap((sg) => Object.values(sg.asset_notes || {}).map((n) => n && n.origUrl).filter(Boolean)).map(normUrl));
    let ok = 0, videos = 0, skipped = 0;
    for (let i = 0; i < items.length; i++) {
      const it = items[i];
      if (already.has(normUrl(it.url))) { skipped++; continue; }
      const seg = targetSegs[i % targetSegs.length];
      btn.textContent = `기사 사진·영상 가져오는 중... (${i + 1}/${items.length})`;
      try {
        const r = await fetch("/api/save-article-image", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url: it.url, referer: it.articleUrl, scriptId: scriptId, segId: seg.id, n: i }),
        });
        const d = await r.json();
        if (!r.ok) continue;
        const entry = bySeg.get(seg.id);
        entry.paths.push(d.path);
        entry.notes[d.path] = { source: it.source, articleUrl: it.articleUrl, articleTitle: it.articleTitle, caption: it.caption, origUrl: it.url };
        entry.added++;
        ok++;
        if (it.type === "video") videos++;
      } catch { /* 하나 실패해도 나머지는 계속 */ }
    }
    for (const [segId, entry] of bySeg) {
      if (!entry.added) continue;
      const r = await fetch(`${SUPABASE_URL}/rest/v1/youtube_segments?id=eq.${segId}`, {
        method: "PATCH", headers: jsonHeaders,
        body: JSON.stringify({ asset_paths: entry.paths, asset_notes: entry.notes }),
      });
      if (!r.ok) throw new Error("소재 연결 저장 실패: " + await r.text());
    }
    if (!ok) return skipped ? " (새로 가져올 사진·영상이 없습니다 — 이미 다 가져왔어요)" : " (기사 사진·영상을 가져오지 못했습니다)";
    return ` 기사 사진 ${ok - videos}장${videos ? `, 영상 ${videos}개` : ""}를 장면에 가져왔습니다 — 저작권 확인 후 문제 있는 건 × 로 삭제하세요.`;
  }

  function embedNote(embeds) {
    if (!embeds || !embeds.length) return "";
    return ` 기사 속 유튜브 영상 ${embeds.length}개는 내려받지 않고 링크만 알려요: ${embeds.map((e) => e.link).join(" , ")}`;
  }

  // 이미 만든 콘티에도 기사 사진/영상을 가져올 수 있게: 콘티에 저장된 기사 주소(fact_sources)에서 찾는다
  async function addArticleMedia() {
    const scriptId = $("scriptSelect").value;
    const row = scripts.find((r) => String(r.id) === String(scriptId));
    if (!row || !segments.length) return;
    await flushDirtyCards();
    const urls = (row.fact_sources || "").split("\n").map((l) => l.trim()).filter((l) => /^https?:\/\/\S+$/.test(l));
    if (!urls.length) { showMsg("이 콘티에 저장된 기사 주소가 없습니다.", false); return; }
    const btn = $("addMediaBtn");
    btn.disabled = true;
    const label = btn.textContent;
    btn.textContent = "기사에서 사진·영상 찾는 중...";
    try {
      const res = await fetch("/api/article-media", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ articles: urls.map((u) => ({ url: u, source: new URL(u).hostname.replace(/^www\./, "") })) }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "찾기 실패");
      const items = [...data.media.filter((m) => m.type === "image").slice(0, 8), ...data.media.filter((m) => m.type === "video").slice(0, 3)];
      let text = "";
      if (items.length) text = await importArticleImages(Number(scriptId), segments, items, btn);
      else text = " 기사에서 가져올 수 있는 사진·영상을 찾지 못했습니다.";
      showMsg(text.trim() + embedNote(data.embeds), true);
      await refreshSegments(scriptId);
    } catch (err) {
      showMsg("기사 사진·영상 가져오기 실패: " + err.message, false);
    } finally {
      btn.disabled = false;
      btn.textContent = label;
    }
  }

  async function createDraft() {
    const topic = $("draftTopic").value.trim();
    if (!topic) { showDraftMsg("주제를 입력하세요.", false); return; }
    const articles = Array.from(document.querySelectorAll(".draft-art"))
      .filter((c) => c.checked).map((c) => draftCandidates[Number(c.dataset.i)]);

    const btn = $("draftBtn");
    btn.disabled = true;
    btn.textContent = "대본과 콘티를 만드는 중... (10~30초)";
    showDraftMsg("기사를 읽고, 배경·관점을 검색한 뒤 대본을 쓰는 중입니다.", true);
    try {
      const res = await fetch("/api/gemini-draft", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ topic, articles, note: $("draftNote").value.trim(), traffic: draftTraffic }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "생성 실패");

      const segs = data.segments;
      const texts = segs.map((s) => s.script_text);
      const scriptRes = await fetch(`${SUPABASE_URL}/rest/v1/youtube_scripts`, {
        method: "POST",
        headers: { ...jsonHeaders, Prefer: "return=representation" },
        body: JSON.stringify({
          category: "뉴스/이슈",
          hook: texts[0],
          story: texts.slice(1).join("\n") || texts[0],
          closing: "",
          fact_sources: [
            ...articles.map((a) => a.url).filter(Boolean),
            ...((data.research && data.research.sources) || []).slice(0, 4).map((s) => `${s.title} — ${s.url}`),
          ].join("\n"),
          status: "approved",
          slug: `${new Date().toISOString().slice(0, 10)}_${topic.replace(/[^\p{L}\p{N}]+/gu, "-").slice(0, 20)}`,
          video_settings: { name: (data.name || topic).slice(0, 40) },
        }),
      });
      if (!scriptRes.ok) throw new Error(await scriptRes.text());
      const created = (await scriptRes.json())[0];

      const segRes = await fetch(`${SUPABASE_URL}/rest/v1/youtube_segments`, {
        method: "POST",
        headers: { ...jsonHeaders, Prefer: "return=representation" },
        body: JSON.stringify(segs.map((s, i) => ({
          script_id: created.id, order_no: i + 1,
          section: s.section, script_text: s.script_text, keyword: s.keyword, direction: s.direction,
        }))),
      });
      if (!segRes.ok) throw new Error(await segRes.text());
      const createdSegs = (await segRes.json()).sort((a, b) => a.order_no - b.order_no);

      let imageNote = "";
      if ($("draftImages").checked && (data.images || []).length) {
        imageNote = await importArticleImages(created.id, createdSegs, [...data.images.filter((m) => m.type !== "video").slice(0, 8), ...data.images.filter((m) => m.type === "video").slice(0, 3)], btn);
      }

      imageNote += embedNote(data.embeds);
      const researchNote = data.research && data.research.ok
        ? ` 관점 자료는 구글 검색 출처 ${data.research.sources.length}건을 참고했습니다.`
        : " 검색 조사에 실패해 관점 정리 없이 기사 중심으로 썼습니다.";
      const doneText = `"${data.name}" 콘티가 만들어졌습니다. '내 의견' 장면은 비어 있으니 직접 써 넣으세요.${researchNote}${imageNote}`;
      showDraftMsg(doneText, true);
      showMsg(doneText, true);
      $("newDraft").open = false;
      await loadScripts();
      openConti(created.id);
    } catch (err) {
      showDraftMsg("생성 실패: " + err.message, false);
    } finally {
      btn.disabled = false;
      btn.textContent = "대본 + 콘티 생성";
    }
  }
  $("draftBtn").addEventListener("click", createDraft);

  async function loadSegments(scriptId) {
    const list = document.getElementById("segList");
    const regenWrap = document.getElementById("regenWrap");
    if (!scriptId) {
      list.innerHTML = '<div class="empty">대본을 먼저 선택하세요.</div>';
      regenWrap.style.display = "none";
      return;
    }
    list.innerHTML = '<div class="empty">불러오는 중...</div>';
    const res = await fetch(`${SUPABASE_URL}/rest/v1/youtube_segments?select=*&script_id=eq.${scriptId}&order=order_no.asc`, { headers });
    segments = await res.json();
    regenWrap.style.display = "block";
    document.getElementById("regenBtn").textContent = segments.length ? "콘티 다시 생성" : "콘티 생성";
    render();
    updateSettingsPreview();
  }

  // 장면 구분(대본 구조). section 칸에 구분 이름을 저장하고, 옛 콘티의 "트렌드 요약 (설명)" 같은 값은 앞부분으로 묶어 본다.
  const PARTS = ["트렌드 요약", "이슈 설명", "관점 정리", "내 의견", "마무리"];
  function partOf(section) {
    const t = (section || "").trim();
    return PARTS.find((k) => t.includes(k)) || t;
  }
  function partOptionsHtml(section) {
    const cur = partOf(section);
    const list = PARTS.includes(cur) || !cur ? PARTS : [...PARTS, cur];
    return `<option value="">구분 없음</option>` + list.map((k) => `<option value="${escapeAttr(k)}"${k === cur ? " selected" : ""}>${escapeHtml(k)}</option>`).join("");
  }

  // 이어지는 같은 구분의 카드들을 묶어서 "트렌드 요약 · 카드 2개 · 약 14초" 머리글을 카드 사이에 넣는다
  function refreshGroupHeaders() {
    const list = document.getElementById("segList");
    list.querySelectorAll(".seg-group").forEach((el) => el.remove());
    let prev = null, run = [];
    const flush = () => {
      if (!run.length || !prev) { run = []; return; }
      const secs = run.reduce((sum, el) => sum + effectiveSeconds(el, segments.find((x) => String(x.id) === el.dataset.id)), 0);
      const h = document.createElement("div");
      h.className = "seg-group";
      h.innerHTML = `<span>${escapeHtml(prev)}</span><span class="cnt">카드 ${run.length}개 · 약 ${secs.toFixed(0)}초</span>`;
      run[0].before(h);
      run = [];
    };
    list.querySelectorAll(".seg-item").forEach((el) => {
      const part = partOf(el.querySelector(".seg-section").value);
      el.querySelector(".seg-opinion-badge").style.display = part === "내 의견" ? "inline-block" : "none";
      if (part !== prev) { flush(); prev = part; }
      run.push(el);
    });
    flush();
  }

  // 옛 콘티용 보충 버튼들: 이미 기사 사진을 가져왔거나(또는 기사 주소가 없거나), 이미 내 의견 카드가 있으면 숨긴다
  function updateHelperButtons() {
    const row = scripts.find((r) => String($("scriptSelect").value) === String(r.id));
    const hasArticleUrls = !!row && (row.fact_sources || "").split("\n").some((l) => /^https?:\/\/\S+$/.test(l.trim()));
    const hasNewsMedia = segments.some((sg) => Object.keys(sg.asset_notes || {}).length > 0);
    $("addMediaBtn").style.display = hasArticleUrls && !hasNewsMedia && segments.length ? "block" : "none";
  }

  function render() {
    updateHelperButtons();
    const list = document.getElementById("segList");
    if (!segments.length) {
      list.innerHTML = '<div class="empty">아직 콘티가 없습니다. 위 "콘티 생성" 버튼을 눌러주세요.</div>';
      return;
    }
    list.innerHTML = segments.map((seg) => {
      return `
      <div class="card-box seg-item" data-id="${seg.id}" tabindex="0">
        <div class="seg-head">
          <div class="seg-no">${seg.order_no}</div>
          <select class="seg-part">${partOptionsHtml(seg.section)}</select>
          <span class="seg-opinion-badge" style="display:${partOf(seg.section) === "내 의견" ? "inline-block" : "none"};">내 의견</span>
          <div class="seg-duration">
            <span class="seg-duration-display"></span>
            <input type="number" class="seg-duration-input" step="0.1" min="0" style="display:none;">
            <button type="button" class="seg-duration-edit">수정</button>
            <button type="button" class="seg-duration-save" style="display:none;">저장</button>
          </div>
          <span class="seg-save-state"></span>
          <button type="button" class="seg-icon-btn seg-revert-btn" title="마지막 저장 상태로 되돌리기">↺</button>
          <button type="button" class="seg-icon-btn seg-delete-btn" title="이 장면 삭제">×</button>
        </div>
        <div class="seg-thumbs-area">${thumbsHtml(seg)}</div>
        <div class="seg-actions" style="margin-bottom:4px;">
          <label class="seg-file-label">
            + 사진/영상 추가 (여러 개 선택 가능)
            <input type="file" class="seg-file-input" accept="image/*,video/*" multiple>
          </label>
        </div>
        <div style="color:#a89bb5;font-size:0.75rem;margin-bottom:10px;">이 카드 아무 곳이나 클릭한 뒤 Ctrl+V로도 이미지를 붙여넣을 수 있어요.</div>
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin:14px 0 6px;color:#a89bb5;font-size:0.9rem;font-weight:600;">
          <span>대사 (영상의 음성·자막이 이 내용으로 만들어집니다)</span>
          <button type="button" class="seg-emph-btn" style="width:auto;padding:3px 10px;font-size:0.7rem;margin:0;background:#221a2e;flex-shrink:0;">선택한 글자 강조</button>
        </div>
        <textarea class="seg-script" placeholder="${/내 의견/.test(seg.section || '') ? '내 의견을 직접 써 넣으세요. 비워두면 이 장면은 거의 나오지 않습니다 (노출 시간 1초 기준)' : '이 장면에서 나오는 대본 문장'}">${escapeHtml(seg.script_text)}</textarea>
        <div class="settings-note" style="margin:-4px 0 8px;">강조할 글자를 드래그해서 선택한 뒤 "선택한 글자 강조"를 누르면 <b>**글자**</b>로 표시되고, 자막에서 노란색으로 튀어 보입니다. (다시 누르면 해제)</div>
        <label>ACTION (사진의 카메라 연출만 해당 — 줌인 / 줌아웃 / 좌에서 우로 패닝 / 틸트업 등. 글자 강조는 위 대사에서)</label>
        <textarea class="seg-direction" placeholder="예: 천천히 줌인">${escapeHtml(seg.direction)}</textarea>
        <input type="hidden" class="seg-section" value="${escapeAttr(seg.section)}">
        <label>자료사진/영상 검색 키워드</label>
        <input type="text" class="seg-keyword" value="${escapeAttr(seg.keyword)}" placeholder="Pexels 검색 키워드 (영어)">
        <button type="button" class="seg-pexels-search-btn" style="background:#221a2e;">검색 미리보기</button>
        <div class="seg-pexels-preview"></div>
      </div>
    `;
    }).join("");

    document.querySelectorAll(".seg-item").forEach((el) => {
      const id = el.dataset.id;
      const stateEl = el.querySelector(".seg-save-state");
      const markDirty = () => { el.dataset.dirty = "1"; stateEl.className = "seg-save-state"; stateEl.textContent = "수정됨"; };
      // 카드 선택이 풀리면(다른 곳을 누르거나 다른 카드로 이동) 자동 저장. 되돌리기/삭제 같은 카드 안 버튼을 누르는 경우는 건너뛴다.
      el.addEventListener("focusout", (e) => {
        if (e.relatedTarget && el.contains(e.relatedTarget)) return;
        clearTimeout(el._autoTimer);
        el._autoTimer = setTimeout(() => {
          if (el.dataset.dirty && !el.contains(document.activeElement)) saveSegmentCard(id, el);
        }, 400);
      });

      const scriptEl = el.querySelector(".seg-script");
      scriptEl.addEventListener("input", () => { autoGrow(scriptEl); markDirty(); updateRuntimeSummary(); });
      autoGrow(scriptEl);
      el.querySelector(".seg-emph-btn").addEventListener("click", (e) => {
        e.preventDefault();
        const start = scriptEl.selectionStart, end = scriptEl.selectionEnd;
        if (start === end) { showMsg("먼저 대사에서 강조할 글자를 드래그해서 선택하세요.", false); return; }
        const v = scriptEl.value;
        const selected = v.slice(start, end);
        const wrapped = /^\*\*.+\*\*$/.test(selected) ? selected.slice(2, -2)
          : (v.slice(start - 2, start) === "**" && v.slice(end, end + 2) === "**")
            ? null : `**${selected}**`;
        if (wrapped === null) {
          // 이미 강조된 글자 안쪽을 선택한 경우: 바깥 ** 를 제거
          scriptEl.value = v.slice(0, start - 2) + selected + v.slice(end + 2);
        } else {
          scriptEl.value = v.slice(0, start) + wrapped + v.slice(end);
        }
        scriptEl.dispatchEvent(new Event("input", { bubbles: true }));
      });
      const directionEl = el.querySelector(".seg-direction");
      directionEl.addEventListener("input", () => { autoGrow(directionEl); markDirty(); });
      autoGrow(directionEl);
      el.querySelector(".seg-part").addEventListener("change", (e) => {
        el.querySelector(".seg-section").value = e.target.value;
        markDirty();
        refreshGroupHeaders();
      });
      const keywordEl = el.querySelector(".seg-keyword");
      const previewBox = el.querySelector(".seg-pexels-preview");
      keywordEl.addEventListener("input", markDirty);

      const triggerPexelsSearch = () => {
        const q = keywordEl.value.trim();
        if (!q) { showMsg("검색어를 먼저 입력하세요.", false); return; }
        searchPexelsPreview(previewBox, q, id);
      };
      el.querySelector(".seg-pexels-search-btn").addEventListener("click", triggerPexelsSearch);
      keywordEl.addEventListener("keydown", (e) => {
        if (e.key === "Enter") { e.preventDefault(); triggerPexelsSearch(); }
      });

      el.querySelector(".seg-file-input").addEventListener("change", (e) => uploadSegmentAssets(id, e.target.files));
      bindThumbDeletes(el, id);
      el.querySelector(".seg-revert-btn").addEventListener("click", () => { clearTimeout(el._autoTimer); revertSegmentCard(id, el); });
      el.querySelector(".seg-delete-btn").addEventListener("click", () => { clearTimeout(el._autoTimer); deleteSegmentCard(id, el); });

      const durDisplay = el.querySelector(".seg-duration-display");
      const durInput = el.querySelector(".seg-duration-input");
      const durEditBtn = el.querySelector(".seg-duration-edit");
      const durSaveBtn = el.querySelector(".seg-duration-save");

      durEditBtn.addEventListener("click", () => {
        const seg = segments.find((s) => String(s.id) === id);
        durInput.value = effectiveSeconds(el, seg).toFixed(1);
        durDisplay.style.display = "none";
        durEditBtn.style.display = "none";
        durInput.style.display = "inline-block";
        durSaveBtn.style.display = "inline-block";
        durInput.focus();
        durInput.select();
      });

      durInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") durSaveBtn.click();
      });

      durSaveBtn.addEventListener("click", async () => {
        const raw = durInput.value;
        const value = raw === "" ? null : parseFloat(raw);
        durSaveBtn.disabled = true;
        try {
          const res = await fetch(`${SUPABASE_URL}/rest/v1/youtube_segments?id=eq.${id}`, {
            method: "PATCH", headers: jsonHeaders,
            body: JSON.stringify({ target_seconds: value }),
          });
          if (!res.ok) throw new Error(await res.text());
          const seg = segments.find((s) => String(s.id) === id);
          if (seg) seg.target_seconds = value;
          durInput.style.display = "none";
          durSaveBtn.style.display = "none";
          durDisplay.style.display = "inline";
          durEditBtn.style.display = "inline-block";
          updateRuntimeSummary();
          showMsg("노출 시간을 저장했습니다.", true);
        } catch (err) {
          showMsg("노출 시간 저장 실패: " + err.message, false);
        } finally {
          durSaveBtn.disabled = false;
        }
      });
    });

    updateRuntimeSummary();
  }

  function autoGrow(el) {
    el.style.height = "auto";
    el.style.height = el.scrollHeight + "px";
  }

  async function selectPexelsResult(id, hdUrl, btn) {
    const seg = segments.find((s) => String(s.id) === id);
    if (!seg || !hdUrl) return;
    const paths = seg.asset_paths || [];
    if (paths.includes(hdUrl)) { showMsg("이미 이 장면에 추가된 영상입니다.", false); return; }
    btn.disabled = true;
    try {
      await saveField(id, "asset_paths", [...paths, hdUrl]);
      refreshThumbs(id);
      btn.textContent = "추가됨 ✓";
      showMsg("선택한 영상을 이 장면 소재로 추가했습니다.", true);
    } catch (err) {
      btn.disabled = false;
      showMsg("영상 추가 실패: " + err.message, false);
    }
  }

  async function searchPexelsPreview(box, query, id) {
    box.classList.add("open");
    box.innerHTML = '<div class="seg-pexels-loading">Pexels에서 검색 중...</div>';
    try {
      const res = await fetch(`/api/pexels-search?q=${encodeURIComponent(query)}&orientation=portrait`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "검색 실패");
      if (!data.results.length) {
        box.innerHTML = '<div class="seg-pexels-loading">검색 결과가 없습니다.</div>';
        return;
      }
      const seg = segments.find((s) => String(s.id) === id);
      const already = new Set((seg && seg.asset_paths) || []);
      box.innerHTML = `<div class="seg-pexels-grid">${data.results.map((r) => `
        <div class="seg-pexels-item">
          <div class="seg-pexels-thumb-wrap" data-preview="${escapeAttr(r.preview_url)}">
            <img src="${r.thumbnail}?w=200" alt="" loading="lazy">
            <span class="seg-pexels-dur">${Math.round(r.duration)}s</span>
          </div>
          <button type="button" class="seg-pexels-pick" data-hd="${escapeAttr(r.hd_url)}" ${already.has(r.hd_url) ? "disabled" : ""}>
            ${already.has(r.hd_url) ? "추가됨 ✓" : "선택"}
          </button>
        </div>
      `).join("")}</div>
      <div class="seg-pexels-loading">썸네일을 누르면 미리 재생, "선택"을 누르면 이 장면 소재로 추가됩니다.</div>`;
      box.querySelectorAll(".seg-pexels-thumb-wrap").forEach((wrap) => {
        wrap.addEventListener("click", () => {
          const url = wrap.dataset.preview;
          if (!url || wrap.querySelector("video")) return;
          wrap.innerHTML = `<video src="${url}" autoplay muted loop playsinline></video>`;
        });
      });
      box.querySelectorAll(".seg-pexels-pick").forEach((btn) =>
        btn.addEventListener("click", () => selectPexelsResult(id, btn.dataset.hd, btn))
      );
    } catch (err) {
      box.innerHTML = `<div class="seg-pexels-loading">미리보기 실패: ${escapeHtml(err.message)}</div>`;
    }
  }

  async function refreshSegments(scriptId) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/youtube_segments?select=*&script_id=eq.${scriptId}&order=order_no.asc`, { headers });
    segments = await res.json();
    document.getElementById("regenBtn").textContent = segments.length ? "콘티 다시 생성" : "콘티 생성";
    const scrollY = window.scrollY;
    render();
    updateSettingsPreview();
    window.scrollTo(0, scrollY);
  }

  async function saveField(id, field, value) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/youtube_segments?id=eq.${id}`, {
      method: "PATCH",
      headers: jsonHeaders,
      body: JSON.stringify({ [field]: value }),
    });
    if (!res.ok) throw new Error(await res.text());
    const seg = segments.find((s) => String(s.id) === id);
    if (seg) seg[field] = value;
  }

  async function saveSegmentCard(id, el) {
    if (!el.dataset.dirty) return;
    const stateEl = el.querySelector(".seg-save-state");
    // 값은 저장을 시작하는 순간 읽어 둔다 (곧바로 다른 화면으로 넘어가도 이 값으로 저장된다)
    const scriptText = el.querySelector(".seg-script").value;
    const direction = el.querySelector(".seg-direction").value;
    const section = el.querySelector(".seg-section").value;
    const keyword = el.querySelector(".seg-keyword").value;
    delete el.dataset.dirty;
    stateEl.className = "seg-save-state";
    stateEl.textContent = "저장 중…";
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/youtube_segments?id=eq.${id}`, {
        method: "PATCH",
        headers: jsonHeaders,
        keepalive: true,
        body: JSON.stringify({ script_text: scriptText, direction, section, keyword }),
      });
      if (!res.ok) throw new Error(await res.text());
      const seg = segments.find((s) => String(s.id) === id);
      if (seg) { seg.script_text = scriptText; seg.direction = direction; seg.section = section; seg.keyword = keyword; }
      // 저장하는 동안 또 고쳤다면 다시 수정됨 상태로 둔다
      if (el.dataset.dirty) { stateEl.textContent = "수정됨"; return; }
      stateEl.className = "seg-save-state ok";
      stateEl.textContent = "저장됨 ✓";
      setTimeout(() => { if (!el.dataset.dirty && stateEl.textContent === "저장됨 ✓") stateEl.textContent = ""; }, 1500);
    } catch (err) {
      el.dataset.dirty = "1";
      stateEl.className = "seg-save-state";
      stateEl.textContent = "저장 실패";
      showMsg("장면 자동 저장 실패: " + err.message, false);
    }
  }

  async function deleteSegmentCard(id, el) {
    const seg = segments.find((s) => String(s.id) === id);
    if (!seg) return;
    if (!confirm(`${seg.order_no}번 장면을 삭제할까요? 직접 올린 사진/영상도 함께 지워집니다.`)) return;

    try {
      for (const path of (seg.asset_paths || []).filter((p) => !isExternalUrl(p))) {
        await fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET}/${path}`, { method: "DELETE", headers });
      }
      const res = await fetch(`${SUPABASE_URL}/rest/v1/youtube_segments?id=eq.${id}`, { method: "DELETE", headers });
      if (!res.ok) throw new Error(await res.text());

      segments = segments.filter((s) => String(s.id) !== id);
      el.remove();

      // 번호 빈틈이 생기지 않게 1부터 다시 매긴다 (다른 카드의 입력 중 내용은 건드리지 않고 번호만 갱신)
      for (let i = 0; i < segments.length; i++) {
        const s = segments[i];
        if (s.order_no === i + 1) continue;
        const r = await fetch(`${SUPABASE_URL}/rest/v1/youtube_segments?id=eq.${s.id}`, {
          method: "PATCH", headers: jsonHeaders, body: JSON.stringify({ order_no: i + 1 }),
        });
        if (!r.ok) throw new Error(await r.text());
        s.order_no = i + 1;
        const card = document.querySelector(`.seg-item[data-id="${s.id}"]`);
        if (card) card.querySelector(".seg-no").textContent = i + 1;
      }

      if (!segments.length) render();
      document.getElementById("regenBtn").textContent = segments.length ? "콘티 다시 생성" : "콘티 생성";
      updateRuntimeSummary();
      showMsg("장면을 삭제했습니다.", true);
    } catch (err) {
      showMsg("장면 삭제 실패: " + err.message, false);
    }
  }

  function revertSegmentCard(id, el) {
    const seg = segments.find((s) => String(s.id) === id);
    if (!seg) return;
    if (!el.dataset.dirty) { showMsg("되돌릴 수정 내용이 없습니다 (이미 저장된 상태입니다).", false); return; }
    if (!confirm("마지막으로 저장된 상태로 되돌릴까요? 지금 수정한 내용은 사라집니다.")) return;

    const scriptEl = el.querySelector(".seg-script");
    const directionEl = el.querySelector(".seg-direction");
    scriptEl.value = seg.script_text || "";
    directionEl.value = seg.direction || "";
    el.querySelector(".seg-section").value = seg.section || "";
    el.querySelector(".seg-part").innerHTML = partOptionsHtml(seg.section);
    el.querySelector(".seg-keyword").value = seg.keyword || "";
    autoGrow(scriptEl);
    autoGrow(directionEl);

    delete el.dataset.dirty;
    el.querySelector(".seg-save-state").textContent = "";
    updateRuntimeSummary();
    showMsg("마지막 저장 상태로 되돌렸습니다.", true);
  }

  async function uploadSegmentAssets(id, fileList) {
    const files = Array.from(fileList || []);
    if (!files.length) return;
    const scriptId = document.getElementById("scriptSelect").value;
    const seg = segments.find((s) => String(s.id) === id);
    const paths = [...(seg.asset_paths || [])];

    let uploaded = 0;
    for (const file of files) {
      const rawName = file.name || `pasted_${Date.now()}.${(file.type.split("/")[1] || "png")}`;
      const safeName = rawName.replace(/[^\w.\-]/g, "_");
      const path = `${scriptId}/seg${id}_${Date.now()}_${safeName}`;
      try {
        const upRes = await fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET}/${path}`, {
          method: "POST",
          headers: { ...headers, "Content-Type": file.type || "application/octet-stream" },
          body: file,
        });
        if (!upRes.ok) throw new Error(await upRes.text());
        paths.push(path);
        uploaded++;
      } catch (err) {
        showMsg(`"${file.name}" 업로드 실패: ${err.message}`, false);
      }
    }
    if (uploaded > 0) {
      await saveField(id, "asset_paths", paths);
      showMsg(`${uploaded}개 업로드 완료.`, true);
      refreshThumbs(id);
    }
  }

  // ───── 구간 지정 팝업 ─────
  let trimState = null; // { id, path, isGif, duration }
  function trimClamp() {
    const st = trimState;
    if (!st) return null;
    let start = parseFloat($("trimStart").value);
    let end = parseFloat($("trimEnd").value);
    if (Number.isNaN(start) || start < 0) start = 0;
    if (Number.isNaN(end)) end = null;
    if (st.duration) {
      start = Math.min(start, st.duration);
      if (end !== null) end = Math.min(end, st.duration);
    }
    return { start, end };
  }
  function updateTrimBar() {
    const t = trimClamp();
    if (!t) return;
    const dur = trimState.duration;
    if (!dur) { $("trimSel").style.left = "0"; $("trimSel").style.width = "100%"; $("trimInfo").textContent = "GIF는 미리보기 없이 시작/끝 초를 직접 입력하세요. 끝을 비우면 끝까지 씁니다."; return; }
    const end = t.end == null ? dur : t.end;
    $("trimSel").style.left = (t.start / dur * 100) + "%";
    $("trimSel").style.width = (Math.max(0, end - t.start) / dur * 100) + "%";
    $("trimInfo").textContent = end > t.start ? `사용 구간 ${t.start.toFixed(1)}~${end.toFixed(1)}초 (${(end - t.start).toFixed(1)}초) / 전체 ${dur.toFixed(1)}초` : "끝이 시작보다 뒤여야 합니다";
  }
  function openTrimModal(id, path) {
    const seg = segments.find((s) => String(s.id) === id);
    if (!seg) return;
    const cur = (seg.asset_trims || {})[path];
    const isGif = /\.gif(\?|$)/i.test(path);
    trimState = { id, path, isGif, duration: null };
    const host = $("trimMediaHost");
    host.innerHTML = isGif
      ? `<img src="${escapeAttr(assetUrl(path))}" alt="">`
      : `<video id="trimVideo" src="${escapeAttr(assetUrl(path))}" controls playsinline preload="metadata"></video>`;
    $("trimStart").value = cur ? Number(cur.start || 0).toFixed(1) : "0";
    $("trimEnd").value = cur && cur.end != null ? Number(cur.end).toFixed(1) : "";
    $("trimPreview").style.display = isGif ? "none" : "block";
    $("trimSetStart").style.display = $("trimSetEnd").style.display = isGif ? "none" : "block";
    $("trimModal").classList.add("open");
    updateTrimBar();
    const v = $("trimVideo");
    if (v) {
      v.addEventListener("loadedmetadata", () => {
        trimState.duration = v.duration;
        if (!$("trimEnd").value) $("trimEnd").value = v.duration.toFixed(1);
        updateTrimBar();
      });
    }
  }
  function closeTrimModal() {
    const v = $("trimVideo");
    if (v) v.pause();
    $("trimModal").classList.remove("open");
    $("trimMediaHost").innerHTML = "";
    trimState = null;
  }
  async function saveTrim(reset) {
    const st = trimState;
    if (!st) return;
    const seg = segments.find((s) => String(s.id) === st.id);
    const next = { ...(seg.asset_trims || {}) };
    const t = trimClamp();
    const dur = st.duration;
    const full = reset || (t.start <= 0.05 && (t.end == null || (dur && t.end >= dur - 0.05)));
    if (!full && t.end !== null && t.end <= t.start) { $("trimInfo").textContent = "끝이 시작보다 뒤여야 합니다"; return; }
    if (full) delete next[st.path];
    else next[st.path] = { start: Number(t.start.toFixed(2)), end: t.end == null ? null : Number(t.end.toFixed(2)) };
    try {
      await saveField(st.id, "asset_trims", next);
      const id = st.id;
      closeTrimModal();
      refreshThumbs(id);
    } catch (err) {
      const needSql = /asset_trims/.test(err.message);
      $("trimInfo").textContent = needSql ? "저장 실패: youtube_tables_12_asset_trims.sql을 Supabase에서 먼저 실행해야 합니다." : "저장 실패: " + err.message;
    }
  }
  ["trimStart", "trimEnd"].forEach((k) => $(k).addEventListener("input", updateTrimBar));
  $("trimSetStart").addEventListener("click", () => { const v = $("trimVideo"); if (v) { $("trimStart").value = v.currentTime.toFixed(1); updateTrimBar(); } });
  $("trimSetEnd").addEventListener("click", () => { const v = $("trimVideo"); if (v) { $("trimEnd").value = v.currentTime.toFixed(1); updateTrimBar(); } });
  $("trimPreview").addEventListener("click", () => {
    const v = $("trimVideo");
    const t = trimClamp();
    if (!v || !t) return;
    const end = t.end == null ? v.duration : t.end;
    v.currentTime = t.start;
    v.play();
    const stop = () => { if (v.currentTime >= end) { v.pause(); v.removeEventListener("timeupdate", stop); } };
    v.addEventListener("timeupdate", stop);
  });
  $("trimReset").addEventListener("click", () => saveTrim(true));
  $("trimDone").addEventListener("click", () => saveTrim(false));
  $("trimModal").addEventListener("click", (e) => { if (e.target === $("trimModal")) closeTrimModal(); });

  async function removeSegmentAsset(id, path) {
    if (!confirm("이 소재를 삭제할까요?")) return;
    const seg = segments.find((s) => String(s.id) === id);
    const paths = (seg.asset_paths || []).filter((p) => p !== path);
    if (!isExternalUrl(path)) {
      await fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET}/${path}`, { method: "DELETE", headers });
    }
    await saveField(id, "asset_paths", paths);
    if (seg.asset_trims && seg.asset_trims[path]) {
      const { [path]: _t, ...restTrims } = seg.asset_trims;
      await saveField(id, "asset_trims", restTrims);
    }
    if (seg.asset_notes && seg.asset_notes[path]) {
      const { [path]: _removed, ...rest } = seg.asset_notes;
      await saveField(id, "asset_notes", rest);
    }
    refreshThumbs(id);
  }

  let lastScriptId = "";
  document.getElementById("scriptSelect").addEventListener("change", (e) => {
    if (hasDirty() && !confirm("전체 설정에 저장 안 한 수정사항이 있습니다. 그래도 넘어갈까요?")) {
      e.target.value = lastScriptId;
      return;
    }
    if (cardsDirty()) flushDirtyCards(); // 장면 카드는 자동 저장
    lastScriptId = e.target.value;
    const inDetail = !!e.target.value;
    $("listView").style.display = inDetail ? "none" : "block";
    $("detailView").style.display = inDetail ? "block" : "none";
    if (inDetail) window.scrollTo(0, 0);
    loadSettingsCard(e.target.value);
    loadSegments(e.target.value);
    if (inDetail) refreshGenState(e.target.value);
  });
  function openConti(id) {
    const sel = $("scriptSelect");
    sel.value = String(id);
    sel.dispatchEvent(new Event("change", { bubbles: true }));
  }
  $("contiList").addEventListener("click", (e) => {
    const item = e.target.closest(".conti-item");
    if (item) openConti(item.dataset.id);
  });
  $("backToList").addEventListener("click", () => openConti(""));

  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden" && cardsDirty()) flushDirtyCards(); });
  window.addEventListener("beforeunload", (e) => {
    if (cardsDirty()) flushDirtyCards();
    if (hasDirty() || cardsDirty()) {
      e.preventDefault();
      e.returnValue = "";
    }
  });

  $("addMediaBtn").addEventListener("click", addArticleMedia);

  // ───── 영상 생성: 시작하면 "생성 중"으로 바뀌고, 끝나면 알림. 완성 영상은 Studio에서 확인 ─────
  const genWatch = new Map(); // scriptId -> 타이머
  async function refreshGenState(scriptId) {
    const btn = $("genBtn");
    const status = await genFetchStatus(scriptId);
    if (String($("scriptSelect").value) !== String(scriptId)) return status;
    if (status === "running") {
      btn.disabled = true;
      btn.textContent = "영상 생성 중... (몇 분 걸려요)";
      watchGeneration(scriptId);
    } else {
      btn.disabled = false;
      btn.textContent = `영상 생성 (v${await genNextVersion(scriptId)})`;
    }
    return status;
  }

  function watchGeneration(scriptId) {
    if (genWatch.has(String(scriptId))) return;
    const timer = setInterval(async () => {
      const status = await genFetchStatus(scriptId);
      if (status === "running" || status === null) return;
      clearInterval(timer);
      genWatch.delete(String(scriptId));
      const row = scripts.find((r) => String(r.id) === String(scriptId));
      if (row) row.generation_status = status;
      const name = row ? ((row.video_settings && row.video_settings.name) || (row.hook || "").slice(0, 20)) : "";
      genNotify(name, status === "done");
      if (String($("scriptSelect").value) === String(scriptId)) refreshGenState(scriptId);
    }, 8000);
    genWatch.set(String(scriptId), timer);
  }

  $("genBtn").addEventListener("click", async () => {
    const scriptId = $("scriptSelect").value;
    const row = scripts.find((r) => String(r.id) === String(scriptId));
    if (!row) return;
    if (hasDirty()) { showMsg("전체 설정에 저장 안 한 수정사항이 있습니다. 먼저 저장한 뒤 영상을 생성하세요.", false); return; }
    const btn = $("genBtn");
    btn.disabled = true;
    try {
      await flushDirtyCards();
      if (cardsDirty()) throw new Error("장면 저장이 끝나지 않았습니다. 잠시 후 다시 눌러주세요.");
      const version = await genNextVersion(scriptId);
      if (!confirm(`v${version} 영상 생성을 시작할까요? 몇 분 걸리고, 완성되면 알려드립니다. 영상은 Studio에서 확인하세요.`)) { btn.disabled = false; return; }
      genRequestPermission();
      await genStart(row, segments, version);
      row.generation_status = "running";
      btn.textContent = "영상 생성 중... (몇 분 걸려요)";
      watchGeneration(scriptId);
      showMsg("영상 생성을 시작했습니다. 완성되면 알림이 뜹니다.", true);
    } catch (err) {
      btn.disabled = false;
      showMsg("영상 생성 실패: " + err.message, false);
    }
  });

  document.getElementById("addSegBtn").addEventListener("click", async () => {
    const scriptId = document.getElementById("scriptSelect").value;
    if (!scriptId) return;
    const nextOrder = segments.length ? Math.max(...segments.map((s) => s.order_no)) + 1 : 1;
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/youtube_segments`, {
        method: "POST",
        headers: jsonHeaders,
        body: JSON.stringify({
          script_id: Number(scriptId), order_no: nextOrder,
          section: "", script_text: "", keyword: "", direction: "", asset_paths: [],
        }),
      });
      if (!res.ok) throw new Error(await res.text());
      showMsg("장면을 추가했습니다.", true);
      await refreshSegments(scriptId);
      const list = document.getElementById("segList");
      list.lastElementChild?.scrollIntoView({ behavior: "smooth", block: "center" });
    } catch (err) {
      showMsg("장면 추가 실패: " + err.message, false);
    }
  });

  document.addEventListener("paste", (e) => {
    const items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    const files = Array.from(items)
      .filter((it) => it.kind === "file" && it.type.startsWith("image/"))
      .map((it) => it.getAsFile())
      .filter(Boolean);
    if (!files.length) return;

    const segEl = document.activeElement && document.activeElement.closest(".seg-item");
    if (!segEl) return;

    e.preventDefault();
    uploadSegmentAssets(segEl.dataset.id, files);
  });

  document.getElementById("regenBtn").addEventListener("click", async () => {
    const scriptId = document.getElementById("scriptSelect").value;
    const row = scripts.find((r) => String(r.id) === scriptId);
    if (!row) return;
    if (segments.length && !confirm("기존 콘티를 지우고 새로 만들까요? (업로드해둔 소재도 함께 삭제됩니다)")) return;

    const btn = document.getElementById("regenBtn");
    btn.disabled = true;
    btn.textContent = "생성 중...";
    try {
      const res = await fetch("/api/gemini-storyboard", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          category: row.category, hook: row.hook, story: row.story, closing: row.closing,
          mood: (MOODS.find((m) => m.id === currentSettings.mood) || {}).desc || "",
          moodNote: currentSettings.mood_note || "",
        }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "콘티 생성 실패");

      for (const seg of segments) {
        for (const path of (seg.asset_paths || []).filter((p) => !isExternalUrl(p))) {
          await fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET}/${path}`, { method: "DELETE", headers });
        }
      }
      await fetch(`${SUPABASE_URL}/rest/v1/youtube_segments?script_id=eq.${scriptId}`, { method: "DELETE", headers });

      const inserts = data.segments.map((seg, i) => ({
        script_id: Number(scriptId),
        order_no: i + 1,
        section: seg.section,
        script_text: seg.script_text,
        keyword: seg.keyword,
        direction: seg.direction,
      }));
      await fetch(`${SUPABASE_URL}/rest/v1/youtube_segments`, {
        method: "POST",
        headers: jsonHeaders,
        body: JSON.stringify(inserts),
      });
      showMsg("콘티 생성 완료.", true);
      loadSegments(scriptId);
    } catch (err) {
      showMsg("콘티 생성 실패: " + err.message, false);
    } finally {
      btn.disabled = false;
      btn.textContent = segments.length ? "콘티 다시 생성" : "콘티 생성";
    }
  });

  loadScripts();
  initDraftFromTrend();

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/sw.js");
  }
</script>
<script src="/youtube/generate.js"></script>
<script src="/hub-nav.js"></script>
</body>
