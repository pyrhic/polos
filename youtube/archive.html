<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>완성 영상 모음 — Wicked Wiki</title>
<link rel="stylesheet" href="/youtube/style.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0f0a14">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  video { width: 100%; border-radius: 3px; margin-top: 10px; background:#000; }
  .status-tag { display:inline-block; padding:2px 8px; border-radius:10px; font-size:0.7rem; font-weight:800; text-transform:uppercase; }
  .status-idle { background:#3a2f14; color:#ffd93d; }
  .status-running { background:#16324a; color:#4fc3f7; }
  .status-done { background:#17331a; color:#7cff4a; }
  .status-error { background:#3a1414; color:#ff8a80; }
  .filter-row { display:flex; gap:8px; margin-bottom:16px; }
  .filter-row button { width:auto; padding:6px 14px; font-size:0.8rem; }
  .filter-row button.active { background:#7cff4a; color:#0f0a14; }
</style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="/youtube/index.html">← Wicked Wiki</a>
    <h1 style="font-size:1.4rem;margin-bottom:1.2rem;">완성 영상 모음</h1>

    <div class="filter-row">
      <button type="button" class="filter-btn active" data-filter="done">완성됨</button>
      <button type="button" class="filter-btn" data-filter="all">전체</button>
    </div>

    <div id="list"><div class="empty">불러오는 중...</div></div>
  </div>

<script src="/youtube/upload.js"></script>
<script>
  const SUPABASE_URL = "https://oenqrlgmnkpzxsavnfyo.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_sZ4wQgaC5f-i40pVzf0vIA_R7iJWDf5";
  const headers = { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` };
  let rows = [];
  let filter = "done";

  function escapeHtml(s) {
    return String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  }

  let outputsByScript = {};

  // 콘티 이름 (전체 설정에서 정한 이름, 없으면 후킹 앞부분)
  function videoName(r) {
    return (r.video_settings && r.video_settings.name) || (r.hook || "").slice(0, 20);
  }
  function downloadUrl(url, name, version) {
    return `${url}?download=${encodeURIComponent(`${name} v${version}.mp4`)}`;
  }

  async function load() {
    const list = document.getElementById("list");
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/youtube_scripts?select=*&order=created_at.desc`, { headers });
      rows = await res.json();
      const ids = rows.map((r) => r.id);
      if (ids.length) {
        const outRes = await fetch(`${SUPABASE_URL}/rest/v1/youtube_outputs?select=*&script_id=in.(${ids.join(",")})&order=version.desc`, { headers });
        const outRows = await outRes.json();
        outputsByScript = {};
        outRows.forEach((o) => { (outputsByScript[o.script_id] ||= []).push(o); });
      }
      render();
    } catch (err) {
      list.innerHTML = '<div class="empty">불러오기 실패: ' + err.message + "</div>";
    }
  }

  function render() {
    const list = document.getElementById("list");
    const shown = filter === "done" ? rows.filter((r) => (outputsByScript[r.id] || []).length > 0) : rows;

    if (!shown.length) {
      list.innerHTML = filter === "done"
        ? '<div class="empty">아직 완성된 영상이 없습니다.</div>'
        : '<div class="empty">저장된 대본이 없습니다.</div>';
      return;
    }

    list.innerHTML = shown.map((r) => {
      const outputs = outputsByScript[r.id] || [];
      return `
      <div class="card-box">
        <div class="s-meta" style="margin-bottom:6px;">
          <span class="status-tag status-${r.generation_status || "idle"}">${r.generation_status || "idle"}</span>
          · ${escapeHtml(r.category || "")} · ${new Date(r.created_at).toLocaleDateString("ko-KR")}
        </div>
        <div class="title" style="font-weight:700;margin-bottom:4px;">${escapeHtml(r.hook)}</div>
        ${outputs.map((o) => `
          <div style="margin-top:12px;">
            <div class="s-meta" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
              <span>${escapeHtml(videoName(r))} v${o.version}</span>
              <button type="button" class="out-del-btn" data-id="${o.id}" data-path="${escapeHtml(o.storage_path)}" data-version="${o.version}" style="width:auto;padding:3px 10px;font-size:0.7rem;background:#3a1414;color:#ff8a80;">삭제</button>
            </div>
            <video controls preload="none" src="${o.video_url}"></video>
            <a class="link-btn" style="margin-top:8px;" href="${downloadUrl(o.video_url, videoName(r), o.version)}" download>다운로드</a>
            ${uploadBlockHtml(o, r)}
          </div>
        `).join("")}
      </div>
    `;
    }).join("");

    document.querySelectorAll(".out-del-btn").forEach((btn) =>
      btn.addEventListener("click", () => deleteOutput(btn.dataset.id, btn.dataset.path, btn.dataset.version))
    );
    bindUploadBlocks(load);
    if (ytAnyUploading(outputsByScript)) ytSchedulePoll(load);
  }

  async function deleteOutput(id, path, version) {
    if (!confirm(`v${version} 영상을 삭제할까요? 되돌릴 수 없습니다.`)) return;
    try {
      const sres = await fetch(`${SUPABASE_URL}/storage/v1/object/youtube-outputs/${path}`, { method: "DELETE", headers });
      if (!sres.ok && sres.status !== 404) throw new Error(await sres.text());
      const rres = await fetch(`${SUPABASE_URL}/rest/v1/youtube_outputs?id=eq.${id}`, { method: "DELETE", headers });
      if (!rres.ok) throw new Error(await rres.text());
      load();
    } catch (err) {
      alert("삭제 실패: " + err.message);
    }
  }

  document.querySelectorAll(".filter-btn").forEach((btn) =>
    btn.addEventListener("click", () => {
      document.querySelectorAll(".filter-btn").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      filter = btn.dataset.filter;
      render();
    })
  );

  load();

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/sw.js");
  }
</script>
<script src="/hub-nav.js"></script>
</body>
</html>
