<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pexels — wizard-yt</title>
<link rel="stylesheet" href="/youtube/style.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  .cu-item { background:var(--card); border-radius:3px; padding:12px; margin-bottom:10px; border:1px solid transparent; }
  .cu-item.locked { border-color:var(--accent); }
  .cu-head { display:flex; align-items:center; gap:6px; margin-bottom:8px; flex-wrap:wrap; }
  .cu-no { background:var(--inset); color:var(--text); font-weight:800; font-size:0.8rem; width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .cu-body { display:flex; gap:10px; }
  .cu-photo { width:96px; height:128px; border-radius:3px; background:var(--inset) center/cover no-repeat; flex-shrink:0; cursor:pointer; position:relative; border:2px solid transparent; }
  .cu-photo:hover { border-color:var(--accent); }
  .cu-photo span { position:absolute; left:0; right:0; bottom:0; background:rgba(0,0,0,0.65); color:#fff; font-size:0.62rem; text-align:center; padding:2px 0; }
  .cu-fields { flex:1; min-width:0; }
  .cu-fields input { margin-bottom:6px; font-size:0.88rem; padding:7px 9px; }
  .cu-fields .k { font-size:0.7rem; color:var(--muted); margin:0 0 2px; }
  .cu-why { font-size:0.72rem; color:var(--muted); line-height:1.4; margin-top:2px; word-break:break-word; }
  .cu-why i { font-style:normal; opacity:0.75; }
  .cu-mini { width:auto; padding:3px 9px; margin:0; font-size:0.72rem; background:var(--btn); color:var(--text); text-transform:none; letter-spacing:0; }
  .cu-mini.del { color:var(--danger); margin-left:auto; }
  .cu-mini.on { background:var(--accent-dim); color:var(--accent); }
  .cu-acts { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
  .cu-redo { display:flex; gap:6px; margin-top:6px; }
  .cu-redo input { flex:1; min-width:0; margin:0; font-size:0.82rem; padding:6px 8px; }
  .cu-card { background:var(--card); border-radius:3px; padding:14px; margin-bottom:12px; }
  .cu-card h2 { font-size:0.95rem; margin:0 0 8px; }
  .cu-row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .cu-row input[type="number"] { width:80px; }
  .cu-topic { font-size:0.85rem; color:var(--text-2); line-height:1.5; margin-bottom:8px; }
  .cu-topic b { color:var(--text); }
  .cu-sum { background:var(--inset); border-radius:3px; padding:10px 14px; color:var(--text-2); font-weight:700; font-size:0.9rem; margin:10px 0; }
  .cu-main { background:var(--btn); color:var(--text); box-shadow:inset 0 0 0 1px var(--text); padding:12px; font-size:0.95rem; }
  .cu-main:hover { background:var(--hover); color:var(--on-accent); }
  .cu-main:disabled { background:var(--line-strong); color:var(--muted-2); box-shadow:none; }
  .cu-file { display:block; background:var(--btn); color:var(--text); box-shadow:inset 0 0 0 1px var(--btn-ring); text-align:center; padding:9px; border-radius:3px; font-size:0.85rem; cursor:pointer; margin-top:6px; transition:background 0.15s, color 0.15s; }
  .cu-file:hover { background:var(--hover); color:var(--on-accent); }
  .cu-save { font-size:0.75rem; color:var(--muted); text-align:right; min-height:1em; }
  .cu-fmt { display:inline-block; font-size:0.68rem; font-weight:800; padding:2px 8px; border-radius:10px; background:var(--accent-dim); color:var(--accent); margin-right:6px; vertical-align:middle; }
  body.land .cu-photo { width:128px; height:72px; }
  body.land .cu-grid div { aspect-ratio:16/9; }
  .cu-modal { display:none; position:fixed; inset:0; z-index:50; background:rgba(0,0,0,0.8); overflow-y:auto; padding:12px; }
  .cu-modal.open { display:block; }
  .cu-modal-box { background:var(--card); border-radius:6px; padding:14px; max-width:480px; margin:0 auto; }
  .cu-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-top:10px; }
  .cu-grid div { aspect-ratio:3/4; background:var(--inset) center/cover no-repeat; border-radius:3px; cursor:pointer; border:2px solid transparent; position:relative; }
  .cu-grid div:hover { border-color:var(--accent); }
  .cu-grid div.sel { border-color:var(--accent); }
  .cu-grid div.used { opacity:0.35; cursor:not-allowed; }
  .cu-grid small { position:absolute; left:0; right:0; bottom:0; background:rgba(0,0,0,0.6); font-size:0.55rem; padding:1px 3px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; color:#fff; }
  .cu-note { color:var(--muted); font-size:0.78rem; margin:6px 0; line-height:1.5; }
  .cu-err { color:var(--danger); }
  textarea.cu-fb { width:100%; min-height:60px; resize:vertical; box-sizing:border-box; font:inherit; font-size:0.88rem; }
</style>
</head>
<body>
  <div class="wrap">
    <a class="back" id="backLink" href="/youtube/pexels.html">← Pexels</a>
    <h1 style="font-size:1.4rem;margin-bottom:1.2rem;">Pexels</h1>

    <div id="editView" style="display:none;">
      <div class="cu-card">
        <div class="cu-topic" id="topicLine"></div>
        <label for="curTitle" style="margin-top:0;">제목 (AI가 정한 후킹 — 영상 첫 화면에 들어갑니다)</label>
        <input type="text" id="curTitle" maxlength="60" placeholder="AI 기획이 끝나면 채워져요">
        <button type="button" id="planBtn" class="ai-btn" style="margin-top:10px;display:none;">AI 기획 시작</button>
        <div class="cu-note" id="planMsg"></div>
      </div>

      <div id="items"></div>

      <div class="cu-card" id="fbCard" style="display:none;">
        <h2>전체 피드백</h2>
        <textarea class="cu-fb" id="fbText" maxlength="300" placeholder="예: 유럽은 빼고 더 기괴한 곳으로"></textarea>
        <div class="cu-row" style="margin-top:8px;">
          <label for="fbCount" style="margin:0;">사진 수</label>
          <input type="number" id="fbCount" min="3" max="40" value="10">
        </div>
        <button type="button" id="reviseBtn" class="ai-btn" style="margin-top:10px;">AI 다시 기획 (🔒 항목은 그대로)</button>
        <div class="cu-note">🔒 유지를 켠 항목은 그대로 두고 나머지만 다시 기획해요. 전과 같은 항목이 다시 나오면 고친 글과 사진을 그대로 써요.</div>
      </div>

      <div class="cu-card">
        <h2>영상 설정</h2>
        <div class="cu-row">
          <label style="margin:0;">사진 한 장당</label>
          <input type="number" id="curSecs" min="1.5" max="10" step="0.5" value="5">
          <label style="margin:0;">초 · 전환</label>
          <select id="curTrans" style="width:auto;">
            <option value="fade">부드럽게 (페이드)</option>
            <option value="cut">컷 (바로 전환)</option>
          </select>
        </div>
        <div class="cu-row" style="margin-top:10px;">
          <label style="margin:0;">사진 밑 자막</label>
          <select id="curCap" style="width:auto;">
            <option value="name_desc">이름 + 한 줄 설명</option>
            <option value="name">이름만</option>
            <option value="off">없음</option>
          </select>
          <select id="curCapFont" style="width:auto;">
            <option value="sans">고딕체</option>
            <option value="serif">명조체 (감성)</option>
          </select>
        </div>
        <div class="settings-note" style="margin:4px 0 0;color:var(--muted);font-size:0.75rem;">항목의 이름(장소, 나라)과 설명이 사진 아래에 작고 은은하게 나와요. 설명까지 읽으려면 사진 한 장당 4초 이상이 좋아요.</div>
        <label style="margin-top:12px;">배경음악 (사용이 허락된 음원만 올려주세요)</label>
        <div id="bgmArea"></div>
        <label class="cu-file">
          + 음악 파일 올리기<input type="file" id="bgmFile" accept="audio/*" style="display:none;">
        </label>
        <div class="cu-row" style="margin-top:8px;">
          <label style="margin:0;">음악 볼륨</label>
          <input type="range" id="curVol" min="10" max="100" step="5" value="80" style="flex:1;">
          <b id="curVolVal">80%</b>
        </div>
        <label>음악 출처·크레딧 (CC 곡은 설명란에 꼭 필요 — 유튜브 설명란에 자동으로 들어갑니다)</label>
        <input type="text" id="curCredit" maxlength="200" placeholder="예: Music: 곡명 — 아티스트 (YouTube Audio Library)">
      </div>

      <div class="cu-sum" id="sum"></div>
      <button type="button" id="genBtn" class="cu-main">영상 생성</button>
      <div class="cu-note cu-err" id="genNote" style="display:none;"></div>
      <div class="cu-save" id="saveState"></div>
      <div class="msg" id="msg"></div>
    </div>
  </div>

  <div class="cu-modal" id="pickModal">
    <div class="cu-modal-box">
      <div class="cu-row" style="margin-bottom:6px;"><b id="pickTitle" style="flex:1;"></b><button type="button" class="cu-mini" id="pickClose">닫기</button></div>
      <div class="cu-note" style="margin:0;">AI가 찾은 다른 후보예요. 눌러서 바꾸세요. (흐린 사진은 다른 항목에서 쓰는 중)</div>
      <div class="cu-grid" id="pickGrid"></div>
      <div class="cu-row" style="margin-top:10px;">
        <button type="button" class="cu-mini" id="pickMore">후보 더 보기</button>
        <span class="cu-note" id="pickInfo" style="margin:0;"></span>
      </div>
      <div class="cu-note">사진 출처(Pexels 작가)는 영상 설명란에 자동으로 들어갑니다.</div>
    </div>
  </div>

<script src="/config.js"></script>
<script src="/youtube/generate.js"></script>
<script>
  const SUPABASE_URL = POLOS_CONFIG.SUPABASE_URL;
  const SUPABASE_ANON_KEY = POLOS_CONFIG.SUPABASE_ANON_KEY;
  const BUCKET = "youtube-assets";
  const CATEGORY = PEXELS_CATEGORY;   // generate.js (새 행은 "Pexels")
  const headers = { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` };
  const jsonHeaders = { ...headers, "Content-Type": "application/json" };
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  // 흐름: 형식·요청(pexels.html) → AI 기획(주제·사진 수·제목·항목·자막을 AI가 정하고 사진 자동 선택) → 첨삭·피드백 → 영상 생성. 늘 자동 저장.
  // 형식: video_settings.pexels_format "short"(세로 9:16, 1~2분) | "long"(가로 16:9). 파이프라인은 video_settings.orientation(portrait|landscape)을 읽는다.
  let cur = null;          // 편집 중인 슬라이드쇼
  let curRow = null;       // DB의 콘티 행
  let busy = false;        // AI 기획·사진 고르기 중 (그동안 구조를 바꾸는 버튼은 막는다)
  const genWatch = new Map();
  const DEFAULT_SECS = 5;   // 사진 한 장당 기본 초 (숏폼은 사진 10~12장 → 약 1분)
  const MAX_ITEMS = 40;
  const orientOf = (format) => (format === "long" ? "landscape" : "portrait");

  // ───────── 열기 / 새로 만들기 ─────────
  function newSlideshow(format, note) {
    format = format === "long" ? "long" : "short";
    cur = { id: null, topic: "", note: note || "", format, orientation: orientOf(format), subject: "", title: "", secs: DEFAULT_SECS, transition: "fade", caption_mode: "name_desc", caption_font: "sans", bgm_path: null, bgm_volume: 0.8, credit: "", items: [] };
    curRow = null;
  }
  const newItem = (it) => ({ name: it.name || "", comment: it.desc || "", why: it.why || "", keyword: it.keyword || "", locked: false, photo: null, cands: null, candPage: 0 });

  async function openSlideshow(id) {
    const [rr, sr] = await Promise.all([
      fetch(`${SUPABASE_URL}/rest/v1/youtube_scripts?select=*&id=eq.${id}`, { headers }),
      fetch(`${SUPABASE_URL}/rest/v1/youtube_segments?select=*&script_id=eq.${id}&order=order_no.asc`, { headers }),
    ]);
    const row = rr.ok ? (await rr.json())[0] : null;
    if (!row) return false;
    const segs = await sr.json();
    const vs = row.video_settings || {};
    curRow = row;
    const format = vs.pexels_format === "long" || vs.orientation === "landscape" ? "long" : "short";
    cur = {
      id, topic: vs.pexels_topic || vs.title_text || vs.name || "", note: vs.pexels_note || "", title: vs.title_text || vs.name || "",
      format, orientation: orientOf(format), subject: vs.pexels_subject || "",
      secs: vs.secs_per_photo || DEFAULT_SECS, transition: vs.transition || "fade", caption_mode: vs.caption_mode || "name_desc", caption_font: vs.caption_font || "sans", bgm_path: vs.bgm_path || null,
      bgm_volume: vs.bgm_volume ?? 0.8, credit: vs.music_credit || "",
      items: segs.map((s) => {
        const notes = s.asset_notes || {};
        const url = (s.asset_paths || [])[0];
        const n = notes[url] || {};
        const plan = notes.__plan || {};
        return {
          name: s.section || "", comment: s.script_text || "", why: plan.why || "", keyword: s.keyword || "", locked: !!plan.locked, cands: null, candPage: 0,
          photo: url ? { id: n.pexels_id || null, url, thumb: n.thumb || url, page_url: n.articleUrl || "", photographer: n.photographer || "", photographer_url: n.photographer_url || "", alt: n.alt || "" } : null,
        };
      }),
    };
    showEdit();
    return true;
  }

  function showEdit() {
    $("editView").style.display = "block";
    document.body.classList.toggle("land", cur.orientation === "landscape");
    renderTopicLine();
    $("curTitle").value = cur.title;
    $("fbCount").value = cur.items.length || 10;
    $("curSecs").value = cur.secs; $("curTrans").value = cur.transition; $("curCap").value = cur.caption_mode || "name_desc"; $("curCapFont").value = cur.caption_font || "sans";
    $("curVol").value = Math.round(cur.bgm_volume * 100); $("curVolVal").textContent = Math.round(cur.bgm_volume * 100) + "%";
    $("curCredit").value = cur.credit;
    $("planMsg").textContent = ""; $("msg").className = "msg"; $("saveState").textContent = "";
    renderItems(); renderBgm(); updateSum();
    window.scrollTo(0, 0);
    if (cur.id) refreshGenState();
  }

  const SUBJECT_KO = { people: "사람", animal: "동물", place: "장소", thing: "사물", food: "음식", nature: "자연", other: "기타" };
  function renderTopicLine() {
    const fmt = cur.format === "long" ? "롱폼 · 가로 16:9" : "숏폼 · 세로 9:16 · 사진 10~12장";
    const topic = cur.topic ? `주제 <b>${esc(cur.topic)}</b>` : busy ? "AI가 주제를 고르는 중…" : "주제 (AI 기획 전)";
    $("topicLine").innerHTML = `<span class="cu-fmt">${fmt}</span>${topic}${cur.subject && SUBJECT_KO[cur.subject] ? ` · 사진 주인공 ${SUBJECT_KO[cur.subject]}` : ""}${cur.note ? ` · 요청 ${esc(cur.note)}` : ""}${cur.similarTo ? `<div class="cu-err" style="font-size:0.78rem;margin-top:4px;">이전 주제 '${esc(cur.similarTo)}'와 비슷해요 — 다른 주제를 원하면 아래 전체 피드백으로 바꾸세요.</div>` : ""}`;
  }

  // ───────── 항목 목록 (첨삭) ─────────
  function renderItems() {
    const n = cur.items.length;
    const dis = (cond) => (cond ? "disabled" : "");
    $("items").innerHTML = cur.items.map((it, i) => `
      <div class="cu-item${it.locked ? " locked" : ""}" data-i="${i}">
        <div class="cu-head">
          <div class="cu-no">${i + 1}</div>
          <button type="button" class="cu-mini lock${it.locked ? " on" : ""}" title="전체 피드백으로 다시 기획해도 이 항목은 그대로 둡니다">${it.locked ? "🔒 유지" : "🔓 유지"}</button>
          <button type="button" class="cu-mini up" ${dis(busy || i === 0)}>↑</button>
          <button type="button" class="cu-mini dn" ${dis(busy || i === n - 1)}>↓</button>
          <button type="button" class="cu-mini del" ${dis(busy)}>삭제</button>
        </div>
        <div class="cu-body">
          <div class="cu-photo" ${it.photo ? `style="background-image:url('${esc(it.photo.thumb)}')"` : ""}><span>${it.photo ? "다른 사진" : busy ? "사진 찾는 중" : "사진 없음"}</span></div>
          <div class="cu-fields">
            <div class="k">이름 (자막)</div><input type="text" class="f-name" value="${esc(it.name)}" maxlength="40">
            <div class="k">한 줄 설명 (사진 밑 자막)</div><input type="text" class="f-comment" value="${esc(it.comment)}" maxlength="80">
            ${it.why ? `<div class="cu-why">AI 메모: ${esc(it.why)}</div>` : ""}
            ${it.keyword ? `<div class="cu-why"><i>사진 검색: ${esc(it.keyword)}</i></div>` : ""}
          </div>
        </div>
        <div class="cu-acts">
          <button type="button" class="cu-mini alt" ${dis(!it.keyword)}>다른 사진</button>
          <button type="button" class="cu-mini redo ai-btn" ${dis(busy || it.locked)}>이 항목 다시</button>
        </div>
        ${it._redo && !it.locked ? `<div class="cu-redo"><input type="text" class="f-fb" maxlength="200" placeholder="피드백 (선택) 예: 더 따뜻한 느낌으로"><button type="button" class="cu-mini redo-go ai-btn" ${dis(busy)}>AI로 바꾸기</button></div>` : ""}
      </div>`).join("") || (busy ? "" : '<div class="empty" style="margin:16px 0;">아직 기획이 없어요. 위의 "AI 기획 시작"을 누르세요.</div>');
    document.querySelectorAll("#items .cu-item").forEach((el) => {
      const i = Number(el.dataset.i), it = cur.items[i];
      el.querySelector(".f-name").addEventListener("input", (e) => { it.name = e.target.value; queueSave(); });
      el.querySelector(".f-comment").addEventListener("input", (e) => { it.comment = e.target.value; queueSave(); });
      el.querySelector(".lock").addEventListener("click", () => { it.locked = !it.locked; renderItems(); queueSave(); });
      el.querySelector(".cu-photo").addEventListener("click", () => { if (it.keyword) openPicker(it); });
      el.querySelector(".alt").addEventListener("click", () => openPicker(it));
      el.querySelector(".redo").addEventListener("click", () => { it._redo = !it._redo; renderItems(); const f = document.querySelector(`.cu-item[data-i="${i}"] .f-fb`); if (f) f.focus(); });
      const go = el.querySelector(".redo-go");
      if (go) {
        const run = () => replaceItem(it, el.querySelector(".f-fb").value.trim());
        go.addEventListener("click", run);
        el.querySelector(".f-fb").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); run(); } });
      }
      el.querySelector(".up").addEventListener("click", () => { [cur.items[i - 1], cur.items[i]] = [cur.items[i], cur.items[i - 1]]; renderItems(); queueSave(); });
      el.querySelector(".dn").addEventListener("click", () => { [cur.items[i + 1], cur.items[i]] = [cur.items[i], cur.items[i + 1]]; renderItems(); queueSave(); });
      el.querySelector(".del").addEventListener("click", () => { cur.items.splice(i, 1); renderItems(); queueSave(); });
    });
    applyState(); updateSum();
  }

  function updateSum() {
    const n = cur.items.filter((it) => it.photo).length;
    const total = n * cur.secs; // 페이드 전환은 사진 시간 안에서 겹쳐서, 전체 길이 = 사진 수 x 사진당 시간
    $("sum").textContent = n ? `사진 ${n}장 · 예상 길이 약 ${total.toFixed(1)}초 (${(total / 60).toFixed(1)}분)` : "사진이 정해지면 예상 길이가 표시됩니다.";
    if (n && cur.format !== "long" && (total < 45 || total > 120)) $("sum").textContent += " · 숏폼은 1분 안팎을 권장해요";
    const missing = cur.items.length - n;
    if (missing > 0) $("sum").textContent += ` · 사진이 없는 항목 ${missing}개는 영상에서 빠집니다`;
  }

  // ───────── 설정 입력 ─────────
  $("curTitle").addEventListener("input", (e) => { cur.title = e.target.value; queueSave(); });
  $("curSecs").addEventListener("input", (e) => { cur.secs = Math.max(1.5, Math.min(10, Number(e.target.value) || 5)); updateSum(); queueSave(); });
  $("curTrans").addEventListener("change", (e) => { cur.transition = e.target.value; updateSum(); queueSave(); });
  $("curCap").addEventListener("change", (e) => { cur.caption_mode = e.target.value; queueSave(); });
  $("curCapFont").addEventListener("change", (e) => { cur.caption_font = e.target.value; queueSave(); });
  $("curVol").addEventListener("input", (e) => { cur.bgm_volume = Number(e.target.value) / 100; $("curVolVal").textContent = e.target.value + "%"; queueSave(); });
  $("curCredit").addEventListener("input", (e) => { cur.credit = e.target.value; queueSave(); });

  // ───────── 음악 ─────────
  function bgmUrl(path) { return `${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${path}`; }
  function renderBgm() {
    $("bgmArea").innerHTML = cur.bgm_path
      ? `<div class="cu-row"><audio controls preload="none" src="${esc(bgmUrl(cur.bgm_path))}" style="flex:1;height:34px;min-width:0;"></audio><button type="button" class="cu-mini del" id="bgmDel" style="margin:0;">삭제</button></div>`
      : '<div class="cu-note" style="margin:0;">배경음악 없음 (무음으로 만들어집니다)</div>';
    if ($("bgmDel")) $("bgmDel").addEventListener("click", async () => {
      const old = cur.bgm_path; cur.bgm_path = null; renderBgm(); queueSave();
      await fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET}/${old}`, { method: "DELETE", headers });
    });
  }
  $("bgmFile").addEventListener("change", async (e) => {
    const file = e.target.files[0]; e.target.value = "";
    if (!file) return;
    try {
      await saveNow(); // 올릴 폴더(콘티 번호)가 필요
      const path = `${cur.id}/bgm_${Date.now()}_${file.name.replace(/[^\w.\-]/g, "_")}`;
      const r = await fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET}/${path}`, { method: "POST", headers: { ...headers, "Content-Type": file.type || "audio/mpeg" }, body: file });
      if (!r.ok) throw new Error(await r.text());
      const old = cur.bgm_path; cur.bgm_path = path; renderBgm(); queueSave();
      if (old) await fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET}/${old}`, { method: "DELETE", headers });
    } catch (err) { showMsg("음악 올리기 실패: " + err.message, false); }
  });

  // ───────── 저장 (자동) ─────────
  let saveTimer = null, saving = Promise.resolve(), dirty = false;
  function queueSave() {
    updateSum();
    dirty = true; $("saveState").textContent = "수정됨";
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => { saveNow().catch(() => {}); }, 1200);
  }
  function flushSave() { clearTimeout(saveTimer); return dirty ? saveNow() : saving; }

  function creditLines() {
    const seen = new Set(), lines = [];
    cur.items.forEach((it) => {
      const p = it.photo;
      if (!p || !p.photographer || seen.has(p.photographer)) return;
      seen.add(p.photographer);
      lines.push(`사진: ${p.photographer} (Pexels)${p.photographer_url ? " — " + p.photographer_url : ""}`);
    });
    if (cur.credit.trim()) lines.push(cur.credit.trim());
    return lines.join("\n");
  }

  function saveNow() {
    clearTimeout(saveTimer);
    saving = saving.then(async () => {
      if (!cur) return;
      dirty = false;
      $("saveState").textContent = "저장 중…";
      const settings = {
        ...(curRow ? curRow.video_settings : {}),
        name: cur.title.trim() || cur.topic || "(제목 없음)", mode: "pexels", title_text: cur.title.trim(),
        secs_per_photo: cur.secs, transition: cur.transition, caption_mode: cur.caption_mode || "name_desc", caption_font: cur.caption_font || "sans", bgm_path: cur.bgm_path, bgm_volume: cur.bgm_volume, music_credit: cur.credit,
        pexels_topic: cur.topic, pexels_note: cur.note, pexels_format: cur.format, orientation: cur.orientation, pexels_subject: cur.subject || null,
      };
      delete settings.pexels_approved_at;   // 예전 버전이 남긴 승인 표시 칸은 더 쓰지 않아 지운다
      const scriptBody = { hook: cur.title.trim() || cur.topic || "(제목 없음)", fact_sources: creditLines(), video_settings: settings };
      if (!cur.id) {
        const r = await fetch(`${SUPABASE_URL}/rest/v1/youtube_scripts`, {
          method: "POST", headers: { ...jsonHeaders, Prefer: "return=representation" },
          body: JSON.stringify({ category: CATEGORY, story: "", closing: "", status: "approved", slug: `pexels-${Date.now()}`, ...scriptBody }),
        });
        if (!r.ok) { dirty = true; $("saveState").textContent = "저장 실패"; throw new Error(await r.text()); }
        curRow = (await r.json())[0]; cur.id = curRow.id;
        history.replaceState(null, "", `?id=${cur.id}`);   // 새로고침해도 같은 슬라이드쇼를 다시 연다
      } else {
        const r = await fetch(`${SUPABASE_URL}/rest/v1/youtube_scripts?id=eq.${cur.id}`, { method: "PATCH", headers: { ...jsonHeaders, Prefer: "return=representation" }, body: JSON.stringify(scriptBody) });
        if (!r.ok) { dirty = true; $("saveState").textContent = "저장 실패"; throw new Error(await r.text()); }
        curRow = (await r.json())[0] || curRow;
      }
      // 항목: 통째로 다시 쓴다 (항목 번호를 참조하는 곳이 없어서 안전). AI 메모·잠금은 asset_notes.__plan (영상 생성 요청에는 안 들어감)
      await fetch(`${SUPABASE_URL}/rest/v1/youtube_segments?script_id=eq.${cur.id}`, { method: "DELETE", headers });
      const rows = cur.items.map((it, i) => ({
        script_id: cur.id, order_no: i + 1, section: it.name, script_text: it.comment, keyword: it.keyword, direction: "",
        target_seconds: cur.secs, asset_paths: it.photo ? [it.photo.url] : [],
        asset_notes: {
          ...(it.photo ? { [it.photo.url]: { source: "Pexels", pexels_id: it.photo.id || null, photographer: it.photo.photographer, photographer_url: it.photo.photographer_url, articleUrl: it.photo.page_url, thumb: it.photo.thumb, alt: it.photo.alt || "" } } : {}),
          __plan: { why: it.why || "", locked: !!it.locked },
        },
      }));
      if (rows.length) {
        const r = await fetch(`${SUPABASE_URL}/rest/v1/youtube_segments`, { method: "POST", headers: jsonHeaders, body: JSON.stringify(rows) });
        if (!r.ok) { dirty = true; $("saveState").textContent = "저장 실패"; throw new Error(await r.text()); }
      }
      if (!dirty) { $("saveState").textContent = "저장됨 ✓"; setTimeout(() => { if (!dirty && $("saveState").textContent === "저장됨 ✓") $("saveState").textContent = ""; }, 1500); }
    }).catch((err) => { showMsg("저장 실패: " + err.message, false); });
    return saving;
  }

  function showMsg(t, ok) { const m = $("msg"); m.className = "msg " + (ok ? "ok" : "err"); m.textContent = t; }
  window.addEventListener("beforeunload", (e) => { if (dirty || busy) { if (dirty) saveNow(); e.preventDefault(); e.returnValue = ""; } });
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden" && dirty) saveNow(); });

  // ───────── 사진 후보 / 자동 선택 ─────────
  // 항목마다 AI 검색어로 Pexels를 한 번 불러(15장) 후보로 두고, 형식에 맞는 방향(숏폼 세로 / 롱폼 가로) 중 가장 잘 맞는 사진을 고른다.
  const toPhoto = (p) => ({ id: p.id, url: p.url, thumb: p.thumb, page_url: p.page_url, photographer: p.photographer, photographer_url: p.photographer_url, alt: p.alt || "", width: p.width, height: p.height });
  async function fetchCands(it, page) {
    const res = await fetch(`/api/pexels-photos?q=${encodeURIComponent(it.keyword)}&page=${page}&orientation=${cur.orientation === "landscape" ? "landscape" : "portrait"}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "사진 검색 실패");
    const list = (data.results || []).map(toPhoto);
    const seen = new Set((it.cands || []).map((p) => String(p.id)));
    it.cands = page === 1 ? list : [...(it.cands || []), ...list.filter((p) => !seen.has(String(p.id)))];
    it.candPage = page;
    it.candMore = (data.total || 0) > it.cands.length && page < 5;
    return it.cands;
  }
  const samePhoto = (a, b) => !!a && !!b && ((a.id && b.id && String(a.id) === String(b.id)) || a.url === b.url);
  function usedByOthers(it) { return cur.items.filter((o) => o !== it && o.photo).map((o) => o.photo); }
  const PEOPLE = /\b(man|men|woman|women|person|people|girl|boy|child|children|kid|portrait|selfie|couple|model|tourist|crowd)s?\b/i;
  function scorePhoto(p, rank, it, used) {
    let s = (15 - Math.min(rank, 15)) * 0.15;                                  // Pexels 관련도 순서
    const w = Number(p.width) || 0, h = Number(p.height) || 0;
    if (w && h) {
      if (cur.orientation === "landscape") { const r = w / h; s += r >= 1.5 && r <= 2.1 ? 3 : r >= 1.2 ? 1.5 : r >= 1 ? 0 : -3; s += Math.min(w, 4000) / 2000; }   // 롱폼(16:9)에 맞는 가로, 충분한 크기
      else { const r = h / w; s += r >= 1.25 && r <= 2.1 ? 3 : r >= 1 ? 1 : -2; s += Math.min(h, 4000) / 2000; }                                             // 쇼츠(9:16)에 맞는 세로, 충분한 크기
    }
    const alt = (p.alt || "").toLowerCase();
    const words = (it.keyword || "").toLowerCase().split(/[^a-z0-9]+/).filter((x) => x.length > 2);
    s += words.filter((x) => alt.includes(x)).length * 0.8;                     // 설명이 검색어와 맞을수록
    if (cur.subject !== "people" && PEOPLE.test(alt) && !PEOPLE.test(it.keyword || "")) s -= 4;     // 사람이 주인공인 주제가 아니면 사람이 주인공인 사진은 피한다
    if (used.some((u) => u.photographer && u.photographer === p.photographer)) s -= 2;   // 같은 작가 반복은 피한다
    return s;
  }
  function pickBest(it) {
    const used = usedByOthers(it);
    const pool = (it.cands || []).map((p, rank) => ({ p, rank })).filter(({ p }) => !used.some((u) => samePhoto(u, p)));
    if (!pool.length) return null;
    pool.sort((a, b) => scorePhoto(b.p, b.rank, it, used) - scorePhoto(a.p, a.rank, it, used));
    return pool[0].p;
  }
  async function autoPick() {
    const todo = cur.items.filter((it) => !it.photo && it.keyword);
    let done = 0, k = 0;
    for (const it of todo) {
      k++;
      $("planMsg").textContent = `사진 고르는 중… (${k}/${todo.length})`;
      try {
        if (!it.cands || !it.cands.length) await fetchCands(it, 1);
        const p = pickBest(it);
        if (p) { it.photo = p; done++; }
      } catch (err) { /* 이 항목만 사진 없음 — 나중에 "다른 사진"으로 다시 */ }
      renderItems();
    }
    return { done, total: todo.length };
  }

  // ───────── AI 호출 ─────────
  function setBusy(v) {
    busy = v;
    renderItems();   // 항목 버튼·피드백·생성 버튼의 막힘 상태를 다시 그린다
  }
  async function callAI(body) {
    const res = await fetch("/api/gemini-pexels", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ topic: cur.topic, note: cur.note, title: cur.title, format: cur.format, subject: cur.subject, ...body }) });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error((data.quotaExceeded ? "AI 하루 한도를 다 썼어요. " : "") + (data.error || "AI 기획 실패"));
    return data;
  }

  // ───────── 주제 겹침 막기 ─────────
  // 지금까지 만든 슬라이드쇼의 주제·제목(최근 50개)을 AI에 넘겨 다른 주제를 고르게 하고,
  // 돌아온 주제가 그래도 비슷하면(글자 비교, AI 호출 없음) 화면에 알려만 준다. 다시 부르지 않는다 (제미나이 하루 한도가 작다 — 기획 1번 = 호출 1번).
  async function loadPastTopics() {
    try {
      const cats = PEXELS_CATEGORIES.map((c) => encodeURIComponent(c)).join(",");
      const res = await fetch(`${SUPABASE_URL}/rest/v1/youtube_scripts?select=id,hook,video_settings&category=in.(${cats})&order=created_at.desc&limit=50`, { headers });
      if (!res.ok) return [];
      const out = [];
      for (const r of await res.json()) {
        if (cur && cur.id && String(r.id) === String(cur.id)) continue;
        const vs = r.video_settings || {};
        const topic = String(vs.pexels_topic || "").trim(), title = String(vs.title_text || vs.name || r.hook || "").trim();
        const line = topic && title && topic !== title ? `${topic} / ${title}` : topic || title;
        if (line && line !== "(제목 없음)") out.push({ line: line.slice(0, 80), keys: [topic, title].filter(Boolean) });
      }
      return out;
    } catch { return []; }
  }
  // 흔한 꾸밈말은 빼고 비교한다 ("세상에서 가장 독특한 피부" ↔ "세상에서 가장 독특한 장소"는 다른 주제, "이색적인 장소" ↔ "독특한 장소"는 같은 주제)
  const TOPIC_FILLER = /세상에서|세계에서|전세계|전 세계|지구에서|가장|제일|정말|진짜|놀라운|신기한|독특한|특이한|이색적인|아름다운|멋진|특별한|희귀한|기묘한|top\s*\d*|best|\d+\s*(곳|개|가지|선)|모음|베스트/gi;
  const TOPIC_PARTICLE = /(의|에서|에|은|는|이|가|을|를|과|와|곳)(?=\s|$)/g;   // 낱말 끝의 조사만 뺀다 ("이집트"의 "이"는 그대로)
  function normTopic(s) {
    const raw = String(s || "").toLowerCase().replace(/[^\p{L}\p{N}]+/gu, "");
    const core = String(s || "").toLowerCase().replace(TOPIC_FILLER, " ").replace(/[^\p{L}\p{N}\s]+/gu, " ").replace(TOPIC_PARTICLE, "").replace(/\s+/g, "");
    return core.length >= 2 ? core : raw;
  }
  function topicSimilarity(a, b) {
    const x = normTopic(a), y = normTopic(b);
    if (!x || !y) return 0;
    if (x === y || (Math.min(x.length, y.length) >= 3 && (x.includes(y) || y.includes(x)))) return 1;
    const grams = (s) => { const m = new Map(); for (let i = 0; i < s.length - 1; i++) { const g = s.slice(i, i + 2); m.set(g, (m.get(g) || 0) + 1); } return m; };
    const gx = grams(x), gy = grams(y);
    let both = 0, nx = 0, ny = 0;
    gx.forEach((v, g) => { nx += v; both += Math.min(v, gy.get(g) || 0); });
    gy.forEach((v) => { ny += v; });
    return nx + ny ? (2 * both) / (nx + ny) : 0;   // 두 글자씩 겹치는 비율 (Dice)
  }
  const SIMILAR = 0.6;
  function mostSimilar(topic, past) {
    let best = { score: 0, line: "" };
    for (const p of past) for (const k of p.keys) { const sc = topicSimilarity(topic, k); if (sc > best.score) best = { score: sc, line: p.line }; }
    return best;
  }

  async function runPlan() {
    if (busy) return;
    cur.items = []; cur.topic = ""; cur.subject = ""; cur.similarTo = ""; setBusy(true); renderTopicLine();
    $("planMsg").textContent = "AI가 주제와 사진 수를 정해 기획하는 중… (10~20초)";
    $("planBtn").style.display = "none";
    try {
      const past = await loadPastTopics();
      const pastLines = past.map((p) => p.line);
      const data = await callAI({ mode: "plan", secs: cur.secs, past: pastLines });   // 기획 1번 = 제미나이 1번 (지난 주제도 같은 호출에 넣는다)
      const dup = mostSimilar(data.topic, past);   // 그래도 비슷하면 알려만 준다 (자동으로 다시 부르지 않음 — 원하면 전체 피드백으로)
      cur.similarTo = dup.score >= SIMILAR ? dup.line : "";
      cur.topic = data.topic || data.title || ""; cur.subject = data.subject || "";
      cur.title = data.title || cur.topic; $("curTitle").value = cur.title;
      cur.items = data.items.map(newItem);
      renderTopicLine(); renderItems();
      dirty = true; await saveNow();   // 기획을 바로 저장 — 사진을 고르는 중에 화면을 나가도 기획은 남는다
      const r = await autoPick();
      $("planMsg").textContent = `AI 기획 완료 — 주제 "${cur.topic}", 사진 ${r.done}/${cur.items.length}장 자동 선택. 글을 고치고, 사진·항목이 별로면 "다른 사진"·"이 항목 다시"·전체 피드백으로 바꾼 뒤 영상을 만드세요.`;
      queueSave();
    } catch (err) { $("planMsg").textContent = "실패: " + err.message; }
    finally { setBusy(false); renderTopicLine(); $("fbCount").value = cur.items.length || 10; }
  }
  $("planBtn").addEventListener("click", () => runPlan());

  // 한 항목만 다시 (제미나이 1번 + Pexels 1번)
  async function replaceItem(it, feedback) {
    if (busy) return;
    setBusy(true);
    $("planMsg").textContent = `${cur.items.indexOf(it) + 1}번 항목을 다시 기획하는 중…`;
    try {
      const data = await callAI({ mode: "replace", feedback, others: cur.items.filter((o) => o !== it).map((o) => o.name), target: { name: it.name, keyword: it.keyword, desc: it.comment } });
      const fresh = newItem(data.item);
      const i = cur.items.indexOf(it);
      if (i < 0) return;
      cur.items[i] = fresh;
      renderItems(); queueSave();
      await autoPick();
      $("planMsg").textContent = `${i + 1}번 항목을 "${fresh.name}"(으)로 바꿨어요.`;
      queueSave();
    } catch (err) { $("planMsg").textContent = "실패: " + err.message; }
    finally { setBusy(false); }
  }

  // 전체 피드백: 잠근 항목은 자리 그대로 두고 나머지 자리만 새로 채운다 (제미나이 1번)
  $("reviseBtn").addEventListener("click", async () => {
    if (busy) return;
    const feedback = $("fbText").value.trim();
    const locked = cur.items.filter((it) => it.locked);
    const total = Math.max(locked.length, Math.min(MAX_ITEMS, Math.max(3, Number($("fbCount").value) || cur.items.length)));
    const need = total - locked.length;
    if (need < 1) { $("planMsg").textContent = "모든 항목이 🔒 유지라 바꿀 항목이 없어요. 사진 수를 늘리거나 잠금을 푸세요."; return; }
    if (!feedback && !confirm("피드백 없이 다시 기획할까요? (🔒 항목은 그대로)")) return;
    const unlocked = cur.items.filter((it) => !it.locked);
    setBusy(true);
    $("planMsg").textContent = "피드백을 반영해 다시 기획하는 중… (10~20초)";
    try {
      const data = await callAI({
        mode: "revise", feedback, count: need,
        keep: locked.map((it) => ({ name: it.name, keyword: it.keyword })),
        previous: unlocked.map((it) => ({ name: it.name, keyword: it.keyword, desc: it.comment })),
      });
      // 같은 이름이 다시 나오면 고친 글·사진을 그대로 쓴다
      const fresh = data.items.slice(0, need).map((n) => unlocked.find((o) => o.name.trim() && o.name.trim() === n.name.trim()) || newItem(n));
      const slots = new Array(total).fill(null);
      const late = [];
      cur.items.forEach((it, i) => { if (it.locked) { if (i < total) slots[i] = it; else late.push(it); } });
      for (let i = total - 1; i >= 0 && late.length; i--) if (!slots[i]) slots[i] = late.pop();
      let k = 0;
      for (let i = 0; i < total; i++) if (!slots[i]) slots[i] = fresh[k++] || null;
      cur.items = slots.filter(Boolean);
      if (data.title) { cur.title = data.title; $("curTitle").value = cur.title; }
      if (data.subject) { cur.subject = data.subject; renderTopicLine(); }   // 피드백으로 사진 주인공이 바뀔 수 있다 (예: "사람 위주로")
      renderItems(); dirty = true; await saveNow();
      const r = await autoPick();
      $("planMsg").textContent = `다시 기획했어요 — 🔒 ${locked.length}개 유지, 새 항목 ${fresh.length}개 (사진 ${r.done}장 새로 고름).`;
      $("fbText").value = "";
      queueSave();
    } catch (err) { $("planMsg").textContent = "실패: " + err.message; }
    finally { setBusy(false); $("fbCount").value = cur.items.length; }
  });

  // ───────── 다른 사진 (이미 찾은 후보에서 고르기, 입력 없음) ─────────
  let pickItem = null;
  function renderPicker() {
    const it = pickItem, used = usedByOthers(it);
    $("pickGrid").innerHTML = (it.cands || []).map((p, k) => {
      const u = used.some((x) => samePhoto(x, p));
      return `<div data-k="${k}" class="${samePhoto(it.photo, p) ? "sel" : ""}${u ? " used" : ""}" style="background-image:url('${esc(p.thumb)}')"><small>${u ? "다른 항목에서 사용" : esc(p.photographer)}</small></div>`;
    }).join("");
    $("pickMore").style.display = it.candMore ? "" : "none";
  }
  async function openPicker(it) {
    if (!it.keyword) return;
    pickItem = it;
    $("pickTitle").textContent = `${cur.items.indexOf(it) + 1}번 다른 사진 — ${it.name || ""}`;
    $("pickGrid").innerHTML = ""; $("pickInfo").textContent = "";
    $("pickModal").classList.add("open");
    if (!it.cands || !it.cands.length) {   // 다시 연 슬라이드쇼는 후보가 메모리에 없어서 같은 검색어로 한 번 불러온다
      $("pickInfo").textContent = "후보 불러오는 중…";
      try { await fetchCands(it, 1); $("pickInfo").textContent = ""; } catch (err) { $("pickInfo").textContent = "실패: " + err.message; }
    }
    if (pickItem === it) renderPicker();
  }
  $("pickMore").addEventListener("click", async () => {
    const it = pickItem; if (!it) return;
    $("pickInfo").textContent = "더 불러오는 중…";
    try { await fetchCands(it, (it.candPage || 1) + 1); $("pickInfo").textContent = ""; } catch (err) { $("pickInfo").textContent = "실패: " + err.message; }
    if (pickItem === it) renderPicker();
  });
  const closePicker = () => { $("pickModal").classList.remove("open"); pickItem = null; };
  $("pickClose").addEventListener("click", closePicker);
  $("pickGrid").addEventListener("click", (e) => {
    const d = e.target.closest("[data-k]");
    if (!d || !pickItem || d.classList.contains("used")) return;
    pickItem.photo = pickItem.cands[Number(d.dataset.k)];
    closePicker();
    renderItems(); queueSave();
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closePicker(); });

  // ───────── 버튼 상태 ─────────
  function applyState() {
    $("fbCard").style.display = cur.items.length ? "block" : "none";
    $("reviseBtn").disabled = busy;
    $("planBtn").style.display = !cur.items.length && !busy ? "block" : "none";
    $("planBtn").disabled = busy;
    updateGenBtn();
  }
  let genRunning = false, genVersion = null;
  function updateGenBtn() {
    const btn = $("genBtn");
    if (genRunning) { btn.disabled = true; btn.textContent = "영상 생성 중... (몇 분 걸려요)"; return; }
    btn.disabled = busy;   // AI 기획·사진 고르기 중에만 잠깐 막는다
    btn.textContent = `영상 생성${genVersion ? ` (v${genVersion})` : ""}`;
  }

  // ───────── 영상 생성 ─────────
  async function refreshGenState() {
    const info = await genFetchInfo(cur.id);
    if (!info || !cur) return;
    const note = $("genNote");
    genRunning = info.status === "running";
    if (genRunning) watchGeneration(cur.id);
    else genVersion = await genNextVersion(cur.id);
    updateGenBtn();
    if (info.status === "error") {
      note.innerHTML = `${esc(genErrorText(info.lastError, (curRow && curRow.video_settings && curRow.video_settings.name) || info.name))}${info.lastError && info.lastError.url ? ` · <a href="${esc(info.lastError.url)}" target="_blank" rel="noopener" style="color:var(--accent);">실행 기록 보기</a>` : ""}<br>버튼을 다시 누르면 재시도합니다.`;
      note.style.display = "block";
    } else note.style.display = "none";
  }
  function watchGeneration(id) {
    if (genWatch.has(String(id))) return;
    const timer = setInterval(async () => {
      const info = await genFetchInfo(id);
      if (!info || info.status === "running") return;
      clearInterval(timer); genWatch.delete(String(id));
      genNotify((curRow && curRow.video_settings && curRow.video_settings.name) || "Pexels 슬라이드쇼", info.status === "done");
      if (cur && cur.id === id) refreshGenState();
    }, 8000);
    genWatch.set(String(id), timer);
  }
  $("genBtn").addEventListener("click", async () => {
    const btn = $("genBtn");
    if (busy || genRunning) return;
    if (!cur.title.trim()) { showMsg("제목을 입력하세요 (영상 첫 화면에 들어갑니다).", false); return; }
    const withPhoto = cur.items.filter((it) => it.photo);
    if (!withPhoto.length) { showMsg("사진이 있는 항목이 없어요.", false); return; }
    if (withPhoto.some((it) => !it.name.trim())) { showMsg("이름이 빈 항목이 있어요. 채운 뒤 만드세요.", false); return; }
    const missing = cur.items.length - withPhoto.length;
    btn.disabled = true;
    try {
      await flushSave();
      const [rr, sr] = await Promise.all([
        fetch(`${SUPABASE_URL}/rest/v1/youtube_scripts?select=*&id=eq.${cur.id}`, { headers }),
        fetch(`${SUPABASE_URL}/rest/v1/youtube_segments?select=*&script_id=eq.${cur.id}&order=order_no.asc`, { headers }),
      ]);
      const row = (await rr.json())[0];
      const segs = (await sr.json()).filter((s) => (s.asset_paths || []).length);
      const version = await genNextVersion(cur.id);
      if (!confirm(`v${version} 영상 생성을 시작할까요?${missing ? ` (사진이 없는 항목 ${missing}개는 빠집니다)` : ""} 몇 분 걸리고, 완성되면 알려드립니다. 영상은 Studio에서 확인하세요.`)) { updateGenBtn(); return; }
      genRequestPermission();
      await genStart(row, segs, version);
      genRunning = true; updateGenBtn();
      watchGeneration(cur.id);
      showMsg("영상 생성을 시작했습니다. 완성되면 알림이 뜹니다.", true);
    } catch (err) { updateGenBtn(); showMsg("영상 생성 실패: " + err.message, false); }
  });

  // ───────── 시작: 형식·요청(pexels.html)으로 새 기획, 또는 ?id=로 이어서 고치기(Scenes 목록에서). 그 밖에는 Pexels 화면으로 ─────────
  function startFromTopic() {
    let t = null;
    try { t = JSON.parse(sessionStorage.getItem("pexelsTopic") || "null"); sessionStorage.removeItem("pexelsTopic"); } catch { /* 없음 */ }
    if (!t || typeof t !== "object") return false;
    newSlideshow(t.format, String(t.note || "").trim());
    showEdit();
    runPlan();
    return true;
  }
  (async () => {
    if (startFromTopic()) return;
    const id = Number(new URLSearchParams(location.search).get("id"));
    if (id && await openSlideshow(id).catch(() => false)) { $("backLink").href = "/youtube/storyboard.html"; $("backLink").textContent = "← Scenes"; return; }
    location.replace("/youtube/pexels.html");
  })();
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js");
</script>
</body>
</html>
