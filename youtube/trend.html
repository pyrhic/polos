<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trend — Wicked Wiki</title>
<link rel="stylesheet" href="/youtube/style.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0f0a14">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  .t-item { display:block; }
  .t-top { display:flex; align-items:center; gap:10px; }
  .t-rank { background:#0f0a14; color:#7cff4a; font-weight:800; font-size:0.85rem; width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .t-title { font-weight:800; font-size:1.05rem; flex:1; color:#fff; text-decoration:none; word-break:keep-all; }
  .t-meta { color:#a89bb5; font-size:0.78rem; margin:6px 0 0 38px; }
  .t-meta b { color:#ffd93d; }
  .t-news { margin:8px 0 0 38px; padding:0; list-style:none; }
  .t-news li { font-size:0.8rem; margin-bottom:4px; line-height:1.35; }
  .t-news a { color:#cfc6d8; text-decoration:none; }
  .t-news a:hover { color:#7cff4a; }
  .t-news .src { color:#a89bb5; }
  .t-make { margin:10px 0 0 38px; width:auto; padding:7px 14px; font-size:0.8rem; background:#221a2e; border:1px solid #3a2f14; }
  .t-first { border:2px solid #7cff4a; }
  .t-first .t-title { font-size:1.25rem; color:#7cff4a; }
  .t-head { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:6px; }
  .t-head button { width:auto; padding:6px 14px; font-size:0.8rem; }
  .t-tabs { display:flex; gap:8px; align-items:center; margin-bottom:14px; }
  .t-tab { width:auto; padding:8px 20px; font-size:0.9rem; }
  .t-tab.active { background:#7cff4a; color:#0f0a14; }
  .t-tabs select { width:auto; padding:8px 12px; font-size:0.9rem; }
  .t-tr { color:#a89bb5; font-size:0.72rem; margin-left:8px; text-decoration:none; font-weight:400; white-space:nowrap; }
  .t-tr:hover { color:#7cff4a; }
</style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="/youtube/index.html">← Wicked Wiki</a>
    <div class="t-head">
      <h1 style="font-size:1.4rem;margin:0;">Trend</h1>
      <button type="button" id="refreshBtn">새로고침</button>
    </div>
    <p class="role" style="text-align:left;margin-bottom:1rem;">구글 트렌드의 지금 급상승 검색어를 검색량 높은 구간 순으로 보여줍니다. 제목을 누르면 구글 검색으로 이동합니다.</p>
    <div class="t-tabs">
      <button type="button" class="t-tab active" data-scope="domestic">국내</button>
      <button type="button" class="t-tab" data-scope="overseas">해외</button>
      <select id="countrySel" style="display:none;">
        <option value="US">미국</option>
        <option value="JP">일본</option>
        <option value="GB">영국</option>
        <option value="DE">독일</option>
        <option value="FR">프랑스</option>
        <option value="IN">인도</option>
        <option value="BR">브라질</option>
        <option value="AU">호주</option>
        <option value="CA">캐나다</option>
        <option value="TW">대만</option>
      </select>
    </div>
    <div class="msg" id="msg"></div>
    <div id="meta" style="color:#a89bb5;font-size:0.78rem;margin-bottom:10px;"></div>
    <div id="list"><div class="empty">불러오는 중...</div></div>
  </div>

<script>
  function escapeHtml(s) {
    return String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  }
  function safeUrl(u) {
    return /^https?:\/\//.test(u) ? u : "#";
  }
  function timeAgo(dateStr) {
    const t = Date.parse(dateStr);
    if (!t) return "";
    const min = Math.max(0, Math.round((Date.now() - t) / 60000));
    if (min < 60) return `${min}분 전부터`;
    if (min < 60 * 24) return `${Math.floor(min / 60)}시간 전부터`;
    return `${Math.floor(min / 1440)}일 전부터`;
  }

  let scope = "domestic";

  function currentGeo() {
    return scope === "domestic" ? "KR" : document.getElementById("countrySel").value;
  }

  function regionName() {
    return scope === "domestic" ? "대한민국" : document.getElementById("countrySel").selectedOptions[0].textContent;
  }

  let loadSeq = 0;

  async function load() {
    const list = document.getElementById("list");
    const btn = document.getElementById("refreshBtn");
    const mySeq = ++loadSeq;
    btn.disabled = true;
    list.innerHTML = '<div class="empty">불러오는 중...</div>';
    try {
      const res = await fetch(`/api/trends?geo=${currentGeo()}`);
      const data = await res.json();
      if (mySeq !== loadSeq) return; // 그 사이 다른 지역으로 바꿨으면 이 응답은 버린다
      if (!res.ok) throw new Error(data.error || "불러오기 실패");
      document.getElementById("msg").className = "msg";
      document.getElementById("meta").textContent =
        `${regionName()} · ${data.items.length}개 · ${new Date(data.fetchedAt).toLocaleTimeString("ko-KR")} 기준`;

      if (!data.items.length) {
        list.innerHTML = '<div class="empty">지금 표시할 검색어가 없습니다.</div>';
        return;
      }
      list.innerHTML = data.items.map((it, idx) => `
        <div class="card-box t-item ${it.rank === 1 ? "t-first" : ""}">
          <div class="t-top">
            <div class="t-rank">${it.rank}</div>
            <a class="t-title" href="https://www.google.com/search?q=${encodeURIComponent(it.title)}" target="_blank" rel="noopener">${escapeHtml(it.title)}</a>
            ${scope === "overseas"
              ? `<a class="t-tr" href="https://translate.google.com/?sl=auto&tl=ko&op=translate&text=${encodeURIComponent(it.title)}" target="_blank" rel="noopener">번역</a>`
              : ""}
          </div>
          <div class="t-meta"><b>${escapeHtml(it.traffic || "-")}</b> 검색 · ${escapeHtml(timeAgo(it.pubDate))}</div>
          ${it.news.length ? `<ul class="t-news">${it.news.map((n) => `
            <li><a href="${escapeHtml(safeUrl(n.url))}" target="_blank" rel="noopener">${escapeHtml(n.title)}</a>
              <span class="src">— ${escapeHtml(n.source)}</span></li>`).join("")}</ul>` : ""}
          <button type="button" class="t-make" data-i="${idx}">이 주제로 대본·콘티 만들기</button>
        </div>
      `).join("");

      list.querySelectorAll(".t-make").forEach((btn) =>
        btn.addEventListener("click", () => {
          const it = data.items[Number(btn.dataset.i)];
          try {
            sessionStorage.setItem("trendDraft", JSON.stringify({ topic: it.title, geo: currentGeo(), articles: it.news }));
          } catch {}
          location.href = "/youtube/storyboard.html?new=1";
        })
      );
    } catch (err) {
      const msg = document.getElementById("msg");
      msg.className = "msg err";
      msg.textContent = "트렌드를 불러오지 못했습니다: " + err.message;
      list.innerHTML = "";
    } finally {
      btn.disabled = false;
    }
  }

  document.getElementById("refreshBtn").addEventListener("click", load);
  document.getElementById("countrySel").addEventListener("change", load);
  document.querySelectorAll(".t-tab").forEach((tab) =>
    tab.addEventListener("click", () => {
      scope = tab.dataset.scope;
      document.querySelectorAll(".t-tab").forEach((t) => t.classList.toggle("active", t === tab));
      document.getElementById("countrySel").style.display = scope === "overseas" ? "" : "none";
      load();
    })
  );
  load();

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/sw.js");
  }
</script>
<script src="/hub-nav.js"></script>
</body>
</html>
