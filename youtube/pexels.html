<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pexels — wizard-yt</title>
<link rel="stylesheet" href="/youtube/style.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  .px-note { color:var(--muted); font-size:0.78rem; line-height:1.5; margin:6px 0 12px; }
  .px-note a { color:var(--accent); }
  .px-card { background:var(--card); border-radius:3px; padding:14px; margin-bottom:14px; }
  .px-fmt { display:flex; gap:8px; }
  .px-fmt button { flex:1; margin:0; padding:12px 8px; background:var(--btn); color:var(--text); box-shadow:inset 0 0 0 1px var(--btn-ring); text-transform:none; letter-spacing:0; line-height:1.35; }
  .px-fmt button small { display:block; font-size:0.7rem; font-weight:400; color:var(--muted); margin-top:2px; }
  .px-fmt button.on { background:var(--accent-dim); color:var(--accent); box-shadow:inset 0 0 0 2px var(--accent); }
  .px-fmt button.on small { color:var(--accent); }
  #startBtn { background:var(--btn); color:var(--text); box-shadow:inset 0 0 0 1px var(--text); margin-top:12px; }
  #startBtn:hover { background:var(--hover); color:var(--on-accent); }
</style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="/youtube/search.html">← Search</a>
    <h1 style="font-size:1.4rem;margin-bottom:0.6rem;">Pexels</h1>
    <p class="px-note"><b>AI가 주제와 사진 수까지 정해서 기획</b>해요 — 제목, 항목(이름·설명 자막), 사진 고르기까지. 전에 만든 주제와 겹치지 않게 골라요. 나는 고칠 곳만 첨삭·피드백하고 바로 영상으로 만들어요.</p>

    <div class="px-card">
      <label style="margin-top:0;">형식</label>
      <div class="px-fmt" id="fmt" role="radiogroup" aria-label="형식">
        <button type="button" data-f="short" role="radio">숏폼<small>세로 9:16 · 1~2분</small></button>
        <button type="button" data-f="long" role="radio">롱폼<small>가로 16:9 · 길이 제한 없음</small></button>
      </div>
      <label for="note">요청 (선택)</label>
      <input type="text" id="note" maxlength="300" placeholder="예: 동물 위주로">
      <button type="button" id="startBtn">AI 기획 시작</button>
      <div class="msg" id="msg"></div>
    </div>

    <p class="px-note">만든 슬라이드쇼는 <a href="/youtube/storyboard.html">Scenes</a> 목록에 "슬라이드쇼" 표시로 함께 있어요.</p>
  </div>

<script src="/config.js"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  let format = "short";
  try { if (localStorage.getItem("pexelsFormat") === "long") format = "long"; } catch { /* 기본 숏폼 */ }
  function renderFmt() {
    document.querySelectorAll("#fmt button").forEach((b) => { const on = b.dataset.f === format; b.classList.toggle("on", on); b.setAttribute("aria-checked", on ? "true" : "false"); });
  }
  $("fmt").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-f]"); if (!b) return;
    format = b.dataset.f; renderFmt();
    try { localStorage.setItem("pexelsFormat", format); } catch { /* 기억 못 해도 괜찮다 */ }
  });
  renderFmt();

  // 형식·요청을 편집 화면으로 넘긴다. 편집 화면이 바로 AI 기획(주제·사진 수까지 AI가 정함)을 시작하고, 결과가 오면 저장한다
  function start() {
    try { sessionStorage.setItem("pexelsTopic", JSON.stringify({ format, note: $("note").value.trim() })); }
    catch { $("msg").className = "msg err"; $("msg").textContent = "넘기지 못했어요. 다시 시도해주세요."; return; }
    location.href = "/youtube/pexels-edit.html";
  }
  $("startBtn").addEventListener("click", start);
  $("note").addEventListener("keydown", (e) => { if (e.key === "Enter") start(); });
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js");
})();
</script>
</body>
</html>
