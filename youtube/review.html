<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영상 점검 — Wicked Wiki</title>
<link rel="stylesheet" href="/youtube/style.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0f0a14">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  video { width: 100%; border-radius: 3px; margin-top: 10px; background:#000; }
  .status-tag { display:inline-block; padding:2px 8px; border-radius:10px; font-size:0.7rem; font-weight:800; text-transform:uppercase; }
  .status-idle { background:#3a2f14; color:#ffd93d; }
  .status-running { background:#16324a; color:#4fc3f7; }
  .status-done { background:#17331a; color:#7cff4a; }
  .status-error { background:#3a1414; color:#ff8a80; }
</style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="/youtube/index.html">← Wicked Wiki</a>
    <h1 style="font-size:1.4rem;margin-bottom:1.2rem;">영상 점검</h1>
    <p class="role">승인된 대본을 골라 생성을 시작하세요. 업로드해둔 소재가 있으면 그걸 쓰고, 없으면 Pexels 무료 영상으로 자동 채워집니다.</p>
    <div id="list"><div class="empty">불러오는 중...</div></div>
  </div>

<script src="/youtube/upload.js"></script>
<script>
  const SUPABASE_URL = "https://oenqrlgmnkpzxsavnfyo.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_sZ4wQgaC5f-i40pVzf0vIA_R7iJWDf5";
  const headers = { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` };

  function escapeHtml(s) {
    return String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  }

  // 콘티 이름 (전체 설정에서 정한 이름, 없으면 후킹 앞부분)
  function videoName(r) {
    return (r.video_settings && r.video_settings.name) || (r.hook || "").slice(0, 20);
  }
  function downloadUrl(url, name, version) {
    return `${url}?download=${encodeURIComponent(`${name} v${version}.mp4`)}`;
  }

  function assetPublicUrl(path) {
    if (/^https?:\/\//.test(path)) return path;
    return `${SUPABASE_URL}/storage/v1/object/public/youtube-assets/${path}`;
  }

  // 콘티에서 대사를 고쳤을 수 있으므로, 콘티(장면)의 대사를 이어붙인 것이 실제 음성/자막의 원본이 된다.
  // 콘티 대사에서 **글자**로 표시한 부분은 강조 자막(emphasize_terms)이 된다.
  function toMarkdown(r, segments) {
    const baseTerms = (r.emphasize_terms || "").split(",").map((s) => s.trim()).filter(Boolean);
    const markedTerms = [];
    const lines = (segments || [])
      .map((s) => (s.script_text || "").trim())
      .filter(Boolean)
      .map((t) => t.replace(/\*\*(.+?)\*\*/g, (_, term) => { markedTerms.push(term.trim()); return term; }));
    const terms = [...new Set([...baseTerms, ...markedTerms])];

    const body = lines.length
      ? `## 스토리\n${lines.join("\n")}`
      : `## 후킹 (0~2초)\n${r.hook}\n\n## 스토리 (2~40초)\n${r.story}\n\n## 클로징 (짧게, 2~5초)\n${r.closing || ""}`;

    return `---
category: "${r.category}"
format: shorts
fact_sources:
${(r.fact_sources || "").split("\n").filter(Boolean).map((s) => `  - "${s.trim()}"`).join("\n")}
is_conspiracy_or_unverified: ${r.is_conspiracy_or_unverified}
emphasize_terms: [${terms.map((s) => `"${s.replace(/"/g, "")}"`).join(", ")}]
keep_together_terms: [${(r.keep_together_terms || "").split(",").filter(Boolean).map((s) => `"${s.trim()}"`).join(", ")}]
status: approved
revision_log:
  - "폰 앱에서 생성"
---

# 대본

${body}
`;
  }

  async function loadSegmentCounts(scriptIds) {
    if (!scriptIds.length) return {};
    const res = await fetch(`${SUPABASE_URL}/rest/v1/youtube_segments?select=script_id&script_id=in.(${scriptIds.join(",")})`, { headers });
    const rows = await res.json();
    if (!res.ok) throw new Error(rows.message || "콘티 개수를 불러올 수 없습니다");
    const counts = {};
    rows.forEach((r) => { counts[r.script_id] = (counts[r.script_id] || 0) + 1; });
    return counts;
  }

  async function loadOutputsByScript(scriptIds) {
    if (!scriptIds.length) return {};
    const res = await fetch(`${SUPABASE_URL}/rest/v1/youtube_outputs?select=*&script_id=in.(${scriptIds.join(",")})&order=version.desc`, { headers });
    const rows = await res.json();
    if (!res.ok) throw new Error(rows.message || "생성된 영상 목록을 불러올 수 없습니다 (youtube_outputs 테이블이 없을 수 있음)");
    const byScript = {};
    rows.forEach((r) => { (byScript[r.script_id] ||= []).push(r); });
    return byScript;
  }

  // 콘티 페이지와 같은 기준(초당 4.3자) — 노출 시간을 직접 안 정했으면 대사 길이로 추정.
  const CHARS_PER_SEC = 4.3;
  function estimateSeconds(text) {
    const len = (text || "").replace(/\*\*/g, "").replace(/\s+/g, "").length;
    return Math.max(1, len / CHARS_PER_SEC);
  }

  async function loadSegments(scriptId) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/youtube_segments?select=section,script_text,keyword,direction,target_seconds,asset_paths&script_id=eq.${scriptId}&order=order_no.asc`, { headers });
    const rows = await res.json();
    return rows.map((s) => ({
      section: s.section,
      script_text: s.script_text,
      keyword: s.keyword,
      direction: s.direction,
      weight_seconds: s.target_seconds > 0 ? Number(s.target_seconds) : estimateSeconds(s.script_text),
      asset_urls: (s.asset_paths || []).map(assetPublicUrl),
    }));
  }

  async function load() {
    const list = document.getElementById("list");
    try {
      await loadInner(list);
    } catch (err) {
      list.innerHTML = '<div class="empty">불러오기 실패: ' + err.message + "</div>";
    }
  }

  async function loadInner(list) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/youtube_scripts?select=*&status=eq.approved&order=created_at.desc`, { headers });
    const rows = await res.json();
    if (!res.ok) throw new Error(rows.message || "대본을 불러올 수 없습니다");
    if (!rows.length) {
      list.innerHTML = '<div class="empty">승인된 대본이 없습니다. 대본 페이지에서 먼저 승인하세요.</div>';
      return;
    }
    const segCounts = await loadSegmentCounts(rows.map((r) => r.id));
    const outputsByScript = await loadOutputsByScript(rows.map((r) => r.id));

    list.innerHTML = rows.map((r) => {
      const hasSegments = (segCounts[r.id] || 0) > 0;
      const outputs = outputsByScript[r.id] || [];
      return `
      <div class="card-box" data-id="${r.id}">
        <div class="s-meta" style="margin-bottom:6px;">
          <span class="status-tag status-${r.generation_status || "idle"}">${r.generation_status || "idle"}</span>
          · ${escapeHtml(r.category || "")}
        </div>
        <div class="title" style="font-weight:700;margin-bottom:8px;">${escapeHtml(r.hook)}</div>
        ${hasSegments
          ? `<button type="button" class="gen-btn" data-id="${r.id}" ${r.generation_status === "running" ? "disabled" : ""}>
              ${r.generation_status === "running" ? "생성 중..." : outputs.length ? "새 버전(v" + (outputs[0].version + 1) + ") 생성" : "생성 시작"}
            </button>`
          : `<div class="msg err" style="display:block;">콘티가 없습니다 — <a class="accent" href="/youtube/storyboard.html">콘티 페이지</a>에서 먼저 만들어주세요.</div>`}
        <div class="video-wrap" id="video-${r.id}">
          ${outputs.map((o) => `
            <div style="margin-top:12px;">
              <div class="s-meta" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
                <span>${escapeHtml(videoName(r))} v${o.version}</span>
                <button type="button" class="out-del-btn" data-id="${o.id}" data-path="${escapeHtml(o.storage_path)}" data-version="${o.version}" style="width:auto;padding:3px 10px;font-size:0.7rem;background:#3a1414;color:#ff8a80;">삭제</button>
              </div>
              <video controls preload="none" src="${o.video_url}"></video>
              <a class="link-btn" style="margin-top:8px;" href="${downloadUrl(o.video_url, videoName(r), o.version)}" download>다운로드</a>
              ${uploadBlockHtml(o, r)}
            </div>
          `).join("")}
        </div>
      </div>
    `;
    }).join("");

    document.querySelectorAll(".gen-btn").forEach((btn) => {
      const row = rows.find((r) => String(r.id) === btn.dataset.id);
      const nextVersion = (outputsByScript[row.id]?.[0]?.version || 0) + 1;
      btn.addEventListener("click", () => startGeneration(btn.dataset.id, row, nextVersion));
    });

    document.querySelectorAll(".out-del-btn").forEach((btn) =>
      btn.addEventListener("click", () => deleteOutput(btn.dataset.id, btn.dataset.path, btn.dataset.version))
    );

    bindUploadBlocks(load);

    if (rows.some((r) => r.generation_status === "running") || ytAnyUploading(outputsByScript)) {
      ytSchedulePoll(load);
    }
  }

  async function deleteOutput(id, path, version) {
    if (!confirm(`v${version} 영상을 삭제할까요? 되돌릴 수 없습니다.`)) return;
    try {
      const sres = await fetch(`${SUPABASE_URL}/storage/v1/object/youtube-outputs/${path}`, { method: "DELETE", headers });
      if (!sres.ok && sres.status !== 404) throw new Error(await sres.text());
      const rres = await fetch(`${SUPABASE_URL}/rest/v1/youtube_outputs?id=eq.${id}`, { method: "DELETE", headers });
      if (!rres.ok) throw new Error(await rres.text());
      load();
    } catch (err) {
      alert("삭제 실패: " + err.message);
    }
  }

  async function startGeneration(scriptId, row, version) {
    if (!confirm(`이 대본으로 v${version} 영상 생성을 시작할까요? 몇 분 정도 걸립니다. 기존 버전은 그대로 남습니다.`)) return;
    const segments = await loadSegments(scriptId);
    const scriptContent = toMarkdown(row, segments);
    const vs = row.video_settings || {};
    const settings = {
      caption_font_size: vs.caption_font_size,
      layout: vs.layout,
      title1: vs.title1,
      title2: vs.title2,
      source_text: vs.source_text,
      caption_weight: vs.caption_weight,
      caption_position_pct: vs.caption_position_pct,
      bgm_url: vs.bgm_path ? assetPublicUrl(vs.bgm_path) : null,
      bgm_volume: vs.bgm_volume,
      mood: vs.mood,
      transition: vs.transition,
      tts_voice: vs.tts_voice,
      tts_rate: vs.tts_rate,
      tts_pitch: vs.tts_pitch,
    };

    const res = await fetch("/api/trigger-generation", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ scriptId, scriptContent, segments, settings, channel: "wicked-wiki", version }),
    });
    const data = await res.json();
    if (!res.ok) {
      alert("실행 실패: " + (data.error || "알 수 없는 오류"));
      return;
    }
    load();
  }

  load();

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/sw.js");
  }
</script>
<script src="/hub-nav.js"></script>
</body>
</html>
