<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio — Wicked Wiki</title>
<link rel="stylesheet" href="/youtube/style.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0f0a14">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  video { width: 100%; border-radius: 3px; margin-top: 10px; background:#000; }
  .status-tag { display:inline-block; padding:2px 8px; border-radius:10px; font-size:0.7rem; font-weight:800; text-transform:uppercase; }
  .status-idle { background:#3a2f14; color:#ffd93d; }
  .status-running { background:#16324a; color:#4fc3f7; }
  .status-done { background:#17331a; color:#7cff4a; }
  .status-error { background:#3a1414; color:#ff8a80; }
  .studio-item { cursor:pointer; border:2px solid transparent; }
  .studio-item:hover, .studio-item:focus-visible { border-color:#7cff4a; outline:none; }
</style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="/youtube/index.html">← Wicked Wiki</a>
    <h1 style="font-size:1.4rem;margin-bottom:1.2rem;">Studio</h1>
        <div id="list"><div class="empty">불러오는 중...</div></div>
  </div>

<script src="/youtube/upload.js"></script>
<script src="/youtube/generate.js"></script>
<script>
  const SUPABASE_URL = "https://oenqrlgmnkpzxsavnfyo.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_sZ4wQgaC5f-i40pVzf0vIA_R7iJWDf5";
  const headers = { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` };

  function escapeHtml(s) {
    return String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  }

  // 콘티 이름 (전체 설정에서 정한 이름, 없으면 후킹 앞부분)
  function videoName(r) {
    return (r.video_settings && r.video_settings.name) || (r.hook || "").slice(0, 20);
  }
  function downloadUrl(url, name, version) {
    return `${url}?download=${encodeURIComponent(`${name} v${version}.mp4`)}`;
  }

  async function loadOutputsByScript(scriptIds) {
    if (!scriptIds.length) return {};
    const res = await fetch(`${SUPABASE_URL}/rest/v1/youtube_outputs?select=*&script_id=in.(${scriptIds.join(",")})&order=version.desc`, { headers });
    const rows = await res.json();
    if (!res.ok) throw new Error(rows.message || "생성된 영상 목록을 불러올 수 없습니다 (youtube_outputs 테이블이 없을 수 있음)");
    const byScript = {};
    rows.forEach((r) => { (byScript[r.script_id] ||= []).push(r); });
    return byScript;
  }

  async function load() {
    const list = document.getElementById("list");
    try {
      await loadInner(list);
    } catch (err) {
      list.innerHTML = '<div class="empty">불러오기 실패: ' + err.message + "</div>";
    }
  }

  // 목록(영상이 있는 콘티들) → 콘티를 누르면 그 콘티의 여러 버전을 보는 상세 화면. 열린 콘티는 주소 뒤 #번호로 기억한다.
  let openId = (location.hash || "").slice(1);
  let lastRows = [];
  let lastOutputs = {};
  window.addEventListener("hashchange", () => { openId = (location.hash || "").slice(1); load(); });

  async function loadInner(list) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/youtube_scripts?select=*&status=eq.approved&order=created_at.desc`, { headers });
    const rows = await res.json();
    if (!res.ok) throw new Error(rows.message || "대본을 불러올 수 없습니다");
    const outputsByScript = await loadOutputsByScript(rows.map((r) => r.id));
    lastRows = rows;
    lastOutputs = outputsByScript;

    // 생성 중이던 콘티가 끝났으면 알려준다
    const nowRunning = new Set(rows.filter((r) => r.generation_status === "running").map((r) => String(r.id)));
    (window.__genPrev || new Set()).forEach((id) => {
      if (nowRunning.has(id)) return;
      const r = rows.find((x) => String(x.id) === id);
      if (r && (r.generation_status === "done" || r.generation_status === "error")) genNotify(videoName(r), r.generation_status === "done");
    });
    window.__genPrev = nowRunning;

    const openRow = openId && rows.find((r) => String(r.id) === openId);
    if (openRow) renderDetail(list, openRow, outputsByScript[openRow.id] || []);
    else renderList(list, rows, outputsByScript);

    if (rows.some((r) => r.generation_status === "running") || ytAnyUploading(outputsByScript)) {
      ytSchedulePoll(load);
    }
  }

  function renderList(list, rows, outputsByScript) {
    const items = rows.filter((r) => (outputsByScript[r.id] || []).length || r.generation_status === "running");
    if (!items.length) {
      list.innerHTML = '<div class="empty">아직 만든 영상이 없습니다. 콘티 페이지의 "영상 생성" 버튼으로 만드세요.<br><a class="accent" href="/youtube/storyboard.html">콘티 열기</a></div>';
      return;
    }
    list.innerHTML = items.map((r) => {
      const outs = outputsByScript[r.id] || [];
      const running = r.generation_status === "running";
      const latest = outs[0];
      const meta = outs.length
        ? `영상 ${outs.length}개 (v${latest.version}까지) · ${escapeHtml((latest.created_at || "").slice(0, 10))}`
        : "아직 완성된 영상 없음";
      return `
      <div class="card-box studio-item" data-id="${r.id}" role="button" tabindex="0">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
          <div style="min-width:0;">
            <div class="title" style="margin-bottom:4px;">${escapeHtml(videoName(r) || "(이름 없음)")}</div>
            <div class="meta">${meta}${running ? ' · <span class="status-tag status-running">생성 중</span>' : ""}</div>
          </div>
          ${outs.length ? `<button type="button" class="list-del-btn" data-id="${r.id}" style="width:auto;padding:4px 10px;font-size:0.72rem;background:#3a1414;color:#ff8a80;flex-shrink:0;">전체 삭제</button>` : ""}
        </div>
      </div>`;
    }).join("");

    list.querySelectorAll(".studio-item").forEach((el) => {
      const open = () => { location.hash = el.dataset.id; };
      el.addEventListener("click", (e) => { if (!e.target.closest(".list-del-btn")) open(); });
      el.addEventListener("keydown", (e) => { if (e.key === "Enter") open(); });
    });
    list.querySelectorAll(".list-del-btn").forEach((btn) =>
      btn.addEventListener("click", (e) => { e.stopPropagation(); deleteAllOutputs(btn.dataset.id); })
    );
  }

  function renderDetail(list, r, outputs) {
    list.innerHTML = `
      <button type="button" id="backBtn" style="width:auto;padding:6px 14px;font-size:0.8rem;background:#221a2e;margin-bottom:12px;">← 영상 목록</button>
      <div class="card-box" data-id="${r.id}">
        <div class="title" style="font-weight:800;margin-bottom:6px;">${escapeHtml(videoName(r) || "(이름 없음)")}</div>
        <div class="s-meta" style="margin-bottom:6px;"><span class="status-tag status-${r.generation_status || "idle"}">${r.generation_status || "idle"}</span></div>
        ${r.generation_status === "running" ? `<div class="s-meta" style="color:#4fc3f7;">영상 생성 중... (몇 분 걸려요. 끝나면 알림이 뜹니다)</div>` : ""}
        ${r.generation_status === "error" ? `<div class="s-meta" style="color:#ff8a80;">${escapeHtml(genErrorText((r.video_settings || {}).last_error))}${((r.video_settings || {}).last_error || {}).url ? ` · <a class="accent" href="${escapeHtml(r.video_settings.last_error.url)}" target="_blank" rel="noopener">실행 기록 보기</a>` : ""}<br>Scenes에서 영상 생성 버튼을 다시 누르면 재시도합니다.</div>` : ""}
        ${!outputs.length && r.generation_status !== "running" ? '<div class="s-meta">남은 영상이 없습니다.</div>' : ""}
        <div class="video-wrap" id="video-${r.id}">
          ${outputs.map((o) => `
            <div style="margin-top:12px;">
              <div class="s-meta" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
                <span>${(((r.video_settings || {}).titles || {})[o.version]) ? `v${o.version} · ${escapeHtml(r.video_settings.titles[o.version])}` : `${escapeHtml(videoName(r))} v${o.version}`}</span>
                <button type="button" class="out-del-btn" data-id="${o.id}" data-path="${escapeHtml(o.storage_path)}" data-version="${o.version}" style="width:auto;padding:3px 10px;font-size:0.7rem;background:#3a1414;color:#ff8a80;">삭제</button>
              </div>
              <video controls preload="none" src="${o.video_url}"></video>
              <a class="link-btn" style="margin-top:8px;" href="${downloadUrl(o.video_url, videoName(r), o.version)}" download>다운로드</a>
              ${uploadBlockHtml(o, r)}
            </div>
          `).join("")}
        </div>
      </div>`;
    document.getElementById("backBtn").addEventListener("click", () => { history.pushState(null, "", location.pathname); openId = ""; load(); });
    document.querySelectorAll(".out-del-btn").forEach((btn) =>
      btn.addEventListener("click", () => deleteOutput(btn.dataset.id, btn.dataset.path, btn.dataset.version))
    );
    bindUploadBlocks(load);
    window.scrollTo(0, 0);
  }

  // 이미 없는 파일은 성공으로 본다 (스토리지는 없는 파일 삭제에 400 + "Object not found"를 돌려준다)
  async function deleteStorageFile(path) {
    const res = await fetch(`${SUPABASE_URL}/storage/v1/object/youtube-outputs/${path}`, { method: "DELETE", headers });
    if (res.ok || res.status === 404) return;
    const text = await res.text();
    if (!/not_found|Object not found/i.test(text)) throw new Error(text);
  }

  // 한 콘티의 모든 버전 영상을 한 번에 지운다 (콘티 자체는 그대로)
  async function deleteAllOutputs(scriptId) {
    const outs = lastOutputs[scriptId] || [];
    const row = lastRows.find((r) => String(r.id) === String(scriptId));
    if (!outs.length) return;
    if (!confirm(`"${videoName(row)}"의 영상 ${outs.length}개(전체 버전)를 모두 삭제할까요? 되돌릴 수 없습니다. (콘티는 그대로 남습니다)`)) return;
    try {
      for (const o of outs) {
        await deleteStorageFile(o.storage_path);
        const rres = await fetch(`${SUPABASE_URL}/rest/v1/youtube_outputs?id=eq.${o.id}`, { method: "DELETE", headers });
        if (!rres.ok) throw new Error(await rres.text());
      }
      load();
    } catch (err) {
      alert("삭제 실패: " + err.message);
      load();
    }
  }

  async function deleteOutput(id, path, version) {
    if (!confirm(`v${version} 영상을 삭제할까요? 되돌릴 수 없습니다.`)) return;
    try {
      await deleteStorageFile(path);
      const rres = await fetch(`${SUPABASE_URL}/rest/v1/youtube_outputs?id=eq.${id}`, { method: "DELETE", headers });
      if (!rres.ok) throw new Error(await rres.text());
      load();
    } catch (err) {
      alert("삭제 실패: " + err.message);
    }
  }

  load();

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/sw.js");
  }
</script>
<script src="/hub-nav.js"></script>
</body>
</html>
