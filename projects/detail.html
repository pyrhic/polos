<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>프로젝트 — 뽈로</title>
<link rel="stylesheet" href="/projects/style.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0d1b2a">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
  <div class="wrap">
    <a class="back" href="/projects/list.html">← 프로젝트 목록</a>
    <div id="content"><div class="empty">불러오는 중...</div></div>
  </div>

<script>
  const SUPABASE_URL = "https://oenqrlgmnkpzxsavnfyo.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_sZ4wQgaC5f-i40pVzf0vIA_R7iJWDf5";
  const headers = {
    apikey: SUPABASE_ANON_KEY,
    Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
    "Content-Type": "application/json",
  };
  const projectId = new URLSearchParams(location.search).get("id");
  const content = document.getElementById("content");

  let currentProject = null;
  let currentTodos = [];
  let currentNotes = [];
  let currentMilestones = [];
  let selectedMilestoneId = null;

  function escapeHtml(s) {
    return String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  }

  // 화면 표시용 - YYYY-MM-DD를 M/D로 간단히 (연도 생략). 저장/입력값은 그대로 YYYY-MM-DD 유지
  function fmtDate(dateStr) {
    if (!dateStr) return "";
    const parts = dateStr.split("-");
    if (parts.length !== 3) return dateStr;
    return `${Number(parts[1])}/${Number(parts[2])}`;
  }

  // 날짜 계산은 항상 UTC 기준 ms로 - new Date(str+"T00:00:00")는 "로컬시간 자정"으로 해석되는데
  // 여기서 toISOString()(항상 UTC)으로 되돌리면 한국(UTC+9) 등 양수 시간대에서는 하루가 앞으로
  // 밀려버림(예: 12/1 자정 KST = UTC로는 11/30 15시) - UTC로만 계산해서 이 문제를 원천 차단
  function dateStrToUTC(dateStr) {
    const [y, m, d] = dateStr.split("-").map(Number);
    return Date.UTC(y, m - 1, d);
  }
  function utcToDateStr(ms) {
    return new Date(ms).toISOString().slice(0, 10);
  }

  // 달력 아이콘형 날짜칸 - 실제 <input type="date">에 값이 바뀌면 옆의 짧은 텍스트(M/D)를 갱신
  function wireDatePicker(inputId, placeholder) {
    const input = document.getElementById(inputId);
    const textEl = document.getElementById(inputId + "_text");
    if (!input || !textEl) return;
    const refresh = () => { textEl.textContent = input.value ? fmtDate(input.value) : (placeholder || "날짜"); };
    input.addEventListener("change", refresh);
    refresh();
  }
  function datepickHtml(inputId, value) {
    return `<span class="datepick">
      <input type="date" id="${inputId}" class="datepick-input" value="${value || ""}">
      <span class="datepick-display">📅 <span class="datepick-text" id="${inputId}_text"></span></span>
    </span>`;
  }

  // list.html에서 프로젝트를 막 만들고 넘어온 경우(?init=1) - 버튼 없이 기본 타임라인을 바로 채워줌
  const isInit = new URLSearchParams(location.search).get("init") === "1";
  let initHandled = false;

  if (!projectId) {
    content.innerHTML = '<div class="empty">프로젝트를 찾을 수 없습니다.</div>';
  } else {
    load();
  }

  async function load() {
    try {
      const [pRes, todosRes, notesRes, milestonesRes] = await Promise.all([
        fetch(`${SUPABASE_URL}/rest/v1/projects?select=*&id=eq.${projectId}`, { headers }),
        fetch(`${SUPABASE_URL}/rest/v1/project_todos?select=*&project_id=eq.${projectId}&order=id.asc`, { headers }),
        fetch(`${SUPABASE_URL}/rest/v1/project_notes?select=*&project_id=eq.${projectId}&order=id.desc`, { headers }),
        fetch(`${SUPABASE_URL}/rest/v1/project_milestones?select=*&project_id=eq.${projectId}&order=milestone_date.asc`, { headers }),
      ]);
      const projects = await pRes.json();
      if (!projects.length) {
        content.innerHTML = '<div class="empty">프로젝트를 찾을 수 없습니다.</div>';
        return;
      }
      currentProject = projects[0];
      currentTodos = todosRes.ok ? await todosRes.json() : [];
      currentNotes = notesRes.ok ? await notesRes.json() : [];
      currentMilestones = milestonesRes.ok ? await milestonesRes.json() : [];
      if (selectedMilestoneId && !currentMilestones.some((m) => m.id === selectedMilestoneId)) {
        selectedMilestoneId = null;
      }
      if (isInit && !initHandled && !currentMilestones.length && currentProject.start_date && currentProject.due_date) {
        initHandled = true;
        await generateDefaultTimeline();
        return; // generateDefaultTimeline이 끝나면서 load()를 다시 불러 화면을 그림
      }
      render();
    } catch (err) {
      content.innerHTML = '<div class="empty">불러오기 실패: ' + err.message + "</div>";
    }
  }

  function dDayLabel(dueDate) {
    if (!dueDate) return { text: "", overdue: false };
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const due = new Date(dueDate + "T00:00:00");
    const diffDays = Math.round((due - today) / 86400000);
    if (diffDays === 0) return { text: "D-day", overdue: false };
    if (diffDays > 0) return { text: `D-${diffDays}`, overdue: false };
    return { text: `D+${Math.abs(diffDays)}`, overdue: true };
  }

  function render() {
    const project = currentProject;
    const total = currentTodos.length;
    const done = currentTodos.filter((t) => t.completed).length;
    const pct = total ? Math.round((done / total) * 100) : 0;
    const dday = dDayLabel(project.due_date);

    content.innerHTML = `
      <h1 style="font-size:1.4rem;margin-bottom:0.4rem;">${escapeHtml(project.name)}</h1>
      <div style="margin-bottom:14px;">
        <span class="status-badge status-${escapeHtml(project.status)}">${escapeHtml(project.status)}</span>
        ${dday.text ? `<span class="due${dday.overdue ? " overdue" : ""}" style="margin-left:8px;">${dday.text}</span>` : ""}
      </div>

      <div class="section-title" style="margin-top:0;">타임라인</div>
      <div id="timelineBox">${renderTimeline()}</div>
      <div id="milestoneListBox">${renderMilestoneList()}</div>

      <button type="button" id="showAddMilestoneBtn" class="add-trigger-btn">+ 마일스톤 추가</button>
      <div id="addMilestoneBox" style="display:none;margin-top:10px;">
        <div class="timeline-add-row">
          <input type="text" id="newMilestoneTitle" placeholder="마일스톤 이름">
          ${datepickHtml("newMilestoneDate")}
          <button type="button" id="addMilestoneBtn" style="width:auto;">추가</button>
        </div>
      </div>

      ${renderUnassignedTodos()}

      <div class="progress-outer" style="margin-top:22px;"><div class="progress-inner" style="width:${pct}%;"></div></div>
      <div class="progress-label">전체 ${done}/${total} 완료 · ${pct}%</div>
      ${project.description ? `<p class="role" style="text-align:left;margin-top:14px;">${escapeHtml(project.description).replace(/\n/g, "<br>")}</p>` : ""}

      <div class="section-title">메모 / 문서 링크</div>
      <button type="button" id="showAddNoteBtn" class="add-trigger-btn">+ 메모 추가</button>
      <div id="addNoteBox" style="display:none;margin:10px 0;">
        <div class="todo-add-row">
          <input type="text" id="newNote" placeholder="메모나 구글드라이브 등 링크 입력 후 Enter">
          <button type="button" id="addNoteBtn" style="width:auto;">추가</button>
        </div>
      </div>
      <div id="noteList">${renderNotes()}</div>

      <button type="button" id="editBtn" style="margin-top:26px;">프로젝트 정보 수정</button>
      <div id="editBox"></div>
    `;

    document.getElementById("editBtn").addEventListener("click", () => showEditBox(project));
    document.getElementById("showAddMilestoneBtn").addEventListener("click", () => {
      const box = document.getElementById("addMilestoneBox");
      const hidden = box.style.display === "none";
      box.style.display = hidden ? "block" : "none";
      if (hidden) document.getElementById("newMilestoneTitle").focus();
    });
    document.getElementById("addMilestoneBtn").addEventListener("click", addMilestone);
    document.getElementById("newMilestoneTitle").addEventListener("keydown", (e) => { if (e.key === "Enter") addMilestone(); });
    wireDatePicker("newMilestoneDate", "날짜");
    document.getElementById("showAddNoteBtn").addEventListener("click", () => {
      const box = document.getElementById("addNoteBox");
      const hidden = box.style.display === "none";
      box.style.display = hidden ? "block" : "none";
      if (hidden) document.getElementById("newNote").focus();
    });
    document.getElementById("addNoteBtn").addEventListener("click", addNote);
    document.getElementById("newNote").addEventListener("keydown", (e) => { if (e.key === "Enter") addNote(); });

    wireTimelineEvents();
    wireMilestoneListEvents();
    wireTodoEvents(document.getElementById("unassignedTodoList"));
    wireNoteEvents();
  }

  // 마일스톤이 생기기 전에 만들어졌던 할일(milestone_id가 없는 것) - 안 보이게 사라지면 안 되니
  // 마일스톤 목록 아래에 최소한으로 계속 보여줌 (새 할일은 이제 항상 마일스톤 아래로 추가됨)
  function renderUnassignedTodos() {
    const unassigned = currentTodos.filter((t) => !t.milestone_id);
    if (!unassigned.length) return "";
    return `
      <div class="section-title">마일스톤 미지정 할 일</div>
      <div id="unassignedTodoList">${renderTodoItems(unassigned)}</div>
    `;
  }

  // ---- 타임라인 ----
  // 마일스톤에 딸린 할일의 완료율 계산 - 타임라인의 파이차트 원, 마일스톤 목록 양쪽에서 공용으로 씀
  function milestoneProgress(milestoneId) {
    const todos = currentTodos.filter((t) => t.milestone_id === milestoneId);
    const total = todos.length;
    const done = todos.filter((t) => t.completed).length;
    const pct = total ? Math.round((done / total) * 100) : 0;
    return { todos, total, done, pct };
  }
  function pieGradient(pct) {
    return `conic-gradient(#3ecf8e ${pct}%, #16324a ${pct}% 100%)`;
  }

  // 타임라인 표시 범위는 "행사 시작~종료"뿐 아니라, 그보다 앞뒤로 나가는 마일스톤(기획 착수,
  // 결과보고 등)까지 전부 포함하도록 넓혀서 계산 - 안 그러면 행사 전/후 마일스톤이 양끝에 뭉개져 보임
  function computeTimelineData() {
    const project = currentProject;
    if (!project.start_date || !project.due_date) return null;
    const eventStart = dateStrToUTC(project.start_date);
    const eventEnd = dateStrToUTC(project.due_date);
    const milestoneTimes = currentMilestones.map((m) => dateStrToUTC(m.milestone_date));
    const rangeStart = Math.min(eventStart, ...milestoneTimes);
    const rangeEnd = Math.max(eventEnd, ...milestoneTimes);
    const span = rangeEnd - rangeStart || 1;
    const posPctOf = (t) => Math.min(100, Math.max(0, ((t - rangeStart) / span) * 100));
    const points = currentMilestones.map((m) => {
      const t = dateStrToUTC(m.milestone_date);
      const { pct: donePct } = milestoneProgress(m.id);
      return { ...m, pct: posPctOf(t), donePct };
    });
    return {
      start: project.start_date,
      end: project.due_date,
      points,
    };
  }

  function renderTimeline() {
    const data = computeTimelineData();
    if (!data) {
      return '<div class="empty">타임라인을 보려면 프로젝트 정보 수정에서 행사(실행) 날짜를 먼저 설정해주세요.</div>';
    }
    const eventLabel = data.start === data.end ? `행사일 ${fmtDate(data.start)}` : `행사 ${fmtDate(data.start)} ~ ${fmtDate(data.end)}`;
    if (!data.points.length) {
      return `<div class="empty">${escapeHtml(eventLabel)} · 아직 마일스톤이 없습니다. 위 버튼으로 기본 타임라인을 만들거나 직접 추가해보세요.</div>`;
    }
    const trackWidth = Math.max(600, data.points.length * 110 + 220);

    // 마일스톤을 위치순으로 정렬한 뒤 한 칸씩 지그재그로 배치해서
    // 날짜가 가까운 것끼리 라벨 글자가 겹치지 않게 함
    const sorted = [...data.points].sort((a, b) => a.pct - b.pct);
    const markersHtml = sorted
      .map((p, i) => {
        const cls = [
          "timeline-marker",
          p.id === selectedMilestoneId ? "selected" : "",
          i % 2 === 1 ? "stagger" : "",
        ].filter(Boolean).join(" ");
        return `<div class="${cls}" style="left:${p.pct}%;background:${pieGradient(p.donePct)};" data-id="${p.id}">
          <span class="timeline-marker-label">${escapeHtml(p.title)}<br>${fmtDate(p.milestone_date)}</span>
        </div>`;
      })
      .join("");

    return `
      <div class="timeline-event-label">${escapeHtml(eventLabel)}</div>
      <div class="timeline-scroll">
        <div class="timeline-track" style="width:${trackWidth}px;">
          <div class="timeline-line"></div>
          ${markersHtml}
        </div>
      </div>
    `;
  }

  // 타임라인의 점을 누르든, 아래 마일스톤 목록의 행을 누르든 같은 상태(selectedMilestoneId)를
  // 같이 바꿔서 항상 서로 맞물려 보이게 함. 이미 열려있는 걸 다시 누르면 접힘
  function toggleMilestone(id) {
    selectedMilestoneId = selectedMilestoneId === id ? null : id;
    document.getElementById("timelineBox").innerHTML = renderTimeline();
    wireTimelineEvents();
    document.getElementById("milestoneListBox").innerHTML = renderMilestoneList();
    wireMilestoneListEvents();
  }

  function wireTimelineEvents() {
    document.querySelectorAll(".timeline-marker[data-id]").forEach((el) => {
      el.addEventListener("click", () => toggleMilestone(Number(el.dataset.id)));
    });
  }

  async function addMilestone() {
    const titleInput = document.getElementById("newMilestoneTitle");
    const dateInput = document.getElementById("newMilestoneDate");
    const title = titleInput.value.trim();
    const date = dateInput.value;
    if (!title || !date) {
      alert("마일스톤 이름과 날짜를 모두 입력해주세요.");
      return;
    }
    const res = await fetch(`${SUPABASE_URL}/rest/v1/project_milestones`, {
      method: "POST",
      headers,
      body: JSON.stringify({ project_id: Number(projectId), title, milestone_date: date }),
    });
    if (!res.ok) {
      alert("마일스톤 추가 실패: " + (await res.text()));
      return;
    }
    titleInput.value = "";
    dateInput.value = "";
    load();
  }

  function addDays(dateStr, days) {
    return utcToDateStr(dateStrToUTC(dateStr) + days * 86400000);
  }

  // 프로젝트의 유형/조건 플래그 → 활성화할 WBS 모듈 목록. 'base'는 항상 포함.
  // 지금은 wbs_master_tasks에 'base' 모듈만 시드돼 있어서 사실상 항상 base만 나오지만,
  // 나중에 event/education/public_fund/... 모듈을 마스터 테이블에 추가하면 이 함수만으로 자동 반영됨
  function computeSelectedModules(project) {
    const modules = new Set(["base"]);
    const types = project.project_types || [];
    if (project.requires_onsite) modules.add("event");
    if (project.requires_recruitment) modules.add("promotion");
    if (project.is_public_fund) modules.add("public_fund");
    if (project.requires_accommodation) modules.add("accommodation");
    if (types.includes("교육")) modules.add("education");
    if (types.includes("연구조사")) modules.add("research");
    if (types.includes("출판")) modules.add("publishing");
    return [...modules];
  }

  // wbs_master_tasks(마스터 템플릿)에서 이 프로젝트의 모듈에 해당하는 행을 가져와
  // 마일스톤(level 0)+할일(level 1)로 복제 - id 오름차순으로 가져오면 부모(단계)가
  // 항상 자식(세부업무)보다 먼저 나오는 순서가 보장됨 (마스터 시드가 그렇게 만들어져 있음)
  async function generateDefaultTimeline() {
    const project = currentProject;
    if (!project.start_date || !project.due_date) {
      alert("먼저 위쪽 '프로젝트 정보 수정'에서 행사(실행) 날짜를 설정해주세요.");
      return;
    }
    if (currentMilestones.length > 0) {
      if (!confirm("이미 마일스톤이 있어요. 기본 타임라인을 추가로 더 만들까요?")) return;
    }
    const eventStart = project.start_date;
    const eventEnd = project.due_date;
    const modules = computeSelectedModules(project);

    const mtRes = await fetch(
      `${SUPABASE_URL}/rest/v1/wbs_master_tasks?select=*&module=in.(${modules.join(",")})&order=id.asc`,
      { headers }
    );
    if (!mtRes.ok) {
      alert("WBS 마스터 템플릿 불러오기 실패: " + (await mtRes.text()));
      return;
    }
    const masterTasks = await mtRes.json();
    const milestoneIdByMaster = new Map();

    for (const mt of masterTasks) {
      if (mt.level === 0) {
        const base = mt.anchor === "end" ? eventEnd : eventStart;
        const date = addDays(base, mt.offset_days);
        const mRes = await fetch(`${SUPABASE_URL}/rest/v1/project_milestones`, {
          method: "POST",
          headers: { ...headers, Prefer: "return=representation" },
          body: JSON.stringify({ project_id: Number(projectId), title: mt.name, milestone_date: date }),
        });
        if (!mRes.ok) {
          alert("타임라인 생성 실패(" + mt.name + "): " + (await mRes.text()));
          return;
        }
        const [milestone] = await mRes.json();
        milestoneIdByMaster.set(mt.id, milestone.id);
      } else {
        const milestoneId = milestoneIdByMaster.get(mt.parent_id);
        if (!milestoneId) continue;
        const text = mt.deliverables_template
          ? `${mt.name} — ${mt.deliverables_template}${mt.default_assignee ? ` (${mt.default_assignee})` : ""}`
          : mt.name;
        await fetch(`${SUPABASE_URL}/rest/v1/project_todos`, {
          method: "POST",
          headers,
          body: JSON.stringify({ project_id: Number(projectId), milestone_id: milestoneId, text }),
        });
      }
    }
    load();
  }

  // ---- 마일스톤 아코디언 목록 (각 마일스톤 = 파이차트 원 + 제목/날짜, 누르면 할일 목록이 드롭다운) ----
  function renderMilestoneList() {
    if (!currentMilestones.length) {
      return '<div class="empty">아직 마일스톤이 없습니다. 위 버튼으로 기본 타임라인을 만들거나 직접 추가해보세요.</div>';
    }
    const sorted = [...currentMilestones].sort((a, b) => (a.milestone_date < b.milestone_date ? -1 : 1));
    return sorted
      .map((m) => {
        const { total, done, pct } = milestoneProgress(m.id);
        const isOpen = m.id === selectedMilestoneId;
        return `
          <div class="milestone-row" data-id="${m.id}">
            <div class="milestone-row-head">
              <div class="milestone-pie" style="background:${pieGradient(pct)};"></div>
              <div class="milestone-row-info">
                <div class="milestone-row-title">${escapeHtml(m.title)}</div>
                <div class="milestone-row-date">${fmtDate(m.milestone_date)} · ${done}/${total} 완료 · ${pct}%</div>
              </div>
              <span class="milestone-row-chevron">${isOpen ? "▲" : "▼"}</span>
            </div>
            <div class="milestone-row-body" style="${isOpen ? "" : "display:none;"}">
              ${isOpen ? renderMilestoneBody(m) : ""}
            </div>
          </div>
        `;
      })
      .join("");
  }

  function renderMilestoneBody(m) {
    const wbsTodos = currentTodos.filter((t) => t.milestone_id === m.id);
    return `
      <div style="display:flex;justify-content:flex-end;gap:8px;margin-bottom:8px;">
        <button type="button" id="editMilestoneBtn" style="width:auto;padding:4px 10px;font-size:0.75rem;margin:0;">수정</button>
        <button type="button" id="deleteMilestoneBtn" style="width:auto;padding:4px 10px;font-size:0.75rem;margin:0;background:#5a1f1f;">삭제</button>
      </div>
      <div id="milestoneEditBox"></div>
      ${renderWbsGantt(wbsTodos)}
      <button type="button" id="showAddWbsTodoBtn" class="add-trigger-btn">+ 할 일 추가</button>
      <div id="addWbsTodoBox" style="display:none;margin-top:10px;">
        <div class="todo-add-row">
          <input type="text" id="newWbsTodo" placeholder="이 마일스톤의 할 일 입력 후 Enter">
        </div>
        <div class="todo-add-row">
          ${datepickHtml("newWbsTodoStart")}
          ${datepickHtml("newWbsTodoDue")}
          <button type="button" id="addWbsTodoBtn" style="width:auto;">추가</button>
        </div>
      </div>
      <div id="wbsTodoList" style="margin-top:10px;">${renderTodoItems(wbsTodos)}</div>
    `;
  }

  // 시작일~마감일이 있는 WBS 항목들을 막대 대신 얇은 선(기간)으로 겹쳐 그려서
  // 간트차트처럼 "어떤 일이 언제부터 언제까지, 어떤 순서로" 진행되는지 한눈에 보이게 함
  function renderWbsGantt(wbsTodos) {
    const withDates = wbsTodos.filter((t) => t.due_date);
    if (!withDates.length) return "";
    const spanOf = (t) => [dateStrToUTC(t.start_date || t.due_date), dateStrToUTC(t.due_date)];
    const allTimes = withDates.flatMap(spanOf);
    const rangeStart = Math.min(...allTimes);
    const rangeEnd = Math.max(...allTimes);
    const span = rangeEnd - rangeStart || 86400000;
    const rows = withDates
      .map((t) => {
        const [s, e] = spanOf(t);
        const leftPct = ((s - rangeStart) / span) * 100;
        const widthPct = Math.max(2, ((e - s) / span) * 100);
        return `<div class="gantt-row">
          <div class="gantt-label${t.completed ? " done" : ""}">${escapeHtml(t.text)}</div>
          <div class="gantt-track"><div class="gantt-line${t.completed ? " done" : ""}" style="left:${leftPct}%;width:${widthPct}%;"></div></div>
        </div>`;
      })
      .join("");
    return `<div class="gantt-view">
      <div class="gantt-range">${fmtDate(utcToDateStr(rangeStart))} ~ ${fmtDate(utcToDateStr(rangeEnd))}</div>
      ${rows}
    </div>`;
  }

  function wireMilestoneListEvents() {
    document.querySelectorAll(".milestone-row-head").forEach((head) => {
      head.addEventListener("click", () => {
        const id = Number(head.closest(".milestone-row").dataset.id);
        toggleMilestone(id);
      });
    });

    // 펼쳐진 행이 있을 때만 그 안의 컨트롤들을 연결(한 번에 하나만 열려 있음)
    const addBtn = document.getElementById("addWbsTodoBtn");
    if (!addBtn) return;
    document.getElementById("editMilestoneBtn").addEventListener("click", showMilestoneEditBox);
    document.getElementById("showAddWbsTodoBtn").addEventListener("click", () => {
      const box = document.getElementById("addWbsTodoBox");
      const hidden = box.style.display === "none";
      box.style.display = hidden ? "block" : "none";
      if (hidden) document.getElementById("newWbsTodo").focus();
    });
    addBtn.addEventListener("click", () => addTodo(selectedMilestoneId, "newWbsTodo", "newWbsTodoDue", "newWbsTodoStart"));
    document.getElementById("newWbsTodo").addEventListener("keydown", (e) => {
      if (e.key === "Enter") addTodo(selectedMilestoneId, "newWbsTodo", "newWbsTodoDue", "newWbsTodoStart");
    });
    wireDatePicker("newWbsTodoStart", "시작일");
    wireDatePicker("newWbsTodoDue", "마감일");
    wireTodoEvents(document.getElementById("wbsTodoList"));
    document.getElementById("deleteMilestoneBtn").addEventListener("click", async () => {
      if (!confirm("이 마일스톤과 딸린 WBS 할일을 전부 삭제할까요?")) return;
      await fetch(`${SUPABASE_URL}/rest/v1/project_milestones?id=eq.${selectedMilestoneId}`, { method: "DELETE", headers });
      selectedMilestoneId = null;
      load();
    });
  }

  // 마일스톤 이름/날짜 수정 - 자동 생성된 기본 타임라인을 프로젝트 상황에 맞게 조정할 때 씀
  function showMilestoneEditBox() {
    const m = currentMilestones.find((x) => x.id === selectedMilestoneId);
    if (!m) return;
    const box = document.getElementById("milestoneEditBox");
    box.innerHTML = `
      <div class="timeline-add-row">
        <input type="text" id="editMilestoneTitle" value="${escapeHtml(m.title)}">
        ${datepickHtml("editMilestoneDate", m.milestone_date)}
        <button type="button" id="saveMilestoneBtn" style="width:auto;">저장</button>
      </div>
    `;
    wireDatePicker("editMilestoneDate", "날짜");
    document.getElementById("saveMilestoneBtn").addEventListener("click", async () => {
      const title = document.getElementById("editMilestoneTitle").value.trim();
      const date = document.getElementById("editMilestoneDate").value;
      if (!title || !date) return;
      const res = await fetch(`${SUPABASE_URL}/rest/v1/project_milestones?id=eq.${selectedMilestoneId}`, {
        method: "PATCH",
        headers,
        body: JSON.stringify({ title, milestone_date: date }),
      });
      if (!res.ok) {
        alert("마일스톤 수정 실패: " + (await res.text()));
        return;
      }
      load();
    });
  }

  // ---- 공용 할일(일반 할일 + WBS 할일 공용) ----
  function renderTodoItems(todos) {
    if (!todos.length) return '<div class="empty">할 일이 없습니다.</div>';
    return todos
      .map((t) => {
        const dday = dDayLabel(t.due_date);
        return `<div class="todo-item ${t.completed ? "completed" : ""}" data-id="${t.id}">
          <input type="checkbox" ${t.completed ? "checked" : ""} class="todo-check">
          <span class="todo-text" contenteditable="true" spellcheck="false">${escapeHtml(t.text)}</span>
          ${dday.text ? `<span class="todo-due${dday.overdue ? " overdue" : ""}">${dday.text}</span>` : ""}
          <button type="button" class="todo-del">삭제</button>
        </div>`;
      })
      .join("");
  }

  async function addTodo(milestoneId, inputId, dueInputId, startInputId) {
    const input = document.getElementById(inputId);
    const text = input.value.trim();
    if (!text) return;
    const dueInput = dueInputId ? document.getElementById(dueInputId) : null;
    const startInput = startInputId ? document.getElementById(startInputId) : null;
    const res = await fetch(`${SUPABASE_URL}/rest/v1/project_todos`, {
      method: "POST",
      headers,
      body: JSON.stringify({
        project_id: Number(projectId),
        milestone_id: milestoneId,
        text,
        start_date: startInput ? startInput.value || null : null,
        due_date: dueInput ? dueInput.value || null : null,
      }),
    });
    if (!res.ok) {
      alert("할 일 추가 실패: " + (await res.text()));
      return;
    }
    input.value = "";
    if (dueInput) dueInput.value = "";
    if (startInput) startInput.value = "";
    load();
  }

  function wireTodoEvents(container) {
    if (!container) return;
    container.querySelectorAll(".todo-check").forEach((cb) => {
      cb.addEventListener("change", async (e) => {
        const item = e.target.closest(".todo-item");
        const id = item.dataset.id;
        const completed = e.target.checked;
        item.classList.toggle("completed", completed);
        await fetch(`${SUPABASE_URL}/rest/v1/project_todos?id=eq.${id}`, {
          method: "PATCH",
          headers,
          body: JSON.stringify({ completed }),
        });
        const t = currentTodos.find((x) => x.id === Number(id));
        if (t) t.completed = completed;
        refreshProgress(t ? t.milestone_id : null);
      });
    });

    container.querySelectorAll(".todo-text").forEach((span) => {
      const originalText = span.textContent;
      span.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          span.blur();
        }
      });
      span.addEventListener("blur", async () => {
        const item = span.closest(".todo-item");
        const id = item.dataset.id;
        const newText = span.textContent.trim();
        if (!newText) {
          span.textContent = originalText;
          return;
        }
        if (newText === originalText) return;
        await fetch(`${SUPABASE_URL}/rest/v1/project_todos?id=eq.${id}`, {
          method: "PATCH",
          headers,
          body: JSON.stringify({ text: newText }),
        });
      });
    });

    container.querySelectorAll(".todo-del").forEach((btn) => {
      btn.addEventListener("click", async (e) => {
        const item = e.target.closest(".todo-item");
        const id = item.dataset.id;
        await fetch(`${SUPABASE_URL}/rest/v1/project_todos?id=eq.${id}`, { method: "DELETE", headers });
        load();
      });
    });
  }

  // 체크박스 토글 후 화면 전체 새로고침 없이 진행률/타임라인 점 상태만 즉시 갱신
  function refreshProgress(milestoneId) {
    const total = currentTodos.length;
    const done = currentTodos.filter((t) => t.completed).length;
    const pct = total ? Math.round((done / total) * 100) : 0;
    const bar = document.querySelector(".progress-inner");
    const label = document.querySelector(".progress-label");
    if (bar) bar.style.width = pct + "%";
    if (label) label.textContent = `전체 ${done}/${total} 완료 · ${pct}%`;
    document.getElementById("timelineBox").innerHTML = renderTimeline();
    wireTimelineEvents();
    // 마일스톤 목록 전체를 다시 그리면 방금 열어둔 "+ 할 일 추가" 같은 임시 상태가 접혀버리니,
    // 체크한 항목이 속한 행의 파이차트/진행률 글자만 콕 집어서 갱신
    if (milestoneId) {
      const row = document.querySelector(`.milestone-row[data-id="${milestoneId}"]`);
      const m = currentMilestones.find((x) => x.id === milestoneId);
      if (row && m) {
        const { total: mt, done: md, pct: mp } = milestoneProgress(milestoneId);
        const pie = row.querySelector(".milestone-pie");
        const dateEl = row.querySelector(".milestone-row-date");
        if (pie) pie.style.background = pieGradient(mp);
        if (dateEl) dateEl.textContent = `${fmtDate(m.milestone_date)} · ${md}/${mt} 완료 · ${mp}%`;
      }
    }
  }

  // ---- 메모/문서 링크 ----
  function renderNotes() {
    if (!currentNotes.length) return '<div class="empty">등록된 메모/링크가 없습니다.</div>';
    return currentNotes
      .map((n) => {
        const isUrl = /^https?:\/\//.test(n.content.trim());
        const body = isUrl
          ? `<a href="${escapeHtml(n.content)}" target="_blank">${escapeHtml(n.content)}</a>`
          : escapeHtml(n.content).replace(/\n/g, "<br>");
        return `<div class="note-item" data-id="${n.id}">
          ${body}
          <div><button type="button" class="note-del" style="width:auto;">삭제</button></div>
        </div>`;
      })
      .join("");
  }

  function wireNoteEvents() {
    document.querySelectorAll(".note-del").forEach((btn) => {
      btn.addEventListener("click", async (e) => {
        const id = e.target.closest(".note-item").dataset.id;
        await fetch(`${SUPABASE_URL}/rest/v1/project_notes?id=eq.${id}`, { method: "DELETE", headers });
        load();
      });
    });
  }

  async function addNote() {
    const input = document.getElementById("newNote");
    const content = input.value.trim();
    if (!content) return;
    const res = await fetch(`${SUPABASE_URL}/rest/v1/project_notes`, {
      method: "POST",
      headers,
      body: JSON.stringify({ project_id: Number(projectId), content }),
    });
    if (!res.ok) {
      alert("메모 추가 실패: " + (await res.text()));
      return;
    }
    input.value = "";
    load();
  }

  // ---- 프로젝트 정보 수정 ----
  function showEditBox(project) {
    const box = document.getElementById("editBox");
    const durationType = project.duration_type || "1일";
    const isSingleDay = durationType === "1일";
    box.innerHTML = `
      <label>이름</label>
      <input type="text" id="editName" value="${escapeHtml(project.name)}">
      <label>설명</label>
      <textarea id="editDesc">${escapeHtml(project.description || "")}</textarea>
      <label>상태</label>
      <select id="editStatus">
        <option value="진행중" ${project.status === "진행중" ? "selected" : ""}>진행중</option>
        <option value="완료" ${project.status === "완료" ? "selected" : ""}>완료</option>
        <option value="보류" ${project.status === "보류" ? "selected" : ""}>보류</option>
      </select>
      <label>프로젝트 기간 유형</label>
      <select id="editDurationType">
        <option value="1일" ${durationType === "1일" ? "selected" : ""}>하루(1일)</option>
        <option value="여러날" ${durationType === "여러날" ? "selected" : ""}>여러 날 (2일~1주)</option>
        <option value="한달" ${durationType === "한달" ? "selected" : ""}>한 달 이상</option>
      </select>
      <label id="editEventStartLabel">${isSingleDay ? "행사(실행) 날짜" : "행사(실행) 시작일"}</label>
      <div>${datepickHtml("editStart", project.start_date)}</div>
      <label id="editEventEndLabel" style="${isSingleDay ? "display:none;" : ""}">행사(실행) 종료일</label>
      <div id="editDueWrap" style="${isSingleDay ? "display:none;" : ""}">${datepickHtml("editDue", project.due_date)}</div>
      <div style="display:flex;gap:8px;margin-top:14px;">
        <button type="button" id="saveEditBtn" style="width:auto;padding:10px 16px;">저장</button>
        <button type="button" id="deleteProjectBtn" style="width:auto;padding:10px 16px;background:#5a1f1f;">프로젝트 삭제</button>
      </div>
      <div class="msg" id="editMsg"></div>
    `;
    wireDatePicker("editStart", "날짜");
    wireDatePicker("editDue", "날짜");
    document.getElementById("editDurationType").addEventListener("change", (e) => {
      const single = e.target.value === "1일";
      document.getElementById("editEventEndLabel").style.display = single ? "none" : "block";
      document.getElementById("editDueWrap").style.display = single ? "none" : "block";
      document.getElementById("editEventStartLabel").textContent = single ? "행사(실행) 날짜" : "행사(실행) 시작일";
    });
    document.getElementById("saveEditBtn").addEventListener("click", async () => {
      const msg = document.getElementById("editMsg");
      try {
        const newDurationType = document.getElementById("editDurationType").value;
        const newStart = document.getElementById("editStart").value || null;
        const newDue = newDurationType === "1일" ? newStart : document.getElementById("editDue").value || newStart;
        const datesChanged = newStart !== project.start_date || newDue !== project.due_date;
        const res = await fetch(`${SUPABASE_URL}/rest/v1/projects?id=eq.${projectId}`, {
          method: "PATCH",
          headers,
          body: JSON.stringify({
            name: document.getElementById("editName").value.trim(),
            description: document.getElementById("editDesc").value.trim(),
            status: document.getElementById("editStatus").value,
            duration_type: newDurationType,
            start_date: newStart,
            due_date: newDue,
          }),
        });
        if (!res.ok) throw new Error(await res.text());
        // 행사 날짜가 바뀌면 이미 만들어둔 마일스톤은 예전 날짜에 그대로 남아있으므로
        // 새 날짜 기준으로 기본 타임라인을 다시 만들지 물어봄(개별 커스텀했을 수도 있어 확인 후 진행)
        if (datesChanged && currentMilestones.length > 0) {
          const regen = confirm("행사 날짜가 바뀌었어요. 기존 마일스톤을 지우고 새 날짜 기준으로 기본 타임라인을 다시 만들까요?\n(취소하면 기존 마일스톤은 그대로 남아있어요)");
          if (regen) {
            await Promise.all(
              currentMilestones.map((m) => fetch(`${SUPABASE_URL}/rest/v1/project_milestones?id=eq.${m.id}`, { method: "DELETE", headers }))
            );
            await load();
            await generateDefaultTimeline();
            return;
          }
        }
        load();
      } catch (err) {
        msg.className = "msg err";
        msg.textContent = "저장 실패: " + err.message;
      }
    });
    document.getElementById("deleteProjectBtn").addEventListener("click", async () => {
      if (!confirm("이 프로젝트와 할 일/메모/타임라인을 전부 삭제할까요? 되돌릴 수 없습니다.")) return;
      await fetch(`${SUPABASE_URL}/rest/v1/projects?id=eq.${projectId}`, { method: "DELETE", headers });
      location.href = "/projects/list.html";
    });
  }

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/sw.js");
  }
</script>
</body>
</html>
