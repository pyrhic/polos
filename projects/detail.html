<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>프로젝트 — 뽈로</title>
<link rel="stylesheet" href="/projects/style.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0d1b2a">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
  <div class="wrap">
    <a class="back" href="/projects/list.html">← 프로젝트 목록</a>
    <div id="content"><div class="empty">불러오는 중...</div></div>
  </div>

<script>
  const SUPABASE_URL = "https://oenqrlgmnkpzxsavnfyo.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_sZ4wQgaC5f-i40pVzf0vIA_R7iJWDf5";
  const headers = {
    apikey: SUPABASE_ANON_KEY,
    Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
    "Content-Type": "application/json",
  };
  const projectId = new URLSearchParams(location.search).get("id");
  const content = document.getElementById("content");

  let currentProject = null;
  let currentWbsTasks = []; // project_wbs_tasks 전체(마일스톤=level0 parent_id null + 하위 업무들) - 트리는 여기서 파생
  let currentNotes = [];
  let currentTeam = [];
  let openMilestoneIds = []; // 열려있는 마일스톤 카드 - 최대 2개, 먼저 연 순서대로 쌓임
  let zoomLevel = 1; // 0.5~2.5, 타임라인 마일스톤 간격 배율(휠/핀치로 조절)
  const BOX_WIDTH_PX = 260; // 열린 마일스톤 카드 폭 - 이보다 가까운 마일스톤을 동시에 열면 "간섭"으로 봄
  const LABEL_CLUSTER_GAP_PX = 64; // 날짜/이름 라벨이 이보다 가까우면 하나로 묶어서 표시

  function escapeHtml(s) {
    return String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  }

  // 화면 표시용 - YYYY-MM-DD를 M/D로 간단히 (연도 생략). 저장/입력값은 그대로 YYYY-MM-DD 유지
  function fmtDate(dateStr) {
    if (!dateStr) return "";
    const parts = dateStr.split("-");
    if (parts.length !== 3) return dateStr;
    return `${Number(parts[1])}/${Number(parts[2])}`;
  }

  // 날짜 계산은 항상 UTC 기준 ms로 - new Date(str+"T00:00:00")는 "로컬시간 자정"으로 해석되는데
  // 여기서 toISOString()(항상 UTC)으로 되돌리면 한국(UTC+9) 등 양수 시간대에서는 하루가 앞으로
  // 밀려버림(예: 12/1 자정 KST = UTC로는 11/30 15시) - UTC로만 계산해서 이 문제를 원천 차단
  function dateStrToUTC(dateStr) {
    const [y, m, d] = dateStr.split("-").map(Number);
    return Date.UTC(y, m - 1, d);
  }
  function utcToDateStr(ms) {
    return new Date(ms).toISOString().slice(0, 10);
  }
  // "오늘"은 사용자가 보는 로컬 달력 날짜 그대로 - 다른 날짜들과 같은 UTC 앵커 계산에 태워서 위치 비교
  function todayDateStr() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  }

  // 달력 아이콘형 날짜칸 - 실제 <input type="date">에 값이 바뀌면 옆의 짧은 텍스트(M/D)를 갱신
  function wireDatePicker(inputId, placeholder) {
    const input = document.getElementById(inputId);
    const textEl = document.getElementById(inputId + "_text");
    if (!input || !textEl) return;
    const refresh = () => { textEl.textContent = input.value ? fmtDate(input.value) : (placeholder || "날짜"); };
    input.addEventListener("change", refresh);
    refresh();
  }
  function datepickHtml(inputId, value) {
    return `<span class="datepick">
      <input type="date" id="${inputId}" class="datepick-input" value="${value || ""}">
      <span class="datepick-display">📅 <span class="datepick-text" id="${inputId}_text"></span></span>
    </span>`;
  }

  // list.html에서 프로젝트를 막 만들고 넘어온 경우(?init=1) - 버튼 없이 기본 타임라인을 바로 채워줌
  const isInit = new URLSearchParams(location.search).get("init") === "1";
  let initHandled = false;

  if (!projectId) {
    content.innerHTML = '<div class="empty">프로젝트를 찾을 수 없습니다.</div>';
  } else {
    load();
  }

  async function load() {
    try {
      const [pRes, tasksRes, notesRes, teamRes] = await Promise.all([
        fetch(`${SUPABASE_URL}/rest/v1/projects?select=*&id=eq.${projectId}`, { headers }),
        fetch(`${SUPABASE_URL}/rest/v1/project_wbs_tasks?select=*&project_id=eq.${projectId}&order=sort_order.asc,id.asc`, { headers }),
        fetch(`${SUPABASE_URL}/rest/v1/project_notes?select=*&project_id=eq.${projectId}&order=id.desc`, { headers }),
        fetch(`${SUPABASE_URL}/rest/v1/project_team_members?select=*&project_id=eq.${projectId}&order=sort_order.asc,id.asc`, { headers }),
      ]);
      const projects = await pRes.json();
      if (!projects.length) {
        content.innerHTML = '<div class="empty">프로젝트를 찾을 수 없습니다.</div>';
        return;
      }
      currentProject = projects[0];
      currentWbsTasks = tasksRes.ok ? await tasksRes.json() : [];
      currentNotes = notesRes.ok ? await notesRes.json() : [];
      currentTeam = teamRes.ok ? await teamRes.json() : [];
      openMilestoneIds = openMilestoneIds.filter((id) => milestones().some((m) => m.id === id));
      if (isInit && !initHandled && !milestones().length && currentProject.start_date && currentProject.due_date) {
        initHandled = true;
        await generateDefaultTimeline();
        return; // generateDefaultTimeline이 끝나면서 load()를 다시 불러 화면을 그림
      }
      render();
    } catch (err) {
      content.innerHTML = '<div class="empty">불러오기 실패: ' + err.message + "</div>";
    }
  }

  function dDayLabel(dueDate) {
    if (!dueDate) return { text: "", overdue: false };
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const due = new Date(dueDate + "T00:00:00");
    const diffDays = Math.round((due - today) / 86400000);
    if (diffDays === 0) return { text: "D-day", overdue: false };
    if (diffDays > 0) return { text: `D-${diffDays}`, overdue: false };
    return { text: `D+${Math.abs(diffDays)}`, overdue: true };
  }

  // ---- WBS 트리 헬퍼 (project_wbs_tasks 하나로 마일스톤+하위업무 전체를 트리로 취급) ----
  function childrenOf(parentId) {
    return currentWbsTasks
      .filter((t) => t.parent_id === parentId)
      .sort((a, b) => (a.sort_order ?? 0) - (b.sort_order ?? 0) || a.id - b.id);
  }
  function milestones() {
    return childrenOf(null);
  }
  function descendantsFlat(id) {
    const kids = childrenOf(id);
    return kids.flatMap((k) => [k, ...descendantsFlat(k.id)]);
  }
  function isLeaf(t) {
    return !currentWbsTasks.some((x) => x.parent_id === t.id);
  }
  // 마일스톤 자신은 완료 대상 업무로 안 세고, 실제 말단 업무(leaf)만 진행률 계산에 넣음
  function countableLeaves(list) {
    return list.filter((t) => isLeaf(t) && !t.is_milestone);
  }
  function subtreeProgress(id) {
    const leaves = countableLeaves(descendantsFlat(id));
    const total = leaves.length;
    const done = leaves.filter((t) => t.status === "완료").length;
    const pct = total ? Math.round((done / total) * 100) : 0;
    return { total, done, pct };
  }
  // 완료(초록) 아닌 나머지 부분은 카드 배경(#16324a)과 겹치면 안 보이므로 확실히 다른 색을 씀
  function pieGradient(pct) {
    return `conic-gradient(#3ecf8e ${pct}%, #3a4f66 ${pct}% 100%)`;
  }

  function render() {
    const project = currentProject;
    const dday = dDayLabel(project.due_date);

    content.innerHTML = `
      <h1 style="font-size:1.4rem;margin-bottom:0.4rem;">${escapeHtml(project.name)}</h1>
      <div style="margin-bottom:14px;">
        <span class="status-badge status-${escapeHtml(project.status)}">${escapeHtml(project.status)}</span>
        ${dday.text ? `<span class="due${dday.overdue ? " overdue" : ""}" style="margin-left:8px;">${dday.text}</span>` : ""}
      </div>

      <div class="section-title" style="margin-top:0;">타임라인</div>
      <div id="timelineBox">${renderTimeline()}</div>
      <div id="timelineBoxesArea">${renderTimelineBoxes()}</div>

      <button type="button" id="showAddMilestoneBtn" class="add-trigger-btn">+ 마일스톤 추가</button>
      <div id="addMilestoneBox" style="display:none;margin-top:10px;">
        <div class="timeline-add-row">
          <input type="text" id="newMilestoneTitle" placeholder="마일스톤 이름">
          ${datepickHtml("newMilestoneDate")}
          <button type="button" id="addMilestoneBtn" style="width:auto;">추가</button>
        </div>
      </div>

      ${project.description ? `<p class="role" style="text-align:left;margin-top:22px;">${escapeHtml(project.description).replace(/\n/g, "<br>")}</p>` : ""}

      <div class="section-title">팀 구성</div>
      <button type="button" id="showAddTeamBtn" class="add-trigger-btn">+ 팀원 추가</button>
      <div id="addTeamBox" style="display:none;margin:10px 0;">
        <div class="todo-add-row">
          <input type="text" id="newTeamName" placeholder="이름">
          <input type="text" id="newTeamRole" placeholder="역할(선택)">
          <button type="button" id="addTeamBtn" style="width:auto;">추가</button>
        </div>
      </div>
      <div id="teamList">${renderTeam()}</div>
      <datalist id="teamNamesList">${currentTeam.map((m) => `<option value="${escapeHtml(m.name)}">`).join("")}</datalist>

      <div class="section-title">메모 / 문서 링크</div>
      <button type="button" id="showAddNoteBtn" class="add-trigger-btn">+ 메모 추가</button>
      <div id="addNoteBox" style="display:none;margin:10px 0;">
        <div class="todo-add-row">
          <input type="text" id="newNote" placeholder="메모나 구글드라이브 등 링크 입력 후 Enter">
          <button type="button" id="addNoteBtn" style="width:auto;">추가</button>
        </div>
      </div>
      <div id="noteList">${renderNotes()}</div>

      <button type="button" id="editBtn" style="margin-top:26px;">프로젝트 정보 수정</button>
      <div id="editBox"></div>
    `;

    document.getElementById("editBtn").addEventListener("click", () => showEditBox(project));
    document.getElementById("showAddMilestoneBtn").addEventListener("click", () => {
      const box = document.getElementById("addMilestoneBox");
      const hidden = box.style.display === "none";
      box.style.display = hidden ? "block" : "none";
      if (hidden) document.getElementById("newMilestoneTitle").focus();
    });
    document.getElementById("addMilestoneBtn").addEventListener("click", addMilestone);
    document.getElementById("newMilestoneTitle").addEventListener("keydown", (e) => { if (e.key === "Enter") addMilestone(); });
    wireDatePicker("newMilestoneDate", "날짜");
    document.getElementById("showAddNoteBtn").addEventListener("click", () => {
      const box = document.getElementById("addNoteBox");
      const hidden = box.style.display === "none";
      box.style.display = hidden ? "block" : "none";
      if (hidden) document.getElementById("newNote").focus();
    });
    document.getElementById("addNoteBtn").addEventListener("click", addNote);
    document.getElementById("newNote").addEventListener("keydown", (e) => { if (e.key === "Enter") addNote(); });
    document.getElementById("showAddTeamBtn").addEventListener("click", () => {
      const box = document.getElementById("addTeamBox");
      const hidden = box.style.display === "none";
      box.style.display = hidden ? "block" : "none";
      if (hidden) document.getElementById("newTeamName").focus();
    });
    document.getElementById("addTeamBtn").addEventListener("click", addTeamMember);
    document.getElementById("newTeamRole").addEventListener("keydown", (e) => { if (e.key === "Enter") addTeamMember(); });
    wireTeamEvents();

    wireTimelineEvents();
    wireMilestoneBodyEvents(document.getElementById("timelineBoxesArea"));
    adjustBoxesViewportHeight();
    wireNoteEvents();
  }

  // ---- 타임라인 ----
  // 타임라인 표시 범위는 "행사 시작~종료"뿐 아니라, 그보다 앞뒤로 나가는 마일스톤(기획 착수,
  // 결과보고 등)까지 전부 포함하도록 넓혀서 계산 - 안 그러면 행사 전/후 마일스톤이 양끝에 뭉개져 보임
  function computeTimelineData() {
    const project = currentProject;
    if (!project.start_date || !project.due_date) return null;
    const eventStart = dateStrToUTC(project.start_date);
    const eventEnd = dateStrToUTC(project.due_date);
    const ms = milestones();
    const milestoneTimes = ms.map((m) => dateStrToUTC(m.due_date));
    const rangeStart = Math.min(eventStart, ...milestoneTimes);
    const rangeEnd = Math.max(eventEnd, ...milestoneTimes);
    const span = rangeEnd - rangeStart || 1;
    const posPctOf = (t) => Math.min(100, Math.max(0, ((t - rangeStart) / span) * 100));
    const points = ms.map((m) => {
      const t = dateStrToUTC(m.due_date);
      const { pct: donePct } = subtreeProgress(m.id);
      return { ...m, pct: posPctOf(t), donePct };
    });
    const trackWidth = Math.max(600, points.length * 110 + 220) * zoomLevel;
    return {
      start: project.start_date,
      end: project.due_date,
      points,
      todayPct: posPctOf(dateStrToUTC(todayDateStr())),
      trackWidth,
    };
  }

  function renderTimeline() {
    const data = computeTimelineData();
    if (!data) {
      return '<div class="empty">타임라인을 보려면 프로젝트 정보 수정에서 행사(실행) 날짜를 먼저 설정해주세요.</div>';
    }
    const eventLabel = data.start === data.end ? `행사일 ${fmtDate(data.start)}` : `행사 ${fmtDate(data.start)} ~ ${fmtDate(data.end)}`;
    if (!data.points.length) {
      return `<div class="empty">${escapeHtml(eventLabel)} · 아직 마일스톤이 없습니다. 아래에서 직접 추가해보세요.</div>`;
    }
    const trackWidth = data.trackWidth;
    const sorted = [...data.points].sort((a, b) => a.pct - b.pct);

    // 점(마일스톤)은 항상 자기 실제 위치에 따로 찍히지만, 라벨(날짜/이름)은 너무 가까우면
    // 하나로 묶어서 맨 앞 날짜 하나 + 이름 목록으로 표시 - 확대(zoomLevel↑)하면 간격이 벌어져서
    // 자동으로 다시 갈라져 보임
    const clusterGapPct = (LABEL_CLUSTER_GAP_PX / trackWidth) * 100;
    const clusters = [];
    sorted.forEach((p) => {
      const last = clusters[clusters.length - 1];
      if (last && p.pct - last[last.length - 1].pct < clusterGapPct) {
        last.push(p);
      } else {
        clusters.push([p]);
      }
    });

    const dotsHtml = sorted
      .map((p) => {
        const cls = ["timeline-marker", openMilestoneIds.includes(p.id) ? "selected" : ""].filter(Boolean).join(" ");
        return `<div class="${cls}" style="left:${p.pct}%;background:${pieGradient(p.donePct)};" data-id="${p.id}"></div>`;
      })
      .join("");

    const labelsHtml = clusters
      .map((cluster, i) => {
        const anchor = cluster[0];
        const stagger = i % 2 === 1 ? " stagger" : "";
        const namesHtml = cluster
          .map((p) => `<div class="timeline-cluster-name" data-id="${p.id}">${escapeHtml(p.name)}</div>`)
          .join("");
        return `
          <div class="timeline-cluster-date${stagger}" style="left:${anchor.pct}%;">${fmtDate(anchor.due_date)}</div>
          <div class="timeline-cluster-names${stagger}" style="left:${anchor.pct}%;">${namesHtml}</div>
        `;
      })
      .join("");

    return `
      <div class="timeline-event-label">${escapeHtml(eventLabel)}</div>
      <div class="timeline-scroll">
        <div class="timeline-track" style="width:${trackWidth}px;">
          <div class="timeline-line"></div>
          <div class="timeline-line-elapsed" style="width:${data.todayPct}%;"></div>
          <div class="timeline-today-tick" style="left:${data.todayPct}%;"><span class="timeline-today-label">오늘</span></div>
          ${dotsHtml}
          ${labelsHtml}
        </div>
      </div>
    `;
  }

  // 열려있는 마일스톤 카드들 - 각자 자기 마일스톤의 실제 위치(%) 아래에 붙어서 "드롭다운"처럼 뜨고,
  // 타임라인을 드래그/줌하면 같은 트랙 폭 기준으로 같이 움직이도록 스크롤 위치를 동기화함(wireTimelineEvents)
  function renderTimelineBoxes() {
    const data = computeTimelineData();
    if (!data || !openMilestoneIds.length) return "";
    const boxesHtml = openMilestoneIds
      .map((id) => {
        const p = data.points.find((x) => x.id === id);
        if (!p) return "";
        const { total, done, pct } = subtreeProgress(id);
        return `
          <div class="timeline-anchor-box" style="left:${p.pct}%;">
            <div class="milestone-row-head" style="cursor:default;">
              <div class="milestone-pie" style="background:${pieGradient(pct)};"></div>
              <div class="milestone-row-info">
                <div class="milestone-row-title">${escapeHtml(p.name)}</div>
                <div class="milestone-row-date">${fmtDate(p.due_date)} · ${done}/${total} 완료 · ${pct}%</div>
              </div>
            </div>
            ${renderMilestoneBody(p)}
          </div>
        `;
      })
      .join("");
    return `
      <div class="timeline-boxes-viewport" id="timelineBoxesViewport">
        <div class="timeline-boxes-track" style="width:${data.trackWidth}px;">
          ${boxesHtml}
        </div>
      </div>
    `;
  }

  // 마일스톤을 누르면: 이미 열려있으면 닫고, 아니면 연다. 최대 2개까지 동시에 열 수 있는데
  // 새로 여는 것이 이미 열린 것과 너무 가까우면(카드 폭 이내) 그 열린 걸 먼저 닫고 새로 염
  function toggleMilestone(id) {
    const data = computeTimelineData();
    if (!data) return;
    const trackWidth = data.trackWidth;
    const pxOf = (mid) => {
      const p = data.points.find((x) => x.id === mid);
      return p ? (p.pct / 100) * trackWidth : null;
    };
    if (openMilestoneIds.includes(id)) {
      openMilestoneIds = openMilestoneIds.filter((x) => x !== id);
    } else {
      const idPx = pxOf(id);
      openMilestoneIds = openMilestoneIds.filter((openId) => {
        const openPx = pxOf(openId);
        return openPx === null || Math.abs(openPx - idPx) >= BOX_WIDTH_PX;
      });
      openMilestoneIds.push(id);
      if (openMilestoneIds.length > 2) openMilestoneIds = openMilestoneIds.slice(-2);
    }
    renderTimelineArea();
  }

  // 타임라인(점+라벨)과 그 아래 열린 카드들을 함께 다시 그리는 공용 함수 -
  // 체크박스 토글/줌/드래그 후 등 로컬 상태만 바뀌었을 때 서버 재조회 없이 화면만 갱신할 때 씀
  function renderTimelineArea() {
    document.getElementById("timelineBox").innerHTML = renderTimeline();
    document.getElementById("timelineBoxesArea").innerHTML = renderTimelineBoxes();
    wireTimelineEvents();
    wireMilestoneBodyEvents(document.getElementById("timelineBoxesArea"));
    adjustBoxesViewportHeight();
  }

  // 카드는 absolute로 띄워서 부모 높이에 자동 반영이 안 되므로, 실제 내용 높이(최대 360px)를
  // 재서 뷰포트 높이를 직접 맞춰줌 - 안 그러면 카드가 통째로 잘려 보임
  function adjustBoxesViewportHeight() {
    const viewport = document.getElementById("timelineBoxesViewport");
    if (!viewport) return;
    const boxes = viewport.querySelectorAll(".timeline-anchor-box");
    if (!boxes.length) { viewport.style.height = "0px"; return; }
    let maxH = 0;
    boxes.forEach((b) => { maxH = Math.max(maxH, b.scrollHeight); });
    viewport.style.height = `${Math.min(maxH, 360) + 14}px`;
  }

  function touchDist(touches) {
    const dx = touches[0].clientX - touches[1].clientX;
    const dy = touches[0].clientY - touches[1].clientY;
    return Math.hypot(dx, dy);
  }

  // 줌 배율을 바꾸면서 지금 보고 있던 가로 스크롤 위치(비율)를 새 트랙 폭 기준으로 그대로 유지함
  // (안 그러면 살짝만 확대/축소해도 스크롤이 맨 앞으로 튕겨서 보던 위치를 잃어버림)
  function applyZoom(newZoomLevel) {
    const scroller = document.querySelector(".timeline-scroll");
    const oldData = computeTimelineData();
    const oldTrackWidth = oldData ? oldData.trackWidth : 1;
    const scrollRatio = scroller && oldTrackWidth ? scroller.scrollLeft / oldTrackWidth : 0;
    zoomLevel = Math.min(2.5, Math.max(0.5, newZoomLevel));
    renderTimelineArea();
    const newScroller = document.querySelector(".timeline-scroll");
    const newData = computeTimelineData();
    if (newScroller && newData) newScroller.scrollLeft = scrollRatio * newData.trackWidth;
  }

  function wireTimelineEvents() {
    document.querySelectorAll(".timeline-marker[data-id]").forEach((el) => {
      el.addEventListener("click", () => toggleMilestone(Number(el.dataset.id)));
    });
    document.querySelectorAll(".timeline-cluster-name[data-id]").forEach((el) => {
      el.addEventListener("click", () => toggleMilestone(Number(el.dataset.id)));
    });

    const scroller = document.querySelector(".timeline-scroll");
    if (!scroller) return;

    // 스크롤바를 안 보이게 숨긴 대신(스타일시트 처리) 마우스로도 폰처럼 드래그해서 좌우로 넘길 수 있게 함
    let dragging = false;
    let startX = 0;
    let startScrollLeft = 0;
    scroller.addEventListener("mousedown", (e) => {
      dragging = true;
      scroller.classList.add("dragging");
      startX = e.pageX;
      startScrollLeft = scroller.scrollLeft;
    });
    scroller.addEventListener("mousemove", (e) => {
      if (!dragging) return;
      e.preventDefault();
      scroller.scrollLeft = startScrollLeft - (e.pageX - startX);
    });
    scroller.addEventListener("mouseup", () => { dragging = false; scroller.classList.remove("dragging"); });
    scroller.addEventListener("mouseleave", () => { dragging = false; scroller.classList.remove("dragging"); });

    // 세로 방향 휠(스크롤)은 확대/축소로 씀 - 가로 스와이프(트랙패드 두 손가락)는 그대로 좌우 이동
    scroller.addEventListener("wheel", (e) => {
      if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
      e.preventDefault();
      applyZoom(zoomLevel - e.deltaY * 0.0015);
    }, { passive: false });

    // 손가락 두 개로 벌리고 오므리는 핀치 줌(폰)
    let pinchStartDist = null;
    scroller.addEventListener("touchstart", (e) => {
      if (e.touches.length === 2) pinchStartDist = touchDist(e.touches);
    });
    scroller.addEventListener("touchmove", (e) => {
      if (e.touches.length === 2 && pinchStartDist) {
        e.preventDefault();
        const d = touchDist(e.touches);
        applyZoom(zoomLevel * (d / pinchStartDist));
        pinchStartDist = d;
      }
    }, { passive: false });
    scroller.addEventListener("touchend", (e) => {
      if (e.touches.length < 2) pinchStartDist = null;
    });

    // 타임라인을 드래그/줌하면 열려있는 카드들도 같은 위치를 따라가도록 스크롤을 동기화
    const boxesViewport = document.getElementById("timelineBoxesViewport");
    scroller.addEventListener("scroll", () => {
      if (boxesViewport) boxesViewport.scrollLeft = scroller.scrollLeft;
    });
  }

  async function addMilestone() {
    const titleInput = document.getElementById("newMilestoneTitle");
    const dateInput = document.getElementById("newMilestoneDate");
    const title = titleInput.value.trim();
    const date = dateInput.value;
    if (!title || !date) {
      alert("마일스톤 이름과 날짜를 모두 입력해주세요.");
      return;
    }
    const res = await fetch(`${SUPABASE_URL}/rest/v1/project_wbs_tasks`, {
      method: "POST",
      headers,
      body: JSON.stringify({
        project_id: Number(projectId), parent_id: null, level: 0,
        name: title, status: "예정", progress: 0, is_milestone: true, due_date: date,
      }),
    });
    if (!res.ok) {
      alert("마일스톤 추가 실패: " + (await res.text()));
      return;
    }
    titleInput.value = "";
    dateInput.value = "";
    load();
  }

  function addDays(dateStr, days) {
    return utcToDateStr(dateStrToUTC(dateStr) + days * 86400000);
  }

  // 프로젝트의 유형/조건 플래그 → 활성화할 WBS 모듈 목록. 'base'는 항상 포함.
  // wbs_master_tasks에 새 모듈을 시드하면 이 함수만으로 자동 반영됨 (코드 추가 모듈 제외)
  function computeSelectedModules(project) {
    const modules = new Set(["base"]);
    const types = project.project_types || [];
    if (project.requires_onsite) modules.add("event");
    if (project.requires_recruitment) modules.add("promotion");
    if (project.is_public_fund) modules.add("public_fund");
    if (project.requires_accommodation) modules.add("accommodation");
    if (types.includes("교육")) modules.add("education");
    if (types.includes("연구조사")) modules.add("research");
    if (types.includes("출판")) modules.add("publishing");
    return [...modules];
  }

  // wbs_master_tasks(마스터 템플릿)에서 이 프로젝트의 모듈에 해당하는 행을 가져와
  // project_wbs_tasks로 복제 - id 오름차순으로 가져오면 부모(단계)가 항상 자식(세부업무)보다
  // 먼저 나오는 순서가 보장됨 (마스터 시드가 그렇게 만들어져 있음)
  async function generateDefaultTimeline() {
    const project = currentProject;
    if (!project.start_date || !project.due_date) {
      alert("먼저 위쪽 '프로젝트 정보 수정'에서 행사(실행) 날짜를 설정해주세요.");
      return;
    }
    if (milestones().length > 0) {
      if (!confirm("이미 마일스톤이 있어요. 기본 타임라인을 추가로 더 만들까요?")) return;
    }
    const eventStart = project.start_date;
    const eventEnd = project.due_date;
    const modules = computeSelectedModules(project);

    const mtRes = await fetch(
      `${SUPABASE_URL}/rest/v1/wbs_master_tasks?select=*&module=in.(${modules.join(",")})&order=id.asc`,
      { headers }
    );
    if (!mtRes.ok) {
      alert("WBS 마스터 템플릿 불러오기 실패: " + (await mtRes.text()));
      return;
    }
    const masterTasks = await mtRes.json();
    const idByMaster = new Map();
    let sortCounter = 1;

    for (const mt of masterTasks) {
      if (mt.level === 0) {
        const base = mt.anchor === "end" ? eventEnd : eventStart;
        const date = addDays(base, mt.offset_days);
        const res = await fetch(`${SUPABASE_URL}/rest/v1/project_wbs_tasks`, {
          method: "POST",
          headers: { ...headers, Prefer: "return=representation" },
          body: JSON.stringify({
            project_id: Number(projectId), master_task_id: mt.id, parent_id: null, level: 0,
            name: mt.name, status: "예정", progress: 0, is_milestone: true,
            due_date: date, sort_order: sortCounter++,
          }),
        });
        if (!res.ok) {
          alert("타임라인 생성 실패(" + mt.name + "): " + (await res.text()));
          return;
        }
        const [row] = await res.json();
        idByMaster.set(mt.id, row.id);
      } else {
        const parentId = idByMaster.get(mt.parent_id);
        if (!parentId) continue;
        await fetch(`${SUPABASE_URL}/rest/v1/project_wbs_tasks`, {
          method: "POST",
          headers,
          body: JSON.stringify({
            project_id: Number(projectId), master_task_id: mt.id, parent_id: parentId, level: 1,
            name: mt.name, status: "예정", progress: 0, is_milestone: false,
            assignee: mt.default_assignee || null, deliverables: mt.deliverables_template || null,
            evidence_required: mt.evidence_required || false, sort_order: sortCounter++,
          }),
        });
      }
    }
    load();
  }

  function renderMilestoneBody(m) {
    const desc = descendantsFlat(m.id).filter((t) => t.due_date);
    const kids = childrenOf(m.id);
    return `
      <div style="display:flex;justify-content:flex-end;gap:8px;margin-bottom:8px;">
        <button type="button" class="wbs-edit-toggle" data-id="${m.id}" style="width:auto;padding:4px 10px;font-size:0.75rem;margin:0;">수정</button>
        <button type="button" class="deleteMilestoneBtn" data-id="${m.id}" style="width:auto;padding:4px 10px;font-size:0.75rem;margin:0;background:#5a1f1f;">삭제</button>
      </div>
      <div class="task-edit-box" id="taskEditBox_${m.id}" style="display:none;"></div>
      ${renderWbsGantt(desc)}
      <div class="wbs-tree">
        ${kids.length ? kids.map((t) => renderTaskNode(t, 0)).join("") : '<div class="empty">아직 하위 업무가 없습니다.</div>'}
      </div>
      ${addTaskBoxHtml(m.id)}
    `;
  }

  // 트리 노드 하나(마일스톤의 하위 업무, 또는 그 하위의 하위 업무) - 재귀적으로 자기 자식도 그려서
  // 사용자가 "하위 업무 추가"를 누른 만큼 깊이 들어갈 수 있는 진짜 트리 뷰
  function renderTaskNode(t, depth) {
    const kids = childrenOf(t.id);
    const leaf = kids.length === 0;
    const dday = dDayLabel(t.due_date);
    const metaBits = [];
    if (t.assignee) metaBits.push(`담당 ${escapeHtml(t.assignee)}`);
    if (t.deliverables) metaBits.push(`산출물 ${escapeHtml(t.deliverables)}`);
    if (t.priority) metaBits.push(`우선순위 ${escapeHtml(t.priority)}`);
    if (!leaf) {
      const { done, total } = subtreeProgress(t.id);
      metaBits.push(`${done}/${total} 완료`);
    }
    const leftControl = leaf
      ? `<input type="checkbox" ${t.status === "완료" ? "checked" : ""} class="todo-check wbs-check" data-id="${t.id}">`
      : `<span class="wbs-node-group-mark" title="하위 업무가 있는 상위 업무"></span>`;
    return `
      <div class="wbs-node" data-id="${t.id}" style="margin-left:${depth * 18}px;">
        <div class="todo-item ${t.status === "완료" ? "completed" : ""}">
          ${leftControl}
          <span class="todo-text wbs-name${leaf ? "" : " wbs-name-group"}" contenteditable="true" spellcheck="false" data-id="${t.id}">${escapeHtml(t.name)}</span>
          ${dday.text ? `<span class="todo-due${dday.overdue ? " overdue" : ""}">${dday.text}</span>` : ""}
          <button type="button" class="wbs-edit-toggle" data-id="${t.id}">수정</button>
          <button type="button" class="todo-del wbs-del" data-id="${t.id}">삭제</button>
        </div>
        ${metaBits.length ? `<div class="wbs-node-meta">${metaBits.join(" · ")}</div>` : ""}
        <div class="task-edit-box" id="taskEditBox_${t.id}" style="display:none;"></div>
        ${addTaskBoxHtml(t.id)}
        ${kids.length ? `<div class="wbs-children">${kids.map((k) => renderTaskNode(k, depth + 1)).join("")}</div>` : ""}
      </div>
    `;
  }

  // 마일스톤 바로 아래에 업무 추가할 때도, 어떤 업무 아래에 하위 업무를 추가할 때도 똑같이 씀
  function addTaskBoxHtml(parentId) {
    return `
      <button type="button" class="showAddSubtaskBtn add-trigger-btn" data-id="${parentId}">+ 하위 업무 추가</button>
      <div class="addSubtaskBox" data-id="${parentId}" style="display:none;margin:6px 0 10px;">
        <div class="todo-add-row">
          <input type="text" class="newSubtaskName" data-id="${parentId}" placeholder="업무 이름 입력 후 Enter">
        </div>
        <div class="todo-add-row">
          ${datepickHtml(`newSubtaskStart_${parentId}`)}
          ${datepickHtml(`newSubtaskDue_${parentId}`)}
          <button type="button" class="addSubtaskBtn" data-id="${parentId}" style="width:auto;">추가</button>
        </div>
      </div>
    `;
  }

  // 시작일~마감일이 있는 하위 업무들을 막대 대신 얇은 선(기간)으로 겹쳐 그려서
  // 간트차트처럼 "어떤 일이 언제부터 언제까지, 어떤 순서로" 진행되는지 한눈에 보이게 함.
  // 담당자별로 줄을 나눠서, 한 사람 일정에 업무가 몰려있는지 한눈에 비교할 수 있게 함
  // (시간축 범위는 전체 업무 기준으로 통일해서 담당자끼리도 위치가 같은 눈금으로 비교됨)
  function renderWbsGantt(tasks) {
    if (!tasks.length) return "";
    const spanOf = (t) => [dateStrToUTC(t.start_date || t.due_date), dateStrToUTC(t.due_date)];
    const allTimes = tasks.flatMap(spanOf);
    const rangeStart = Math.min(...allTimes);
    const rangeEnd = Math.max(...allTimes);
    const span = rangeEnd - rangeStart || 86400000;

    const groups = new Map();
    tasks.forEach((t) => {
      const key = t.assignee || "담당자 미지정";
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(t);
    });

    const groupsHtml = [...groups.entries()]
      .map(([assignee, group]) => {
        const rows = group
          .map((t) => {
            const [s, e] = spanOf(t);
            const leftPct = ((s - rangeStart) / span) * 100;
            const widthPct = Math.max(2, ((e - s) / span) * 100);
            const done = t.status === "완료";
            return `<div class="gantt-row">
              <div class="gantt-label${done ? " done" : ""}">${escapeHtml(t.name)}</div>
              <div class="gantt-track"><div class="gantt-line${done ? " done" : ""}" style="left:${leftPct}%;width:${widthPct}%;"></div></div>
            </div>`;
          })
          .join("");
        return `<div class="gantt-group">
          <div class="gantt-group-label">${escapeHtml(assignee)}</div>
          ${rows}
        </div>`;
      })
      .join("");

    return `<div class="gantt-view">
      <div class="gantt-range">${fmtDate(utcToDateStr(rangeStart))} ~ ${fmtDate(utcToDateStr(rangeEnd))}</div>
      ${groupsHtml}
    </div>`;
  }

  // 마일스톤 본문(수정/삭제/트리) 배선 - 타임라인 아래 열린 카드들(timelineBoxesArea)에서 씀
  function wireMilestoneBodyEvents(root) {
    if (!root) return;
    root.querySelectorAll(".deleteMilestoneBtn").forEach((btn) => {
      btn.addEventListener("click", async () => {
        const id = Number(btn.dataset.id);
        if (!confirm("이 마일스톤과 딸린 하위 업무를 전부 삭제할까요?")) return;
        await fetch(`${SUPABASE_URL}/rest/v1/project_wbs_tasks?id=eq.${id}`, { method: "DELETE", headers });
        openMilestoneIds = openMilestoneIds.filter((x) => x !== id);
        load();
      });
    });
    wireWbsTreeEvents(root);
  }

  // 트리 안의 모든 상호작용(체크박스/이름수정/수정폼 토글/삭제/하위업무 추가) 공용 배선.
  // 마일스톤 본문이든 그 안의 개별 업무 노드든 구조가 같아서 하나의 함수로 처리
  function wireWbsTreeEvents(root) {
    if (!root) return;
    root.querySelectorAll(".wbs-check").forEach((cb) => {
      cb.addEventListener("change", async (e) => {
        const id = Number(e.target.dataset.id);
        const status = e.target.checked ? "완료" : "예정";
        await fetch(`${SUPABASE_URL}/rest/v1/project_wbs_tasks?id=eq.${id}`, {
          method: "PATCH", headers, body: JSON.stringify({ status }),
        });
        const t = currentWbsTasks.find((x) => x.id === id);
        if (t) t.status = status;
        refreshAfterLocalChange();
      });
    });

    root.querySelectorAll(".wbs-name").forEach((span) => {
      const id = Number(span.dataset.id);
      const original = span.textContent;
      span.addEventListener("keydown", (e) => {
        if (e.key === "Enter") { e.preventDefault(); span.blur(); }
      });
      span.addEventListener("blur", async () => {
        const newName = span.textContent.trim();
        if (!newName) { span.textContent = original; return; }
        if (newName === original) return;
        await fetch(`${SUPABASE_URL}/rest/v1/project_wbs_tasks?id=eq.${id}`, {
          method: "PATCH", headers, body: JSON.stringify({ name: newName }),
        });
        const t = currentWbsTasks.find((x) => x.id === id);
        if (t) t.name = newName;
      });
    });

    root.querySelectorAll(".wbs-edit-toggle").forEach((btn) => {
      btn.addEventListener("click", () => {
        const id = Number(btn.dataset.id);
        const box = document.getElementById(`taskEditBox_${id}`);
        if (!box) return;
        const hidden = box.style.display === "none";
        box.style.display = hidden ? "block" : "none";
        if (hidden) showTaskEditBox(id, `taskEditBox_${id}`);
      });
    });

    root.querySelectorAll(".wbs-del").forEach((btn) => {
      btn.addEventListener("click", async () => {
        const id = Number(btn.dataset.id);
        const hasKids = childrenOf(id).length > 0;
        if (hasKids && !confirm("이 업무와 하위 업무를 모두 삭제할까요?")) return;
        await fetch(`${SUPABASE_URL}/rest/v1/project_wbs_tasks?id=eq.${id}`, { method: "DELETE", headers });
        load();
      });
    });

    root.querySelectorAll(".showAddSubtaskBtn").forEach((btn) => {
      btn.addEventListener("click", () => {
        const id = btn.dataset.id;
        const box = root.querySelector(`.addSubtaskBox[data-id="${id}"]`);
        if (!box) return;
        const hidden = box.style.display === "none";
        box.style.display = hidden ? "block" : "none";
        if (hidden) root.querySelector(`.newSubtaskName[data-id="${id}"]`).focus();
      });
    });
    root.querySelectorAll(".addSubtaskBtn").forEach((btn) => {
      btn.addEventListener("click", () => addSubtask(Number(btn.dataset.id)));
    });
    root.querySelectorAll(".newSubtaskName").forEach((input) => {
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") addSubtask(Number(input.dataset.id));
      });
    });
    root.querySelectorAll('input[id^="newSubtaskStart_"]').forEach((el) => wireDatePicker(el.id, "시작일"));
    root.querySelectorAll('input[id^="newSubtaskDue_"]').forEach((el) => wireDatePicker(el.id, "마감일"));
  }

  async function addSubtask(parentId) {
    const nameInput = document.querySelector(`.newSubtaskName[data-id="${parentId}"]`);
    const name = nameInput.value.trim();
    if (!name) return;
    const startInput = document.getElementById(`newSubtaskStart_${parentId}`);
    const dueInput = document.getElementById(`newSubtaskDue_${parentId}`);
    const parent = currentWbsTasks.find((t) => t.id === parentId);
    const level = parent ? parent.level + 1 : 1;
    const res = await fetch(`${SUPABASE_URL}/rest/v1/project_wbs_tasks`, {
      method: "POST",
      headers,
      body: JSON.stringify({
        project_id: Number(projectId), parent_id: parentId, level,
        name, status: "예정", progress: 0, is_milestone: false,
        start_date: startInput ? startInput.value || null : null,
        due_date: dueInput ? dueInput.value || null : null,
      }),
    });
    if (!res.ok) {
      alert("업무 추가 실패: " + (await res.text()));
      return;
    }
    load();
  }

  // 마일스톤이면 이름+날짜만, 일반 업무면 담당자/상태/우선순위/일정/예산/산출물까지 편집
  function showTaskEditBox(taskId, containerId) {
    const t = currentWbsTasks.find((x) => x.id === taskId);
    const box = document.getElementById(containerId);
    if (!t || !box) return;
    if (t.is_milestone) {
      box.innerHTML = `
        <div class="timeline-add-row">
          <input type="text" id="editTaskName_${taskId}" value="${escapeHtml(t.name)}">
          ${datepickHtml(`editTaskDate_${taskId}`, t.due_date)}
          <button type="button" class="saveTaskEditBtn" data-id="${taskId}" style="width:auto;">저장</button>
        </div>
      `;
      wireDatePicker(`editTaskDate_${taskId}`, "날짜");
    } else {
      box.innerHTML = `
        <input type="text" id="editTaskName_${taskId}" value="${escapeHtml(t.name)}" placeholder="업무 이름">
        <div class="task-edit-grid">
          <label>담당자</label><input type="text" id="editTaskAssignee_${taskId}" list="teamNamesList" value="${escapeHtml(t.assignee || "")}">
          <label>상태</label>
          <select id="editTaskStatus_${taskId}">
            <option value="예정" ${t.status === "예정" ? "selected" : ""}>예정</option>
            <option value="진행" ${t.status === "진행" ? "selected" : ""}>진행</option>
            <option value="검토" ${t.status === "검토" ? "selected" : ""}>검토</option>
            <option value="완료" ${t.status === "완료" ? "selected" : ""}>완료</option>
          </select>
          <label>우선순위</label>
          <select id="editTaskPriority_${taskId}">
            <option value="" ${!t.priority ? "selected" : ""}>-</option>
            <option value="높음" ${t.priority === "높음" ? "selected" : ""}>높음</option>
            <option value="보통" ${t.priority === "보통" ? "selected" : ""}>보통</option>
            <option value="낮음" ${t.priority === "낮음" ? "selected" : ""}>낮음</option>
          </select>
          <label>시작일</label><div>${datepickHtml(`editTaskStart_${taskId}`, t.start_date)}</div>
          <label>마감일</label><div>${datepickHtml(`editTaskDue_${taskId}`, t.due_date)}</div>
          <label>예산(계획)</label><input type="number" id="editTaskBudget_${taskId}" value="${t.budget_planned ?? ""}">
          <label>산출물</label><input type="text" id="editTaskDeliverables_${taskId}" value="${escapeHtml(t.deliverables || "")}">
        </div>
        <button type="button" class="saveTaskEditBtn" data-id="${taskId}" style="width:auto;margin-top:10px;">저장</button>
      `;
      wireDatePicker(`editTaskStart_${taskId}`, "시작일");
      wireDatePicker(`editTaskDue_${taskId}`, "마감일");
    }
    document.querySelector(`.saveTaskEditBtn[data-id="${taskId}"]`).addEventListener("click", () => saveTaskEdit(taskId));
  }

  async function saveTaskEdit(taskId) {
    const t = currentWbsTasks.find((x) => x.id === taskId);
    if (!t) return;
    let body;
    if (t.is_milestone) {
      const name = document.getElementById(`editTaskName_${taskId}`).value.trim();
      const date = document.getElementById(`editTaskDate_${taskId}`).value;
      if (!name || !date) return;
      body = { name, due_date: date };
    } else {
      const name = document.getElementById(`editTaskName_${taskId}`).value.trim();
      if (!name) return;
      const budgetVal = document.getElementById(`editTaskBudget_${taskId}`).value;
      body = {
        name,
        assignee: document.getElementById(`editTaskAssignee_${taskId}`).value.trim() || null,
        status: document.getElementById(`editTaskStatus_${taskId}`).value,
        priority: document.getElementById(`editTaskPriority_${taskId}`).value || null,
        start_date: document.getElementById(`editTaskStart_${taskId}`).value || null,
        due_date: document.getElementById(`editTaskDue_${taskId}`).value || null,
        budget_planned: budgetVal ? Number(budgetVal) : null,
        deliverables: document.getElementById(`editTaskDeliverables_${taskId}`).value.trim() || null,
      };
    }
    const res = await fetch(`${SUPABASE_URL}/rest/v1/project_wbs_tasks?id=eq.${taskId}`, {
      method: "PATCH", headers, body: JSON.stringify(body),
    });
    if (!res.ok) {
      alert("수정 실패: " + (await res.text()));
      return;
    }
    load();
  }

  // 체크박스 토글처럼 잦은 변화는 서버 재조회 없이 로컬 상태만 갱신해서 화면을 다시 그림
  function refreshAfterLocalChange() {
    renderTimelineArea();
  }

  // ---- 팀 구성 (담당자 자동완성용 명단) ----
  function renderTeam() {
    if (!currentTeam.length) return '<div class="empty">아직 팀원이 없습니다.</div>';
    return currentTeam
      .map((m) => `
        <div class="team-item" data-id="${m.id}">
          <span class="team-name">${escapeHtml(m.name)}</span>
          ${m.role ? `<span class="team-role">${escapeHtml(m.role)}</span>` : ""}
          <button type="button" class="team-del" style="width:auto;">삭제</button>
        </div>
      `)
      .join("");
  }

  function wireTeamEvents() {
    document.querySelectorAll(".team-del").forEach((btn) => {
      btn.addEventListener("click", async (e) => {
        const id = e.target.closest(".team-item").dataset.id;
        await fetch(`${SUPABASE_URL}/rest/v1/project_team_members?id=eq.${id}`, { method: "DELETE", headers });
        load();
      });
    });
  }

  async function addTeamMember() {
    const nameInput = document.getElementById("newTeamName");
    const roleInput = document.getElementById("newTeamRole");
    const name = nameInput.value.trim();
    if (!name) return;
    const res = await fetch(`${SUPABASE_URL}/rest/v1/project_team_members`, {
      method: "POST",
      headers,
      body: JSON.stringify({ project_id: Number(projectId), name, role: roleInput.value.trim() || null }),
    });
    if (!res.ok) {
      alert("팀원 추가 실패: " + (await res.text()));
      return;
    }
    nameInput.value = "";
    roleInput.value = "";
    load();
  }

  // ---- 메모/문서 링크 ----
  function renderNotes() {
    if (!currentNotes.length) return '<div class="empty">등록된 메모/링크가 없습니다.</div>';
    return currentNotes
      .map((n) => {
        const isUrl = /^https?:\/\//.test(n.content.trim());
        const body = isUrl
          ? `<a href="${escapeHtml(n.content)}" target="_blank">${escapeHtml(n.content)}</a>`
          : escapeHtml(n.content).replace(/\n/g, "<br>");
        return `<div class="note-item" data-id="${n.id}">
          ${body}
          <div><button type="button" class="note-del" style="width:auto;">삭제</button></div>
        </div>`;
      })
      .join("");
  }

  function wireNoteEvents() {
    document.querySelectorAll(".note-del").forEach((btn) => {
      btn.addEventListener("click", async (e) => {
        const id = e.target.closest(".note-item").dataset.id;
        await fetch(`${SUPABASE_URL}/rest/v1/project_notes?id=eq.${id}`, { method: "DELETE", headers });
        load();
      });
    });
  }

  async function addNote() {
    const input = document.getElementById("newNote");
    const content = input.value.trim();
    if (!content) return;
    const res = await fetch(`${SUPABASE_URL}/rest/v1/project_notes`, {
      method: "POST",
      headers,
      body: JSON.stringify({ project_id: Number(projectId), content }),
    });
    if (!res.ok) {
      alert("메모 추가 실패: " + (await res.text()));
      return;
    }
    input.value = "";
    load();
  }

  // ---- 프로젝트 정보 수정 ----
  function showEditBox(project) {
    const box = document.getElementById("editBox");
    const durationType = project.duration_type || "1일";
    const isSingleDay = durationType === "1일";
    box.innerHTML = `
      <label>이름</label>
      <input type="text" id="editName" value="${escapeHtml(project.name)}">
      <label>설명</label>
      <textarea id="editDesc">${escapeHtml(project.description || "")}</textarea>
      <label>상태</label>
      <select id="editStatus">
        <option value="진행중" ${project.status === "진행중" ? "selected" : ""}>진행중</option>
        <option value="완료" ${project.status === "완료" ? "selected" : ""}>완료</option>
        <option value="보류" ${project.status === "보류" ? "selected" : ""}>보류</option>
      </select>
      <label>프로젝트 기간 유형</label>
      <select id="editDurationType">
        <option value="1일" ${durationType === "1일" ? "selected" : ""}>하루(1일)</option>
        <option value="여러날" ${durationType === "여러날" ? "selected" : ""}>여러 날 (2일~1주)</option>
        <option value="한달" ${durationType === "한달" ? "selected" : ""}>한 달 이상</option>
      </select>
      <label id="editEventStartLabel">${isSingleDay ? "행사(실행) 날짜" : "행사(실행) 시작일"}</label>
      <div>${datepickHtml("editStart", project.start_date)}</div>
      <label id="editEventEndLabel" style="${isSingleDay ? "display:none;" : ""}">행사(실행) 종료일</label>
      <div id="editDueWrap" style="${isSingleDay ? "display:none;" : ""}">${datepickHtml("editDue", project.due_date)}</div>
      <div style="display:flex;gap:8px;margin-top:14px;">
        <button type="button" id="saveEditBtn" style="width:auto;padding:10px 16px;">저장</button>
        <button type="button" id="deleteProjectBtn" style="width:auto;padding:10px 16px;background:#5a1f1f;">프로젝트 삭제</button>
      </div>
      <div class="msg" id="editMsg"></div>
    `;
    wireDatePicker("editStart", "날짜");
    wireDatePicker("editDue", "날짜");
    document.getElementById("editDurationType").addEventListener("change", (e) => {
      const single = e.target.value === "1일";
      document.getElementById("editEventEndLabel").style.display = single ? "none" : "block";
      document.getElementById("editDueWrap").style.display = single ? "none" : "block";
      document.getElementById("editEventStartLabel").textContent = single ? "행사(실행) 날짜" : "행사(실행) 시작일";
    });
    document.getElementById("saveEditBtn").addEventListener("click", async () => {
      const msg = document.getElementById("editMsg");
      try {
        const newDurationType = document.getElementById("editDurationType").value;
        const newStart = document.getElementById("editStart").value || null;
        const newDue = newDurationType === "1일" ? newStart : document.getElementById("editDue").value || newStart;
        const datesChanged = newStart !== project.start_date || newDue !== project.due_date;
        const res = await fetch(`${SUPABASE_URL}/rest/v1/projects?id=eq.${projectId}`, {
          method: "PATCH",
          headers,
          body: JSON.stringify({
            name: document.getElementById("editName").value.trim(),
            description: document.getElementById("editDesc").value.trim(),
            status: document.getElementById("editStatus").value,
            duration_type: newDurationType,
            start_date: newStart,
            due_date: newDue,
          }),
        });
        if (!res.ok) throw new Error(await res.text());
        // 행사 날짜가 바뀌면 이미 만들어둔 마일스톤은 예전 날짜에 그대로 남아있으므로
        // 새 날짜 기준으로 기본 타임라인을 다시 만들지 물어봄(개별 커스텀했을 수도 있어 확인 후 진행)
        const ms = milestones();
        if (datesChanged && ms.length > 0) {
          const regen = confirm("행사 날짜가 바뀌었어요. 기존 마일스톤을 지우고 새 날짜 기준으로 기본 타임라인을 다시 만들까요?\n(취소하면 기존 마일스톤은 그대로 남아있어요)");
          if (regen) {
            await Promise.all(
              ms.map((m) => fetch(`${SUPABASE_URL}/rest/v1/project_wbs_tasks?id=eq.${m.id}`, { method: "DELETE", headers }))
            );
            await load();
            await generateDefaultTimeline();
            return;
          }
        }
        load();
      } catch (err) {
        msg.className = "msg err";
        msg.textContent = "저장 실패: " + err.message;
      }
    });
    document.getElementById("deleteProjectBtn").addEventListener("click", async () => {
      if (!confirm("이 프로젝트와 WBS/메모를 전부 삭제할까요? 되돌릴 수 없습니다.")) return;
      await fetch(`${SUPABASE_URL}/rest/v1/projects?id=eq.${projectId}`, { method: "DELETE", headers });
      location.href = "/projects/list.html";
    });
  }

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/sw.js");
  }
</script>
</body>
</html>
