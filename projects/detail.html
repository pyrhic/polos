<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>프로젝트 — 뽈로</title>
<link rel="stylesheet" href="/projects/style.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0d1b2a">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
  <div class="wrap">
    <a class="back" href="/projects/list.html">← 프로젝트 목록</a>
    <div id="content"><div class="empty">불러오는 중...</div></div>
  </div>

<script>
  const SUPABASE_URL = "https://oenqrlgmnkpzxsavnfyo.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_sZ4wQgaC5f-i40pVzf0vIA_R7iJWDf5";
  const headers = {
    apikey: SUPABASE_ANON_KEY,
    Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
    "Content-Type": "application/json",
  };
  const projectId = new URLSearchParams(location.search).get("id");
  const content = document.getElementById("content");

  let currentProject = null;
  let currentTodos = [];
  let currentNotes = [];
  let currentMilestones = [];
  let selectedMilestoneId = null;

  function escapeHtml(s) {
    return String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  }

  if (!projectId) {
    content.innerHTML = '<div class="empty">프로젝트를 찾을 수 없습니다.</div>';
  } else {
    load();
  }

  async function load() {
    try {
      const [pRes, todosRes, notesRes, milestonesRes] = await Promise.all([
        fetch(`${SUPABASE_URL}/rest/v1/projects?select=*&id=eq.${projectId}`, { headers }),
        fetch(`${SUPABASE_URL}/rest/v1/project_todos?select=*&project_id=eq.${projectId}&order=id.asc`, { headers }),
        fetch(`${SUPABASE_URL}/rest/v1/project_notes?select=*&project_id=eq.${projectId}&order=id.desc`, { headers }),
        fetch(`${SUPABASE_URL}/rest/v1/project_milestones?select=*&project_id=eq.${projectId}&order=milestone_date.asc`, { headers }),
      ]);
      const projects = await pRes.json();
      if (!projects.length) {
        content.innerHTML = '<div class="empty">프로젝트를 찾을 수 없습니다.</div>';
        return;
      }
      currentProject = projects[0];
      currentTodos = todosRes.ok ? await todosRes.json() : [];
      currentNotes = notesRes.ok ? await notesRes.json() : [];
      currentMilestones = milestonesRes.ok ? await milestonesRes.json() : [];
      if (selectedMilestoneId && !currentMilestones.some((m) => m.id === selectedMilestoneId)) {
        selectedMilestoneId = null;
      }
      render();
    } catch (err) {
      content.innerHTML = '<div class="empty">불러오기 실패: ' + err.message + "</div>";
    }
  }

  function dDayLabel(dueDate) {
    if (!dueDate) return { text: "", overdue: false };
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const due = new Date(dueDate + "T00:00:00");
    const diffDays = Math.round((due - today) / 86400000);
    if (diffDays === 0) return { text: "오늘 마감", overdue: false };
    if (diffDays > 0) return { text: `D-${diffDays}`, overdue: false };
    return { text: `기한 ${Math.abs(diffDays)}일 지남`, overdue: true };
  }

  function render() {
    const project = currentProject;
    const total = currentTodos.length;
    const done = currentTodos.filter((t) => t.completed).length;
    const pct = total ? Math.round((done / total) * 100) : 0;
    const dday = dDayLabel(project.due_date);
    const generalTodos = currentTodos.filter((t) => !t.milestone_id);

    content.innerHTML = `
      <h1 style="font-size:1.4rem;margin-bottom:0.4rem;">${escapeHtml(project.name)}</h1>
      <div style="margin-bottom:14px;">
        <span class="status-badge status-${escapeHtml(project.status)}">${escapeHtml(project.status)}</span>
        ${dday.text ? `<span class="due${dday.overdue ? " overdue" : ""}" style="margin-left:8px;">${dday.text}</span>` : ""}
      </div>
      <div class="progress-outer"><div class="progress-inner" style="width:${pct}%;"></div></div>
      <div class="progress-label">${done}/${total} 완료 · ${pct}%</div>
      ${project.description ? `<p class="role" style="text-align:left;margin-top:14px;">${escapeHtml(project.description).replace(/\n/g, "<br>")}</p>` : ""}

      <button type="button" id="editBtn" style="margin-top:10px;">프로젝트 정보 수정</button>
      <div id="editBox"></div>

      <div class="section-title">타임라인</div>
      <button type="button" id="autoTimelineBtn" style="margin-bottom:12px;">기본 타임라인 자동 생성 (착수·기획완료·실행·결과보고)</button>
      <div class="timeline-add-row">
        <input type="text" id="newMilestoneTitle" placeholder="마일스톤 이름">
        <input type="date" id="newMilestoneDate" style="flex:0 0 150px;">
        <button type="button" id="addMilestoneBtn" style="width:auto;">추가</button>
      </div>
      <div id="timelineBox">${renderTimeline()}</div>
      <div id="wbsPanel">${renderWbsPanel()}</div>

      <div class="section-title">할 일 (일반)</div>
      <div class="todo-add-row">
        <input type="text" id="newTodo" placeholder="할 일 입력 후 Enter">
        <input type="date" id="newTodoDue" style="flex:0 0 150px;" title="마감일(선택)">
        <button type="button" id="addTodoBtn" style="width:auto;">추가</button>
      </div>
      <div id="todoList">${renderTodoItems(generalTodos)}</div>

      <div class="section-title">메모 / 문서 링크</div>
      <div class="todo-add-row">
        <input type="text" id="newNote" placeholder="메모나 구글드라이브 등 링크 입력 후 Enter">
        <button type="button" id="addNoteBtn" style="width:auto;">추가</button>
      </div>
      <div id="noteList">${renderNotes()}</div>
    `;

    document.getElementById("editBtn").addEventListener("click", () => showEditBox(project));
    document.getElementById("autoTimelineBtn").addEventListener("click", generateDefaultTimeline);
    document.getElementById("addMilestoneBtn").addEventListener("click", addMilestone);
    document.getElementById("newMilestoneTitle").addEventListener("keydown", (e) => { if (e.key === "Enter") addMilestone(); });
    document.getElementById("addTodoBtn").addEventListener("click", () => addTodo(null, "newTodo", "newTodoDue"));
    document.getElementById("newTodo").addEventListener("keydown", (e) => { if (e.key === "Enter") addTodo(null, "newTodo", "newTodoDue"); });
    document.getElementById("addNoteBtn").addEventListener("click", addNote);
    document.getElementById("newNote").addEventListener("keydown", (e) => { if (e.key === "Enter") addNote(); });

    wireTimelineEvents();
    wireTodoEvents(document.getElementById("todoList"));
    wireWbsEvents();
    wireNoteEvents();
  }

  // ---- 타임라인 ----
  // 타임라인 표시 범위는 "행사 시작~종료"뿐 아니라, 그보다 앞뒤로 나가는 마일스톤(기획 착수,
  // 결과보고 등)까지 전부 포함하도록 넓혀서 계산 - 안 그러면 행사 전/후 마일스톤이 양끝에 뭉개져 보임
  function computeTimelineData() {
    const project = currentProject;
    if (!project.start_date || !project.due_date) return null;
    const eventStart = new Date(project.start_date + "T00:00:00").getTime();
    const eventEnd = new Date(project.due_date + "T00:00:00").getTime();
    const milestoneTimes = currentMilestones.map((m) => new Date(m.milestone_date + "T00:00:00").getTime());
    const rangeStart = Math.min(eventStart, ...milestoneTimes);
    const rangeEnd = Math.max(eventEnd, ...milestoneTimes);
    const span = rangeEnd - rangeStart || 1;
    const pctOf = (t) => Math.min(100, Math.max(0, ((t - rangeStart) / span) * 100));
    const points = currentMilestones.map((m) => {
      const t = new Date(m.milestone_date + "T00:00:00").getTime();
      const wbsTodos = currentTodos.filter((td) => td.milestone_id === m.id);
      const wbsDone = wbsTodos.length > 0 && wbsTodos.every((td) => td.completed);
      return { ...m, pct: pctOf(t), wbsDone };
    });
    return {
      start: project.start_date,
      end: project.due_date,
      points,
    };
  }

  function renderTimeline() {
    const data = computeTimelineData();
    if (!data) {
      return '<div class="empty">타임라인을 보려면 프로젝트 정보 수정에서 행사(실행) 날짜를 먼저 설정해주세요.</div>';
    }
    const eventLabel = data.start === data.end ? `행사일 ${data.start}` : `행사 ${data.start} ~ ${data.end}`;
    if (!data.points.length) {
      return `<div class="empty">${escapeHtml(eventLabel)} · 아직 마일스톤이 없습니다. 위 버튼으로 기본 타임라인을 만들거나 직접 추가해보세요.</div>`;
    }
    const trackWidth = Math.max(600, data.points.length * 110 + 220);

    // 마일스톤을 위치순으로 정렬한 뒤 한 칸씩 지그재그로 배치해서
    // 날짜가 가까운 것끼리 라벨 글자가 겹치지 않게 함
    const sorted = [...data.points].sort((a, b) => a.pct - b.pct);
    const markersHtml = sorted
      .map((p, i) => {
        const cls = [
          "timeline-marker",
          p.wbsDone ? "done" : "",
          p.id === selectedMilestoneId ? "selected" : "",
          i % 2 === 1 ? "stagger" : "",
        ].filter(Boolean).join(" ");
        return `<div class="${cls}" style="left:${p.pct}%;" data-id="${p.id}">
          <span class="timeline-marker-label">${escapeHtml(p.title)}<br>${p.milestone_date}</span>
        </div>`;
      })
      .join("");

    return `
      <div class="timeline-event-label">${escapeHtml(eventLabel)}</div>
      <div class="timeline-scroll">
        <div class="timeline-track" style="width:${trackWidth}px;">
          <div class="timeline-line"></div>
          ${markersHtml}
        </div>
      </div>
    `;
  }

  function wireTimelineEvents() {
    document.querySelectorAll(".timeline-marker[data-id]").forEach((el) => {
      el.addEventListener("click", () => {
        selectedMilestoneId = Number(el.dataset.id);
        document.getElementById("timelineBox").innerHTML = renderTimeline();
        wireTimelineEvents();
        document.getElementById("wbsPanel").innerHTML = renderWbsPanel();
        wireWbsEvents();
      });
    });
  }

  async function addMilestone() {
    const titleInput = document.getElementById("newMilestoneTitle");
    const dateInput = document.getElementById("newMilestoneDate");
    const title = titleInput.value.trim();
    const date = dateInput.value;
    if (!title || !date) {
      alert("마일스톤 이름과 날짜를 모두 입력해주세요.");
      return;
    }
    await fetch(`${SUPABASE_URL}/rest/v1/project_milestones`, {
      method: "POST",
      headers,
      body: JSON.stringify({ project_id: Number(projectId), title, milestone_date: date }),
    });
    titleInput.value = "";
    dateInput.value = "";
    load();
  }

  // 프로젝트관리론 기본 단계(착수-기획완료-실행-결과보고)를 "행사(실행) 날짜" 하나를 기준으로
  // 앞뒤로 역산해서 자동으로 채워줌 - 비율이 아니라 실제 필요한 최소 기간(주 단위) 기준
  // 기간 유형별 기획 착수 시점(행사 시작일로부터 몇 주 전) - 프로젝트 규모가 클수록 기획 기간도 넉넉하게
  const PLANNING_LEAD_WEEKS = { "1일": 2, "여러날": 3, "한달": 4 };

  function addDays(dateStr, days) {
    const d = new Date(dateStr + "T00:00:00");
    d.setDate(d.getDate() + days);
    return d.toISOString().slice(0, 10);
  }

  async function generateDefaultTimeline() {
    const project = currentProject;
    if (!project.start_date || !project.due_date) {
      alert("먼저 위쪽 '프로젝트 정보 수정'에서 행사(실행) 날짜를 설정해주세요.");
      return;
    }
    if (currentMilestones.length > 0) {
      if (!confirm("이미 마일스톤이 있어요. 기본 타임라인을 추가로 더 만들까요?")) return;
    }
    const eventStart = project.start_date;
    const eventEnd = project.due_date;
    const leadWeeks = PLANNING_LEAD_WEEKS[project.duration_type] || PLANNING_LEAD_WEEKS["1일"];
    const isSingleDay = eventStart === eventEnd;

    const phases = [
      { title: "착수 (기획 시작)", date: addDays(eventStart, -leadWeeks * 7) },
      { title: "기획 완료", date: addDays(eventStart, -3) },
      isSingleDay
        ? { title: "실행 (행사 당일)", date: eventStart }
        : { title: "실행 시작 (행사 시작)", date: eventStart },
      ...(isSingleDay ? [] : [{ title: "실행 종료 (행사 종료)", date: eventEnd }]),
      { title: "종료 · 결과보고", date: addDays(eventEnd, 7) },
    ];

    for (const phase of phases) {
      await fetch(`${SUPABASE_URL}/rest/v1/project_milestones`, {
        method: "POST",
        headers,
        body: JSON.stringify({ project_id: Number(projectId), title: phase.title, milestone_date: phase.date }),
      });
    }
    load();
  }

  // ---- WBS 패널(선택된 마일스톤의 할일) ----
  function renderWbsPanel() {
    if (!selectedMilestoneId) return "";
    const m = currentMilestones.find((x) => x.id === selectedMilestoneId);
    if (!m) return "";
    const wbsTodos = currentTodos.filter((t) => t.milestone_id === selectedMilestoneId);
    return `
      <div style="background:#0f2338;border-radius:3px;padding:14px 16px;margin-bottom:20px;">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;">
          <div style="font-weight:800;">📍 ${escapeHtml(m.title)} (${m.milestone_date}) — WBS</div>
          <button type="button" id="editMilestoneBtn" style="width:auto;padding:4px 10px;font-size:0.75rem;margin:0;">수정</button>
        </div>
        <div id="milestoneEditBox"></div>
        ${renderWbsGantt(wbsTodos)}
        <div class="todo-add-row">
          <input type="text" id="newWbsTodo" placeholder="이 마일스톤의 할 일 입력 후 Enter">
        </div>
        <div class="todo-add-row">
          <label style="margin:0;flex:0 0 auto;align-self:center;font-size:0.8rem;">시작</label>
          <input type="date" id="newWbsTodoStart" style="flex:1;">
          <label style="margin:0;flex:0 0 auto;align-self:center;font-size:0.8rem;">마감</label>
          <input type="date" id="newWbsTodoDue" style="flex:1;">
          <button type="button" id="addWbsTodoBtn" style="width:auto;">추가</button>
        </div>
        <div id="wbsTodoList">${renderTodoItems(wbsTodos)}</div>
        <button type="button" id="closeWbsBtn" style="width:auto;padding:6px 12px;font-size:0.8rem;background:none;color:#8fa3b8;">닫기</button>
        <button type="button" id="deleteMilestoneBtn" style="width:auto;padding:6px 12px;font-size:0.8rem;background:#5a1f1f;margin-left:8px;">마일스톤 삭제</button>
      </div>
    `;
  }

  // 시작일~마감일이 있는 WBS 항목들을 막대 대신 얇은 선(기간)으로 겹쳐 그려서
  // 간트차트처럼 "어떤 일이 언제부터 언제까지, 어떤 순서로" 진행되는지 한눈에 보이게 함
  function renderWbsGantt(wbsTodos) {
    const withDates = wbsTodos.filter((t) => t.due_date);
    if (!withDates.length) return "";
    const spanOf = (t) => [new Date((t.start_date || t.due_date) + "T00:00:00").getTime(), new Date(t.due_date + "T00:00:00").getTime()];
    const allTimes = withDates.flatMap(spanOf);
    const rangeStart = Math.min(...allTimes);
    const rangeEnd = Math.max(...allTimes);
    const span = rangeEnd - rangeStart || 86400000;
    const rows = withDates
      .map((t) => {
        const [s, e] = spanOf(t);
        const leftPct = ((s - rangeStart) / span) * 100;
        const widthPct = Math.max(2, ((e - s) / span) * 100);
        return `<div class="gantt-row">
          <div class="gantt-label${t.completed ? " done" : ""}">${escapeHtml(t.text)}</div>
          <div class="gantt-track"><div class="gantt-line${t.completed ? " done" : ""}" style="left:${leftPct}%;width:${widthPct}%;"></div></div>
        </div>`;
      })
      .join("");
    return `<div class="gantt-view">
      <div class="gantt-range">${new Date(rangeStart).toISOString().slice(0, 10)} ~ ${new Date(rangeEnd).toISOString().slice(0, 10)}</div>
      ${rows}
    </div>`;
  }

  function wireWbsEvents() {
    const addBtn = document.getElementById("addWbsTodoBtn");
    if (!addBtn) return;
    document.getElementById("editMilestoneBtn").addEventListener("click", showMilestoneEditBox);
    addBtn.addEventListener("click", () => addTodo(selectedMilestoneId, "newWbsTodo", "newWbsTodoDue", "newWbsTodoStart"));
    document.getElementById("newWbsTodo").addEventListener("keydown", (e) => {
      if (e.key === "Enter") addTodo(selectedMilestoneId, "newWbsTodo", "newWbsTodoDue", "newWbsTodoStart");
    });
    wireTodoEvents(document.getElementById("wbsTodoList"));
    document.getElementById("closeWbsBtn").addEventListener("click", () => {
      selectedMilestoneId = null;
      document.getElementById("timelineBox").innerHTML = renderTimeline();
      wireTimelineEvents();
      document.getElementById("wbsPanel").innerHTML = "";
    });
    document.getElementById("deleteMilestoneBtn").addEventListener("click", async () => {
      if (!confirm("이 마일스톤과 딸린 WBS 할일을 전부 삭제할까요?")) return;
      await fetch(`${SUPABASE_URL}/rest/v1/project_milestones?id=eq.${selectedMilestoneId}`, { method: "DELETE", headers });
      selectedMilestoneId = null;
      load();
    });
  }

  // 마일스톤 이름/날짜 수정 - 자동 생성된 기본 타임라인을 프로젝트 상황에 맞게 조정할 때 씀
  function showMilestoneEditBox() {
    const m = currentMilestones.find((x) => x.id === selectedMilestoneId);
    if (!m) return;
    const box = document.getElementById("milestoneEditBox");
    box.innerHTML = `
      <div class="timeline-add-row">
        <input type="text" id="editMilestoneTitle" value="${escapeHtml(m.title)}">
        <input type="date" id="editMilestoneDate" style="flex:0 0 150px;" value="${m.milestone_date}">
        <button type="button" id="saveMilestoneBtn" style="width:auto;">저장</button>
      </div>
    `;
    document.getElementById("saveMilestoneBtn").addEventListener("click", async () => {
      const title = document.getElementById("editMilestoneTitle").value.trim();
      const date = document.getElementById("editMilestoneDate").value;
      if (!title || !date) return;
      await fetch(`${SUPABASE_URL}/rest/v1/project_milestones?id=eq.${selectedMilestoneId}`, {
        method: "PATCH",
        headers,
        body: JSON.stringify({ title, milestone_date: date }),
      });
      load();
    });
  }

  // ---- 공용 할일(일반 할일 + WBS 할일 공용) ----
  function renderTodoItems(todos) {
    if (!todos.length) return '<div class="empty">할 일이 없습니다.</div>';
    return todos
      .map((t) => {
        const dday = dDayLabel(t.due_date);
        return `<div class="todo-item ${t.completed ? "completed" : ""}" data-id="${t.id}">
          <input type="checkbox" ${t.completed ? "checked" : ""} class="todo-check">
          <span class="todo-text" contenteditable="true" spellcheck="false">${escapeHtml(t.text)}</span>
          ${dday.text ? `<span class="todo-due${dday.overdue ? " overdue" : ""}">${dday.text}</span>` : ""}
          <button type="button" class="todo-del">삭제</button>
        </div>`;
      })
      .join("");
  }

  async function addTodo(milestoneId, inputId, dueInputId, startInputId) {
    const input = document.getElementById(inputId);
    const text = input.value.trim();
    if (!text) return;
    const dueInput = dueInputId ? document.getElementById(dueInputId) : null;
    const startInput = startInputId ? document.getElementById(startInputId) : null;
    await fetch(`${SUPABASE_URL}/rest/v1/project_todos`, {
      method: "POST",
      headers,
      body: JSON.stringify({
        project_id: Number(projectId),
        milestone_id: milestoneId,
        text,
        start_date: startInput ? startInput.value || null : null,
        due_date: dueInput ? dueInput.value || null : null,
      }),
    });
    input.value = "";
    if (dueInput) dueInput.value = "";
    if (startInput) startInput.value = "";
    load();
  }

  function wireTodoEvents(container) {
    if (!container) return;
    container.querySelectorAll(".todo-check").forEach((cb) => {
      cb.addEventListener("change", async (e) => {
        const item = e.target.closest(".todo-item");
        const id = item.dataset.id;
        const completed = e.target.checked;
        item.classList.toggle("completed", completed);
        await fetch(`${SUPABASE_URL}/rest/v1/project_todos?id=eq.${id}`, {
          method: "PATCH",
          headers,
          body: JSON.stringify({ completed }),
        });
        const t = currentTodos.find((x) => x.id === Number(id));
        if (t) t.completed = completed;
        refreshProgress();
      });
    });

    container.querySelectorAll(".todo-text").forEach((span) => {
      const originalText = span.textContent;
      span.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          span.blur();
        }
      });
      span.addEventListener("blur", async () => {
        const item = span.closest(".todo-item");
        const id = item.dataset.id;
        const newText = span.textContent.trim();
        if (!newText) {
          span.textContent = originalText;
          return;
        }
        if (newText === originalText) return;
        await fetch(`${SUPABASE_URL}/rest/v1/project_todos?id=eq.${id}`, {
          method: "PATCH",
          headers,
          body: JSON.stringify({ text: newText }),
        });
      });
    });

    container.querySelectorAll(".todo-del").forEach((btn) => {
      btn.addEventListener("click", async (e) => {
        const item = e.target.closest(".todo-item");
        const id = item.dataset.id;
        await fetch(`${SUPABASE_URL}/rest/v1/project_todos?id=eq.${id}`, { method: "DELETE", headers });
        load();
      });
    });
  }

  // 체크박스 토글 후 화면 전체 새로고침 없이 진행률/타임라인 점 상태만 즉시 갱신
  function refreshProgress() {
    const total = currentTodos.length;
    const done = currentTodos.filter((t) => t.completed).length;
    const pct = total ? Math.round((done / total) * 100) : 0;
    const bar = document.querySelector(".progress-inner");
    const label = document.querySelector(".progress-label");
    if (bar) bar.style.width = pct + "%";
    if (label) label.textContent = `${done}/${total} 완료 · ${pct}%`;
    document.getElementById("timelineBox").innerHTML = renderTimeline();
    wireTimelineEvents();
  }

  // ---- 메모/문서 링크 ----
  function renderNotes() {
    if (!currentNotes.length) return '<div class="empty">등록된 메모/링크가 없습니다.</div>';
    return currentNotes
      .map((n) => {
        const isUrl = /^https?:\/\//.test(n.content.trim());
        const body = isUrl
          ? `<a href="${escapeHtml(n.content)}" target="_blank">${escapeHtml(n.content)}</a>`
          : escapeHtml(n.content).replace(/\n/g, "<br>");
        return `<div class="note-item" data-id="${n.id}">
          ${body}
          <div><button type="button" class="note-del" style="width:auto;">삭제</button></div>
        </div>`;
      })
      .join("");
  }

  function wireNoteEvents() {
    document.querySelectorAll(".note-del").forEach((btn) => {
      btn.addEventListener("click", async (e) => {
        const id = e.target.closest(".note-item").dataset.id;
        await fetch(`${SUPABASE_URL}/rest/v1/project_notes?id=eq.${id}`, { method: "DELETE", headers });
        load();
      });
    });
  }

  async function addNote() {
    const input = document.getElementById("newNote");
    const content = input.value.trim();
    if (!content) return;
    await fetch(`${SUPABASE_URL}/rest/v1/project_notes`, {
      method: "POST",
      headers,
      body: JSON.stringify({ project_id: Number(projectId), content }),
    });
    input.value = "";
    load();
  }

  // ---- 프로젝트 정보 수정 ----
  function showEditBox(project) {
    const box = document.getElementById("editBox");
    const durationType = project.duration_type || "1일";
    const isSingleDay = durationType === "1일";
    box.innerHTML = `
      <label>이름</label>
      <input type="text" id="editName" value="${escapeHtml(project.name)}">
      <label>설명</label>
      <textarea id="editDesc">${escapeHtml(project.description || "")}</textarea>
      <label>상태</label>
      <select id="editStatus">
        <option value="진행중" ${project.status === "진행중" ? "selected" : ""}>진행중</option>
        <option value="완료" ${project.status === "완료" ? "selected" : ""}>완료</option>
        <option value="보류" ${project.status === "보류" ? "selected" : ""}>보류</option>
      </select>
      <label>프로젝트 기간 유형</label>
      <select id="editDurationType">
        <option value="1일" ${durationType === "1일" ? "selected" : ""}>하루(1일)</option>
        <option value="여러날" ${durationType === "여러날" ? "selected" : ""}>여러 날 (2일~1주)</option>
        <option value="한달" ${durationType === "한달" ? "selected" : ""}>한 달 이상</option>
      </select>
      <label id="editEventStartLabel">${isSingleDay ? "행사(실행) 날짜" : "행사(실행) 시작일"}</label>
      <input type="date" id="editStart" value="${project.start_date || ""}">
      <label id="editEventEndLabel" style="${isSingleDay ? "display:none;" : ""}">행사(실행) 종료일</label>
      <input type="date" id="editDue" value="${project.due_date || ""}" style="${isSingleDay ? "display:none;" : ""}">
      <div style="display:flex;gap:8px;margin-top:14px;">
        <button type="button" id="saveEditBtn" style="width:auto;padding:10px 16px;">저장</button>
        <button type="button" id="deleteProjectBtn" style="width:auto;padding:10px 16px;background:#5a1f1f;">프로젝트 삭제</button>
      </div>
      <div class="msg" id="editMsg"></div>
    `;
    document.getElementById("editDurationType").addEventListener("change", (e) => {
      const single = e.target.value === "1일";
      document.getElementById("editEventEndLabel").style.display = single ? "none" : "block";
      document.getElementById("editDue").style.display = single ? "none" : "block";
      document.getElementById("editEventStartLabel").textContent = single ? "행사(실행) 날짜" : "행사(실행) 시작일";
    });
    document.getElementById("saveEditBtn").addEventListener("click", async () => {
      const msg = document.getElementById("editMsg");
      try {
        const newDurationType = document.getElementById("editDurationType").value;
        const newStart = document.getElementById("editStart").value || null;
        const newDue = newDurationType === "1일" ? newStart : document.getElementById("editDue").value || newStart;
        const res = await fetch(`${SUPABASE_URL}/rest/v1/projects?id=eq.${projectId}`, {
          method: "PATCH",
          headers,
          body: JSON.stringify({
            name: document.getElementById("editName").value.trim(),
            description: document.getElementById("editDesc").value.trim(),
            status: document.getElementById("editStatus").value,
            duration_type: newDurationType,
            start_date: newStart,
            due_date: newDue,
          }),
        });
        if (!res.ok) throw new Error(await res.text());
        load();
      } catch (err) {
        msg.className = "msg err";
        msg.textContent = "저장 실패: " + err.message;
      }
    });
    document.getElementById("deleteProjectBtn").addEventListener("click", async () => {
      if (!confirm("이 프로젝트와 할 일/메모/타임라인을 전부 삭제할까요? 되돌릴 수 없습니다.")) return;
      await fetch(`${SUPABASE_URL}/rest/v1/projects?id=eq.${projectId}`, { method: "DELETE", headers });
      location.href = "/projects/list.html";
    });
  }

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/sw.js");
  }
</script>
</body>
</html>
