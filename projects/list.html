<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>프로젝트 목록 — 뽈로</title>
<link rel="stylesheet" href="/projects/style.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0d1b2a">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
  <div class="wrap">
    <a class="back" href="/projects/index.html">← 프로젝트 관리</a>
    <h1 style="font-size:1.4rem;margin-bottom:1.2rem;">프로젝트 목록</h1>

    <form id="addForm">
      <label for="name">프로젝트 이름</label>
      <input type="text" id="name" required>
      <label for="description">설명 (선택)</label>
      <textarea id="description" style="min-height:60px;"></textarea>
      <label for="duration_type">프로젝트 기간 유형</label>
      <select id="duration_type">
        <option value="1일">하루(1일)</option>
        <option value="여러날">여러 날 (2일~1주)</option>
        <option value="한달">한 달 이상</option>
      </select>
      <label id="eventStartLabel" for="event_start">행사(실행) 날짜</label>
      <div>
        <span class="datepick">
          <input type="date" id="event_start" class="datepick-input" required>
          <span class="datepick-display">📅 <span class="datepick-text" id="event_start_text">날짜</span></span>
        </span>
      </div>
      <label for="event_end" id="eventEndLabel" style="display:none;">행사(실행) 종료일</label>
      <div id="eventEndWrap" style="display:none;">
        <span class="datepick">
          <input type="date" id="event_end" class="datepick-input">
          <span class="datepick-display">📅 <span class="datepick-text" id="event_end_text">날짜</span></span>
        </span>
      </div>

      <label>프로젝트 유형 (해당되는 것 모두 선택, 없으면 비워두기)</label>
      <div class="check-row" id="typeChecks">
        <label><input type="checkbox" value="교육"> 교육</label>
        <label><input type="checkbox" value="연구조사"> 연구/조사</label>
      </div>

      <label>프로젝트 조건</label>
      <div class="check-row">
        <label><input type="checkbox" id="requires_onsite"> 행사/현장 운영 필요</label>
        <label><input type="checkbox" id="requires_recruitment"> 참가자 모집 필요</label>
        <label><input type="checkbox" id="is_public_fund"> 공공기관/지원기관 관련</label>
        <label><input type="checkbox" id="requires_accommodation"> 숙박 필요</label>
      </div>

      <button type="submit" id="addBtn">새 프로젝트 만들기</button>
      <div class="msg" id="msg"></div>
    </form>

    <div class="section-title">진행 중 · 보류 · 완료</div>
    <div id="list"><div class="empty">불러오는 중...</div></div>
  </div>

<script>
  const SUPABASE_URL = "https://oenqrlgmnkpzxsavnfyo.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_sZ4wQgaC5f-i40pVzf0vIA_R7iJWDf5";
  const headers = {
    apikey: SUPABASE_ANON_KEY,
    Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
    "Content-Type": "application/json",
  };

  function escapeHtml(s) {
    return String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  }

  // 화면 표시용 - YYYY-MM-DD를 M/D로 간단히 (연도 생략)
  function fmtDate(dateStr) {
    if (!dateStr) return "";
    const parts = dateStr.split("-");
    if (parts.length !== 3) return dateStr;
    return `${Number(parts[1])}/${Number(parts[2])}`;
  }

  // 달력 아이콘형 날짜칸 - 실제 <input type="date">에 값이 바뀌면 옆의 짧은 텍스트(M/D)를 갱신
  function wireDatePicker(inputId, placeholder) {
    const input = document.getElementById(inputId);
    const textEl = document.getElementById(inputId + "_text");
    if (!input || !textEl) return;
    const refresh = () => { textEl.textContent = input.value ? fmtDate(input.value) : (placeholder || "날짜"); };
    input.addEventListener("change", refresh);
    refresh();
  }
  wireDatePicker("event_start", "날짜");
  wireDatePicker("event_end", "날짜");

  function dDayLabel(dueDate) {
    if (!dueDate) return { text: "", overdue: false };
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const due = new Date(dueDate + "T00:00:00");
    const diffDays = Math.round((due - today) / 86400000);
    if (diffDays === 0) return { text: `행사: ${fmtDate(dueDate)} (D-day)`, overdue: false };
    if (diffDays > 0) return { text: `행사: ${fmtDate(dueDate)} (D-${diffDays})`, overdue: false };
    return { text: `행사: ${fmtDate(dueDate)} (D+${Math.abs(diffDays)})`, overdue: true };
  }

  async function loadProjects() {
    const list = document.getElementById("list");
    try {
      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/projects?select=*,project_todos(completed)&order=created_at.desc`,
        { headers }
      );
      const rows = await res.json();

      if (!rows.length) {
        list.innerHTML = '<div class="empty">아직 등록된 프로젝트가 없습니다.</div>';
        return;
      }

      list.innerHTML = rows
        .map((p) => {
          const todos = p.project_todos || [];
          const total = todos.length;
          const done = todos.filter((t) => t.completed).length;
          const pct = total ? Math.round((done / total) * 100) : 0;
          const dday = dDayLabel(p.due_date);
          return `<a class="project-card" href="/projects/detail.html?id=${p.id}">
            <div class="row">
              <div class="name">${escapeHtml(p.name)}</div>
              <span class="status-badge status-${escapeHtml(p.status)}">${escapeHtml(p.status)}</span>
            </div>
            ${dday.text ? `<div class="due${dday.overdue ? " overdue" : ""}">${dday.text}</div>` : ""}
            <div class="progress-outer"><div class="progress-inner" style="width:${pct}%;"></div></div>
            <div class="progress-label">${done}/${total} 완료 · ${pct}%</div>
          </a>`;
        })
        .join("");
    } catch (err) {
      list.innerHTML = '<div class="empty">불러오기 실패: ' + err.message + "</div>";
    }
  }

  document.getElementById("duration_type").addEventListener("change", (e) => {
    const isSingleDay = e.target.value === "1일";
    document.getElementById("eventEndLabel").style.display = isSingleDay ? "none" : "block";
    document.getElementById("eventEndWrap").style.display = isSingleDay ? "none" : "block";
    document.getElementById("eventStartLabel").textContent = isSingleDay ? "행사(실행) 날짜" : "행사(실행) 시작일";
  });

  document.getElementById("addForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("addBtn");
    const msg = document.getElementById("msg");
    msg.className = "msg";
    btn.disabled = true;
    btn.textContent = "만드는 중...";
    try {
      const durationType = document.getElementById("duration_type").value;
      const eventStart = document.getElementById("event_start").value;
      const eventEnd = durationType === "1일" ? eventStart : document.getElementById("event_end").value || eventStart;
      const projectTypes = [...document.querySelectorAll("#typeChecks input:checked")].map((el) => el.value);
      const res = await fetch(`${SUPABASE_URL}/rest/v1/projects`, {
        method: "POST",
        headers: { ...headers, Prefer: "return=representation" },
        body: JSON.stringify({
          name: document.getElementById("name").value.trim(),
          description: document.getElementById("description").value.trim(),
          duration_type: durationType,
          start_date: eventStart || null,
          due_date: eventEnd || null,
          project_types: projectTypes,
          requires_onsite: document.getElementById("requires_onsite").checked,
          requires_recruitment: document.getElementById("requires_recruitment").checked,
          is_public_fund: document.getElementById("is_public_fund").checked,
          requires_accommodation: document.getElementById("requires_accommodation").checked,
        }),
      });
      if (!res.ok) throw new Error(await res.text());
      const [created] = await res.json();
      // 만들자마자 상세페이지로 이동 - 거기서 기본 타임라인을 자동으로 채워줌
      location.href = `/projects/detail.html?id=${created.id}&init=1`;
    } catch (err) {
      msg.className = "msg err";
      msg.textContent = "실패: " + err.message;
    } finally {
      btn.disabled = false;
      btn.textContent = "새 프로젝트 만들기";
    }
  });

  loadProjects();

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/sw.js");
  }
</script>
</body>
</html>
