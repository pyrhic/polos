<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>뽈로</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #000000;
    font-family: -apple-system, "Malgun Gothic", sans-serif;
    color: #ffffff;
  }

  .screens {
    position: fixed;
    inset: 0;
    height: 200vh;
    transition: transform 0.5s cubic-bezier(0.22, 0.61, 0.36, 1);
  }
  .screens.at-carousel { transform: translateY(-100vh); }

  .screen {
    height: 100vh;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* 화면 1: 문구/소개 */
  #screenQuote { flex-direction: column; padding: 0 32px; text-align: center; }
  .quote-text {
    font-size: 1.4rem;
    font-weight: 700;
    line-height: 1.6;
    max-width: 420px;
  }
  .quote-source {
    margin-top: 14px;
    font-size: 0.85rem;
    color: #9a9a9a;
  }
  .chevron-up {
    position: absolute;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 1.6rem;
    color: #6a6a6a;
    animation: bounceUp 1.8s ease-in-out infinite;
    cursor: pointer;
    padding: 16px;
  }
  @keyframes bounceUp {
    0%, 100% { transform: translate(-50%, 0); opacity: 0.4; }
    50% { transform: translate(-50%, -8px); opacity: 1; }
  }

  /* 화면 2: 로고 캐러셀 */
  #screenCarousel { flex-direction: column; overflow: hidden; }
  .chevron-down {
    position: absolute;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 1.4rem;
    color: #6a6a6a;
    animation: bounceDown 1.8s ease-in-out infinite;
    cursor: pointer;
    padding: 16px;
    z-index: 5;
  }
  @keyframes bounceDown {
    0%, 100% { transform: translate(-50%, 0); opacity: 0.4; }
    50% { transform: translate(-50%, 8px); opacity: 1; }
  }
  .logo-scroll {
    position: absolute;
    top: 44%;
    left: 0;
    transform: translateY(-50%);
    display: flex;
    width: 100%;
    padding: 0 15%;
    overflow-x: auto;
    overflow-y: hidden;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    perspective: 900px;
    scrollbar-width: none;
    cursor: grab;
  }
  .logo-scroll::-webkit-scrollbar { display: none; }
  .logo-scroll.dragging { cursor: grabbing; scroll-snap-type: none; }
  .logo-item {
    flex: 0 0 70%;
    scroll-snap-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 14px;
  }
  /* 양끝 빈 로고: 보이지 않고, 스냅 정렬도 없어서 스크롤이 여기서 멈추지 못하고
     항상 실제 로고 쪽으로 되돌아감 (양끝 로고가 완전히 평면으로 펴지도록 여유 공간만 제공) */
  .logo-item.spacer {
    visibility: hidden;
    pointer-events: none;
    scroll-snap-align: none;
  }
  /* 로고 박스 폭은 캐러셀 칸(코버플로우용 70% 폭)이 아니라 각 페이지의 카드 폭(min(460px, 화면폭-40px))과
     똑같은 기준으로 계산 - 칸 폭 기준으로 하면 좁은 화면(폰)에서 로고가 버튼보다 훨씬 작아 보이는 문제가 있었음 */
  .logo-item .logo-box {
    width: min(460px, calc(100vw - 40px));
    margin: 0 auto;
  }
  /* 사교원/트레이딩/글쓰기: 각 페이지에서 쓰는 것과 같은 박스 */
  .logo-item.boxed .logo-box {
    border-radius: 16px;
    overflow: hidden;
  }
  .logo-item.boxed .logo-box img {
    width: 100%;
    height: 180px;
    object-fit: cover;
  }
  /* 스킴밐스: 투명 로고라 박스 없이 원래 페이지처럼 그대로(카드 폭의 70%) */
  .logo-item.plain .logo-box img {
    width: 70%;
    height: auto;
    margin: 0 auto;
  }
  /* 좌/우 1/4 구역 호버 힌트: 기존 chevron(︿ ﹀)을 90도 돌려 쓴 ‹ › 모양, 같은 회색 + 같은 깜빡임.
     크기/색/가장자리 거리는 여기 변수만 바꾸면 됨 (모노톤) */
  :root { --edge-chev-size: 1.6rem; --edge-chev-color: #9a9a9a; --edge-chev-gap: 24px; }
  .edge-chev {
    position: fixed;
    top: 50%;
    font-size: var(--edge-chev-size);
    color: var(--edge-chev-color);
    opacity: 0;
    transition: opacity 0.15s;
    pointer-events: none;
    z-index: 900;
    padding: 16px;
  }
  .edge-chev span { display: block; animation: bounceLeft 1.8s ease-in-out infinite; }
  .edge-chev.show { opacity: 1; }
  body:not(.at-carousel) .edge-chev { opacity: 0; }
  #edgeLeft { left: calc(var(--edge-chev-gap) - 16px); transform: translateY(-50%); }
  #edgeRight { right: calc(var(--edge-chev-gap) - 16px); transform: translateY(-50%); }
  #edgeLeft span { transform: rotate(90deg); animation-name: bounceLeft; }
  #edgeRight span { transform: rotate(-90deg); animation-name: bounceRight; }
  @keyframes bounceLeft {
    0%, 100% { transform: translateX(0) rotate(90deg); opacity: 0.4; }
    50% { transform: translateX(-8px) rotate(90deg); opacity: 1; }
  }
  @keyframes bounceRight {
    0%, 100% { transform: translateX(0) rotate(-90deg); opacity: 0.4; }
    50% { transform: translateX(8px) rotate(-90deg); opacity: 1; }
  }
  .logo-item img {
    display: block;
    -webkit-user-drag: none;
    user-select: none;
  }

</style>
</head>
<body>
  <div class="screens" id="screens">
    <div class="screen" id="screenQuote">
      <div>
        <p class="quote-text" id="quoteText"></p>
        <p class="quote-source" id="quoteSource"></p>
      </div>
      <div class="chevron-up" id="chevronUp">︿</div>
    </div>

    <div class="screen" id="screenCarousel">
      <div class="chevron-down" id="chevronDown">﹀</div>
      <div class="logo-scroll" id="logoScroll">
        <div class="logo-item spacer" aria-hidden="true"></div>
        <div class="logo-item plain" data-id="skimmmiks">
          <div class="logo-box"><img src="/skimmmiks/logo.png" alt=""></div>
        </div>
        <div class="logo-item boxed" data-id="todo">
          <div class="logo-box"><img src="/todo/logo.png" alt=""></div>
        </div>
        <div class="logo-item boxed" data-id="trading">
          <div class="logo-box"><img src="/trading/logo.png" alt=""></div>
        </div>
        <div class="logo-item spacer" aria-hidden="true"></div>
      </div>
    </div>
  </div>

<div class="edge-chev" id="edgeLeft"><span>﹀</span></div>
<div class="edge-chev" id="edgeRight"><span>﹀</span></div>

<script>
  const QUOTES = [
    { text: "시작이 반이다.", source: "" },
    { text: "오늘 걷지 않으면 내일은 뛰어야 한다.", source: "" },
    { text: "작은 습관이 쌓여 방향이 된다.", source: "" },
    { text: "포기하지 않는 한 실패는 없다.", source: "" },
    { text: "지금 이 순간에 집중하라.", source: "" },
    { text: "완벽한 때는 없다, 지금이 그때다.", source: "" },
  ];
  const q = QUOTES[Math.floor(Math.random() * QUOTES.length)];
  document.getElementById("quoteText").textContent = q.text;
  document.getElementById("quoteSource").textContent = q.source;

  const screens = document.getElementById("screens");
  const logoScroll = document.getElementById("logoScroll");
  const logoItems = [...document.querySelectorAll(".logo-item")];

  // level: 0=문구, 1=캐러셀
  let level = 0;
  let centeredId = null;

  function setLevel(n) {
    level = n;
    screens.classList.toggle("at-carousel", level === 1);
    document.body.classList.toggle("at-carousel", level === 1); // 캐러셀 화면이 아니면 호버선 숨김(CSS)
  }

  document.getElementById("chevronUp").addEventListener("click", () => setLevel(1));
  document.getElementById("chevronDown").addEventListener("click", () => setLevel(0));

  // 세로 스와이프: 위로 = 문구 → 캐러셀, 아래로 = 캐러셀 → 문구
  let startX = null;
  let startY = null;
  document.addEventListener("touchstart", (e) => {
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
  }, { passive: true });

  document.addEventListener("touchend", (e) => {
    if (startX === null) return;
    const dx = e.changedTouches[0].clientX - startX;
    const dy = e.changedTouches[0].clientY - startY;
    startX = null;

    if (Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 60) {
      if (dy < 0 && level === 0) setLevel(1);
      else if (dy > 0 && level === 1) setLevel(0);
    }
  }, { passive: true });

  // 로고 캐러셀: 스크롤 위치에 따라 코버플로우처럼 회전/축소되는 효과
  function updateCoverflow() {
    const rect = logoScroll.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    let best = { id: null, dist: Infinity };
    logoItems.forEach((item) => {
      // 측정 전에 transform을 잠깐 초기화 - 회전된 상태 그대로 재면
      // bounding box가 찌그러져서(원근 축소) 중심 계산이 매번 어긋남(양끝 항목이 평면으로 안 펴지는 원인)
      item.style.transform = "none";
      const r = item.getBoundingClientRect();
      const itemCenter = r.left + r.width / 2;
      const dist = (itemCenter - centerX) / rect.width;
      const clamped = Math.max(-1, Math.min(1, dist));
      const rotateY = clamped * -45;
      const scale = 1 - Math.abs(clamped) * 0.3;
      const opacity = 1 - Math.abs(clamped) * 0.55;
      item.style.transform = `perspective(900px) rotateY(${rotateY}deg) scale(${scale})`;
      // 로고 박스 폭이 이제 화면폭 기준이라 칸 폭보다 넓어질 수 있어(옆 항목과 살짝 겹침) -
      // 가운데에 가까운 항목이 항상 위로 쌓이게 해서 자연스럽게 덮이도록 함
      item.style.zIndex = Math.round((1 - Math.abs(clamped)) * 100);
      item.style.opacity = opacity;
      if (item.dataset.id && Math.abs(dist) < Math.abs(best.dist)) {
        best = { id: item.dataset.id, dist };
      }
    });
    centeredId = best.id;
  }
  logoScroll.addEventListener("scroll", updateCoverflow, { passive: true });

  // 로고 폭(70%)과 좌우 여백을 같은 기준(컨테이너 전체 폭)으로 JS에서 직접 계산
  // - CSS % 패딩만 쓰면 패딩이 "안쪽 콘텐츠 박스" 기준으로 계산돼서, 맨 앞/뒤 로고는
  //   중앙까지 스크롤이 물리적으로 닿지 않아(경계에 막혀) 완전히 평면으로 안 펴지는 문제가 있었음
  function layoutCoverflow() {
    const w = logoScroll.clientWidth;
    // PC처럼 화면이 넓을 때 폭의 70%를 그대로 쓰면 카드가 너무 커져서 옆 로고가 화면 밖으로 밀려남 - 상한선을 둠
    const itemW = Math.min(w * 0.7, 480);
    const pad = (w - itemW) / 2;
    logoScroll.style.paddingLeft = pad + "px";
    logoScroll.style.paddingRight = pad + "px";
    logoItems.forEach((item) => {
      item.style.flex = `0 0 ${itemW}px`;
    });
  }

  // 초기 위치: 사교원이 가운데. 아이템 실제 위치 기준으로 계산(폭 비율에 안 흔들리게)
  function centerOn(idx, smooth) {
    const item = logoItems[idx];
    const target = item.offsetLeft - (logoScroll.clientWidth - item.clientWidth) / 2;
    logoScroll.scrollTo({ left: target, behavior: smooth ? "smooth" : "instant" });
  }
  // 섹션 화면 하단 스킴밐스 로고로 돌아오면(/?carousel=todo 등) 문구 화면을 건너뛰고
  // 캐러셀을 바로 열고, 방금 있던 섹션 로고를 가운데에 둠
  const params = new URLSearchParams(location.search);
  const fromCarousel = params.has("carousel");
  let initialIndex = logoItems.findIndex((it) => it.dataset.id === (params.get("carousel") || "todo"));
  if (initialIndex === -1) initialIndex = logoItems.findIndex((it) => it.dataset.id === "todo");
  window.addEventListener("resize", () => {
    layoutCoverflow();
    centerOn(initialIndex, false);
    updateCoverflow();
  });

  layoutCoverflow();
  centerOn(initialIndex, false);
  updateCoverflow();

  if (fromCarousel) {
    screens.style.transition = "none"; // 올라가는 애니메이션 없이 바로 캐러셀
    setLevel(1);
    screens.offsetHeight; // 위치를 먼저 반영시킨 뒤 애니메이션 원래대로
    screens.style.transition = "";
    history.replaceState(null, "", "/"); // 주소는 깔끔하게
  }

  // PC 마우스 휠(세로 휠)을 가로 스크롤로 변환
  logoScroll.addEventListener("wheel", (e) => {
    if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
      logoScroll.scrollLeft += e.deltaY;
      e.preventDefault();
    }
  }, { passive: false });

  // PC 마우스 드래그로 스크롤
  let dragging = false;
  let dragStartX = 0;
  let dragScrollStart = 0;
  let dragMoved = 0;
  let justDragged = false;

  logoScroll.addEventListener("mousedown", (e) => {
    dragging = true;
    dragMoved = 0;
    dragStartX = e.pageX;
    dragScrollStart = logoScroll.scrollLeft;
    logoScroll.classList.add("dragging");
  });
  window.addEventListener("mousemove", (e) => {
    if (!dragging) return;
    const dx = e.pageX - dragStartX;
    dragMoved = Math.abs(dx);
    logoScroll.scrollLeft = dragScrollStart - dx;
  });
  window.addEventListener("mouseup", () => {
    if (!dragging) return;
    dragging = false;
    logoScroll.classList.remove("dragging");
    justDragged = dragMoved >= 6;
    setTimeout(() => { justDragged = false; }, 0); // 클릭이 안 생긴 경우 다음 클릭이 먹히지 않도록 정리
  });

  // 캐러셀 화면 클릭/탭 처리 (드래그가 어려운 PC용 좌우 1/4 구역 이동 포함)
  // - 화면 가로 기준 왼쪽 1/4 구역을 누르면 이전 로고, 오른쪽 1/4 구역을 누르면 다음 로고로 한 칸 이동
  //   (양끝에서는 아무 일 없음, 순환 안 함). 호버 시 해당 쪽 화면 끝에 chevron으로 이동 가능함을 알림. 이 구역에서 옆 로고를 직접 눌러 고르던 동작은 한 칸 이동으로 대체됨
  // - 가운데 구역: 가운데 로고를 누르면 그 섹션 메인 화면으로 이동, 그 외 로고는 가운데로 이동
  // - 드래그 직후 마우스를 놓으며 생기는 클릭은 무시(justDragged)
  const EDGE_ZONE = 0.25;
  const realItems = logoItems.filter((it) => it.dataset.id);
  let lastNav = { idx: -1, t: 0 };

  function edgeZone(clientX) {
    const ratio = clientX / window.innerWidth;
    return ratio < EDGE_ZONE ? -1 : ratio > 1 - EDGE_ZONE ? 1 : 0;
  }
  // 스크롤 애니메이션 중에 빠르게 연타하면 아직 도착 전이라 제자리걸음이 되므로, 직전 목표를 기준으로 계산
  function stepIndex(dir) {
    const cur = Date.now() - lastNav.t < 500 && lastNav.idx >= 0
      ? lastNav.idx
      : realItems.findIndex((it) => it.dataset.id === centeredId);
    const next = cur + dir;
    return next < 0 || next >= realItems.length ? -1 : next;
  }

  const screenCarousel = document.getElementById("screenCarousel");
  screenCarousel.addEventListener("click", (e) => {
    if (justDragged) {
      justDragged = false;
      e.preventDefault();
      return;
    }
    if (level !== 1) return;
    if (e.target.closest("#chevronDown")) return;
    const zone = edgeZone(e.clientX);
    if (zone !== 0) {
      const next = stepIndex(zone);
      if (next === -1) return;
      lastNav = { idx: next, t: Date.now() };
      centerOn(logoItems.indexOf(realItems[next]), true);
      if (e.pointerType === "mouse") lastMouseX = e.clientX;
      updateEdgeLines(); // 끝에 도달했으면 chevron이 사라짐
      return;
    }
    const item = e.target.closest(".logo-item");
    if (!item || !item.dataset.id) return;
    if (item.dataset.id === centeredId) {
      location.href = "/" + item.dataset.id + "/";
    } else {
      centerOn(logoItems.indexOf(item), true);
    }
  });

  // 이동 가능 구역 힌트: 마우스가 좌/우 1/4 구역 위에 있고 그 방향으로 더 갈 수 있을 때만
  // 해당 화면 끝의 chevron(.edge-chev, 기존 ﹀를 돌린 ‹ ›)을 서서히 보여줌 (커서는 바꾸지 않음. 터치/가운데 구역/끝에서는 숨김)
  const edgeLines = { "-1": document.getElementById("edgeLeft"), "1": document.getElementById("edgeRight") };
  let lastMouseX = null;
  function updateEdgeLines() {
    const zone = lastMouseX === null || dragging || level !== 1 ? 0 : edgeZone(lastMouseX);
    const show = zone !== 0 && stepIndex(zone) !== -1;
    edgeLines["-1"].classList.toggle("show", show && zone === -1);
    edgeLines["1"].classList.toggle("show", show && zone === 1);
  }
  screenCarousel.addEventListener("pointermove", (e) => {
    if (e.pointerType !== "mouse") return;
    lastMouseX = e.target.closest("#chevronDown") ? null : e.clientX;
    updateEdgeLines();
  });
  screenCarousel.addEventListener("pointerleave", () => { lastMouseX = null; updateEdgeLines(); });
  logoScroll.addEventListener("mousedown", () => { lastMouseX = null; updateEdgeLines(); });
  document.getElementById("chevronDown").addEventListener("click", () => { lastMouseX = null; updateEdgeLines(); });

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/sw.js");
  }
</script>
<script src="/app-menu.js"></script>
</body>
</html>
