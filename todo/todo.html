<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>투두리스트 — 사교원</title>
<link rel="stylesheet" href="/todo/style.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0d1b2a">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
  <div class="wrap">
    <a class="back" href="/todo/index.html">← 돌아가기</a>
    <h1 style="font-size:1.4rem;margin-bottom:1.2rem;">투두리스트</h1>

    <div class="todo-add-row">
      <input type="text" id="newTodo" placeholder="할 일 입력 후 Enter">
      <button type="button" id="addBtn">추가</button>
    </div>
    <div class="msg" id="msg"></div>

    <div id="list"><div class="empty">불러오는 중...</div></div>
  </div>

<script>
  const SUPABASE_URL = "https://oenqrlgmnkpzxsavnfyo.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_sZ4wQgaC5f-i40pVzf0vIA_R7iJWDf5";
  const headers = {
    apikey: SUPABASE_ANON_KEY,
    Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
    "Content-Type": "application/json",
  };

  function showError(err) {
    const msg = document.getElementById("msg");
    msg.className = "msg err";
    msg.textContent = "오류: " + err;
  }

  async function loadTodos() {
    const list = document.getElementById("list");
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/todos?select=*&order=sort_order.asc.nullslast,id.asc`, { headers });
      const rows = await res.json();

      if (!rows.length) {
        list.innerHTML = '<div class="empty">할 일이 없습니다.</div>';
        return;
      }

      list.innerHTML = rows
        .map(
          (row) => `<div class="todo-item ${row.completed ? "completed" : ""} ${row.flagged ? "flagged" : ""}" data-id="${row.id}">
            <input type="checkbox" ${row.completed ? "checked" : ""} class="todo-check">
            <span class="todo-text" contenteditable="true" spellcheck="false"></span>
            <span class="todo-handle">⠿</span>
            <button type="button" class="todo-del">삭제</button>
          </div>`
        )
        .join("");

      // 텍스트는 XSS 방지를 위해 textContent로 안전하게 채움
      document.querySelectorAll(".todo-item").forEach((el, i) => {
        el.querySelector(".todo-text").textContent = rows[i].text;
      });

      document.querySelectorAll(".todo-check").forEach((cb) => {
        // 누를 때마다 안 함 -> 완료(삭선) -> 완료(굵게) -> 안 함 순으로 순환.
        // (체크박스의 checked를 change 이벤트 안에서 직접 조정 - click에서 preventDefault로
        // 막으면 브라우저가 checked를 클릭 이전 값으로 강제로 되돌려버려서 안 먹힘)
        cb.addEventListener("change", async (e) => {
          const item = cb.closest(".todo-item");
          const id = item.dataset.id;
          const wasFlagged = item.classList.contains("flagged");

          let completed, flagged;
          if (wasFlagged) {
            completed = false;
            flagged = false;
            cb.checked = false;
          } else if (cb.checked) {
            completed = true;
            flagged = false;
          } else {
            completed = true;
            flagged = true;
            cb.checked = true;
          }

          item.classList.toggle("completed", completed);
          item.classList.toggle("flagged", flagged);

          try {
            await fetch(`${SUPABASE_URL}/rest/v1/todos?id=eq.${id}`, {
              method: "PATCH",
              headers,
              body: JSON.stringify({ completed, flagged }),
            });
          } catch (err) {
            showError(err.message);
          }
        });
      });

      document.querySelectorAll(".todo-text").forEach((span, i) => {
        const originalText = rows[i].text;
        span.addEventListener("keydown", (e) => {
          if (e.key === "Enter") {
            e.preventDefault();
            span.blur();
          }
        });
        span.addEventListener("blur", async () => {
          const item = span.closest(".todo-item");
          const id = item.dataset.id;
          const newText = span.textContent.trim();
          if (!newText) {
            span.textContent = originalText; // 빈 값이면 되돌림
            return;
          }
          if (newText === originalText) return;
          try {
            await fetch(`${SUPABASE_URL}/rest/v1/todos?id=eq.${id}`, {
              method: "PATCH",
              headers,
              body: JSON.stringify({ text: newText }),
            });
          } catch (err) {
            showError(err.message);
          }
        });
      });

      document.querySelectorAll(".todo-del").forEach((btn) => {
        btn.addEventListener("click", async (e) => {
          const item = e.target.closest(".todo-item");
          const id = item.dataset.id;
          try {
            await fetch(`${SUPABASE_URL}/rest/v1/todos?id=eq.${id}`, {
              method: "DELETE",
              headers,
            });
            loadTodos();
          } catch (err) {
            showError(err.message);
          }
        });
      });

      attachDragHandlers();
    } catch (err) {
      list.innerHTML = '<div class="empty">불러오기 실패: ' + err.message + "</div>";
    }
  }

  // 길게 누르면 순서 조정 - pointer 이벤트로 롱프레스 감지 후 드래그로 순서 변경
  const LONG_PRESS_MS = 450;
  const MOVE_CANCEL_PX = 8;

  function attachDragHandlers() {
    document.querySelectorAll(".todo-item").forEach((item) => {
      let pressTimer = null;
      let dragging = false;
      let startX = 0;
      let startY = 0;
      let baseTop = 0;
      let baseLeft = 0;
      let pointerId = null;
      let placeholder = null;

      item.addEventListener("contextmenu", (e) => e.preventDefault());

      item.addEventListener("pointerdown", (e) => {
        if (e.target.closest(".todo-check, .todo-del")) return;
        startX = e.clientX;
        startY = e.clientY;
        pointerId = e.pointerId;
        item.setPointerCapture(pointerId);

        pressTimer = setTimeout(() => {
          pressTimer = null;
          dragging = true;
          const rect = item.getBoundingClientRect();
          baseTop = rect.top;
          baseLeft = rect.left;

          // item을 DOM에서 떼어내지 않고(포인터 캡처가 풀리지 않도록) 그 자리에 placeholder만 넣고
          // item 자체는 fixed로 띄워서 손가락/마우스를 따라오게 만듦
          placeholder = document.createElement("div");
          placeholder.className = "todo-placeholder";
          placeholder.style.height = rect.height + "px";
          item.parentNode.insertBefore(placeholder, item);

          item.classList.add("dragging-source");
          item.style.position = "fixed";
          item.style.left = baseLeft + "px";
          item.style.top = baseTop + "px";
          item.style.width = rect.width + "px";
          item.style.zIndex = "100";
          item.style.pointerEvents = "none";

          if (navigator.vibrate) navigator.vibrate(10);
        }, LONG_PRESS_MS);
      });

      item.addEventListener("pointermove", (e) => {
        if (pressTimer && (Math.abs(e.clientX - startX) > MOVE_CANCEL_PX || Math.abs(e.clientY - startY) > MOVE_CANCEL_PX)) {
          clearTimeout(pressTimer);
          pressTimer = null;
          return;
        }
        if (!dragging) return;
        e.preventDefault();
        item.style.top = baseTop + (e.clientY - startY) + "px";

        const siblings = Array.from(document.querySelectorAll("#list .todo-item:not(.dragging-source)"));
        let target = null;
        for (const sib of siblings) {
          const r = sib.getBoundingClientRect();
          if (e.clientY < r.top + r.height / 2) {
            target = sib;
            break;
          }
        }
        const list = document.getElementById("list");
        if (target) list.insertBefore(placeholder, target);
        else list.appendChild(placeholder);
      });

      function finishDrag(commit) {
        if (pressTimer) {
          clearTimeout(pressTimer);
          pressTimer = null;
        }
        if (dragging) {
          item.classList.remove("dragging-source");
          item.style.position = "";
          item.style.left = "";
          item.style.top = "";
          item.style.width = "";
          item.style.zIndex = "";
          item.style.pointerEvents = "";
          if (placeholder) placeholder.replaceWith(item);
          if (commit) persistOrder();
        }
        dragging = false;
        placeholder = null;
        if (pointerId !== null) {
          try {
            item.releasePointerCapture(pointerId);
          } catch (err) {}
        }
        pointerId = null;
      }

      item.addEventListener("pointerup", () => finishDrag(true));
      item.addEventListener("pointercancel", () => finishDrag(false));
    });
  }

  async function persistOrder() {
    const ids = Array.from(document.querySelectorAll("#list .todo-item")).map((el) => el.dataset.id);
    try {
      await Promise.all(
        ids.map((id, i) =>
          fetch(`${SUPABASE_URL}/rest/v1/todos?id=eq.${id}`, {
            method: "PATCH",
            headers,
            body: JSON.stringify({ sort_order: i }),
          })
        )
      );
    } catch (err) {
      showError(err.message);
    }
  }

  async function addTodo() {
    const input = document.getElementById("newTodo");
    const text = input.value.trim();
    if (!text) return;
    try {
      await fetch(`${SUPABASE_URL}/rest/v1/todos`, {
        method: "POST",
        headers,
        body: JSON.stringify({ text }),
      });
      input.value = "";
      loadTodos();
    } catch (err) {
      showError(err.message);
    }
  }

  document.getElementById("addBtn").addEventListener("click", addTodo);
  document.getElementById("newTodo").addEventListener("keydown", (e) => {
    if (e.key === "Enter") addTodo();
  });

  loadTodos();

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/sw.js");
  }
</script>
</body>
</html>
